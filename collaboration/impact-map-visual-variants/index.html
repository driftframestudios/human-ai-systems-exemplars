<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Impact Map visual variants</title>
  <style>
    :root {
      color-scheme: light;

      /* Shared interface */
      --white: #ffffff;
      --black: #17191d;
      --ui-page: #f3efe8;
      --ui-surface: #fffdf9;
      --ui-ink: #24231f;
      --ui-muted: #6d665d;
      --ui-line: #d8d0c4;
      --ui-line-strong: #a79d8e;
      --ui-focus: #bd7419;
      --ui-active: #155c63;
      --ui-active-ink: #ffffff;

      /* Warm editorial */
      --warm-paper: #fbfaf7;
      --warm-field: #f4f1eb;
      --warm-ink: #25231f;
      --warm-muted: #5f594f;
      --warm-line: #a79d8e;
      --warm-line-soft: #d8d0c4;
      --warm-edge: #8d8477;
      --warm-route: #155c63;
      --warm-goal: #fff0cf;
      --warm-actor: #e7f0f0;
      --warm-impact: #f0ede7;
      --warm-discoverable: #edf3de;
      --warm-lane-a: #f6f2ea;
      --warm-lane-b: #fbfaf7;

      /* High-contrast evidence */
      --cobalt-field: #f4f7fd;
      --cobalt-paper: #fffdf7;
      --cobalt-paper-blue: #f4f8ff;
      --cobalt-goal: #dbe9ff;
      --cobalt-actor: #edf4ff;
      --cobalt-impact: #fffdf7;
      --cobalt-discoverable: #f7faff;
      --cobalt-line: #215fbb;
      --cobalt-line-soft: #8aaee9;
      --cobalt-ink: #16345e;
      --cobalt-muted: #4c678d;
      --cobalt-rule: #8aaee9;
      --cobalt-shadow-near: #c3d2ea;
      --cobalt-shadow-far: #dbe4f2;

      /* Soft Color Blocking contract + supplied-image fidelity */
      --soft-contract-blush: #f8cbc7;
      --soft-contract-paper: #f9e8e5;
      --soft-contract-cobalt: #3157ed;
      --soft-contract-chartreuse: #ebff4f;
      --soft-contract-coral: #ff6b63;
      --soft-contract-dusty-yellow: #ded575;
      --soft-contract-pale-rose: #f7d7d4;
      --soft-contract-warm-white: #fff7f4;
      --soft-blush-field: #ffd3d0;
      --soft-blush-paper-01: #fdebe9;
      --soft-blush-paper-02: #feeae9;
      --soft-cobalt-01: #2855f3;
      --soft-cobalt-02: #2955f4;
      --soft-acid-lime: #f2ff67;
      --soft-coral: #fa7065;
      --soft-sand: #e9cf9e;
      --soft-ink: #183a78;
      --soft-edge: #3157ed;

      /* Smooth blueprint vellum */
      --blueprint-extra-dark: #00375b;
      --blueprint-darksome: #092160;
      --blueprint-midnight: #141c5b;
      --blueprint-luminous: #3057e1;
      --blueprint-original: #4a6de5;
      --blueprint-cream: #ced8f7;
      --blueprint-tech-dark: #002082;
      --blueprint-white: #f8fbff;
      --blueprint-yellow: #f2ff67;
      --blueprint-muted: #aebdea;

      /* Calm review */
      --sea-glass-mist: #f1f9f9;
      --sea-glass-foam: #dbf0f0;
      --sea-glass-glass: #bddbdb;
      --sea-glass-tide: #afc8c8;
      --sea-glass-silt: #cdd7d7;
      --sea-glass-stone: #888b8b;
      --sea-glass-line: #717676;
      --sea-glass-ink: #555959;
      --sea-glass-deep-ink: #263f42;

      /* Colors sampled from the supplied focus/presentation images */
      --presentation-page: #f9f8f6;
      --presentation-blush-scrim: #edceca;
      --presentation-panel: #f8ece7;
      --presentation-blue: #2135cc;
      --presentation-blue-muted: #505dd2;
      --presentation-blue-muted-alt: #4e57cc;
      --presentation-lavender-blue: #7b78cb;
      --presentation-yellow: #e9e94f;
      --presentation-gold: #ebdd85;
      --presentation-yellow-dim: #ecea70;
      --presentation-yellow-warm: #eae36a;
      --presentation-mint: #d3e4cb;
      --presentation-mint-dim: #dbe6d1;
      --presentation-lilac: #e4d1dc;
      --presentation-lilac-alt-a: #e3d8ea;
      --presentation-lilac-alt-b: #e0d2e4;
      --presentation-peach: #f1d6c7;
      --presentation-salmon: #da9c8b;
      --presentation-cream: #f5ebdf;

      /* Colors sampled from the supplied actor-lanes image */
      --lane-canvas: #f1e9d2;
      --lane-card: #f8f1d9;
      --lane-info: #d3e4f2;
      --lane-context: #ebe3d1;
      --lane-route: #dde9e8;
      --lane-cream-shadow: #ece5d4;
      --lane-neutral: #d2cdc2;
      --lane-ink: #213252;
      --lane-ink-strong: #1f325b;
      --lane-blue-muted: #556788;
      --lane-slate: #73849c;
      --lane-warm-ink: #5e5023;
      --lane-warm-muted: #887c57;
      --lane-teal-ink: #274444;

      /* Route accents */
      --route-service: #2855f3;
      --route-ai: #6f63c7;
      --route-software: #42745a;
      --route-specification: #c35149;
      --route-unit: #914b68;
      --route-cross-channel: #8c731f;

      /* Active rendering aliases */
      --active-page: var(--warm-paper);
      --active-frame: var(--warm-line-soft);
      --active-ink: var(--warm-ink);
      --active-muted: var(--warm-muted);
      --active-edge: var(--warm-edge);
      --active-route: var(--warm-route);
      --active-pattern-line: var(--warm-line);
      --active-pattern-glow: var(--white);
      --active-mobile-card: var(--warm-paper);
      --active-mobile-actor: var(--warm-actor);
      --active-mobile-impact: var(--warm-impact);
      --active-mobile-discoverable: var(--warm-discoverable);

      --space-1: 0.25rem;
      --space-2: 0.5rem;
      --space-3: 0.75rem;
      --space-4: 1rem;
      --space-5: 1.5rem;
      --space-6: 2rem;
      --radius-sm: 0.5rem;
      --radius-md: 0.9rem;
      --radius-lg: 1.25rem;
      --font-sans: "Arial Nova", "Avenir Next", Futura, "Century Gothic", Arial, sans-serif;
      font-family: var(--font-sans);
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background: var(--ui-page);
      color: var(--ui-ink);
      font-family: var(--font-sans);
      text-rendering: optimizeLegibility;
    }

    button,
    input,
    select {
      font: inherit;
    }

    .icon-bank {
      position: absolute;
      width: 0;
      height: 0;
      overflow: hidden;
    }

    main {
      width: 100%;
      max-width: none;
      margin: 0 auto;
      padding: clamp(0.75rem, 1.35vw, 1.5rem);
    }

    .masthead {
      display: grid;
      gap: var(--space-4);
      margin-bottom: var(--space-4);
    }

    .title-row,
    .control-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-3) var(--space-5);
    }

    .title-copy {
      display: grid;
      gap: var(--space-1);
      max-width: 55rem;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.35rem, 2.1vw, 2rem);
      line-height: 1.12;
      letter-spacing: -0.025em;
    }

    .variant-controls,
    .view-controls,
    .pattern-controls,
    .report-controls,
    .legend {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: var(--space-2);
    }

    .control-cluster {
      display: flex;
      align-items: center;
      gap: var(--space-2);
    }

    .control-label {
      color: var(--ui-muted);
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    html[data-map-view="axonometric"] .pattern-cluster,
    html[data-map-view="narrative"] .pattern-cluster {
      display: none;
    }

    button {
      appearance: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.45rem;
      min-height: 2.35rem;
      border: 1px solid var(--ui-line);
      border-radius: var(--radius-sm);
      background: var(--ui-surface);
      color: var(--ui-ink);
      padding: 0.55rem 0.76rem;
      font-size: 0.84rem;
      font-weight: 700;
      line-height: 1;
      cursor: pointer;
    }

    button:hover {
      border-color: var(--ui-line-strong);
    }

    button[aria-pressed="true"] {
      border-color: var(--ui-active);
      background: var(--ui-active);
      color: var(--ui-active-ink);
    }

    button:focus-visible {
      outline: 3px solid color-mix(in srgb, var(--ui-focus) 42%, transparent);
      outline-offset: 2px;
    }

    .icon-button {
      width: 2.35rem;
      padding: 0;
    }

    .button-icon {
      width: 1.05rem;
      height: 1.05rem;
      flex: 0 0 auto;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .legend {
      color: var(--ui-muted);
      font-size: 0.82rem;
    }

    .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
    }

    .status-shape {
      display: inline-block;
      width: 0.62rem;
      height: 0.62rem;
      border: 2px solid currentColor;
    }

    .status-shape.known {
      border-radius: 50%;
      background: currentColor;
    }

    .status-shape.assumed {
      border-radius: 50%;
      border-style: dashed;
    }

    .status-shape.surface {
      border-radius: 0.12rem;
    }

    .map-shell {
      width: 100%;
      border-radius: var(--radius-lg);
      background: var(--active-page);
      box-shadow: 0 12px 34px color-mix(in srgb, var(--black) 8%, transparent);
      overflow: hidden;
    }

    #impact-map,
    #axonometric-map,
    #narrative-map {
      display: block;
      width: 100%;
      height: auto;
      overflow: visible;
      shape-rendering: geometricPrecision;
    }

    #impact-map text,
    #axonometric-map text,
    #narrative-map text {
      font-family: var(--font-sans);
    }

    #axonometric-map,
    #narrative-sequence {
      display: none;
    }

    .map-shell[data-view="axonometric"] #impact-map,
    .map-shell[data-view="axonometric"] .mobile-map,
    .map-shell[data-view="narrative"] #impact-map,
    .map-shell[data-view="narrative"] #axonometric-map,
    .map-shell[data-view="narrative"] .mobile-map {
      display: none;
    }

    .map-shell[data-view="axonometric"] #axonometric-map {
      display: block;
    }

    .map-shell[data-view="narrative"] #narrative-sequence {
      display: block;
    }

    .narrative-sequence {
      width: 100%;
      background: var(--active-page);
      color: var(--active-ink);
    }

    .narrative-stage {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: var(--active-page);
    }

    #narrative-map [data-narrative-kind],
    #narrative-map [data-narrative-fracture] {
      transition: opacity 180ms ease;
    }

    .narrative-controls {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      align-items: center;
      gap: var(--space-3);
      padding: var(--space-3) var(--space-4) var(--space-4);
      border-top: 1px solid var(--active-frame);
      background: var(--active-page);
    }

    .narrative-step-control {
      min-width: 6.6rem;
      border-color: var(--active-frame);
      background: var(--active-page);
      color: var(--active-ink);
    }

    .narrative-step-control:hover {
      border-color: var(--active-route);
    }

    .narrative-step-control:disabled {
      cursor: default;
      opacity: 0.34;
    }

    .narrative-position {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 0.42rem;
    }

    .narrative-marker {
      width: 2rem;
      min-width: 2rem;
      min-height: 2rem;
      border-color: transparent;
      border-radius: 50%;
      background: transparent;
      color: var(--active-muted);
      padding: 0;
      font-size: 0.75rem;
    }

    .narrative-marker:hover {
      border-color: var(--active-route);
      color: var(--active-ink);
    }

    .narrative-marker[aria-current="step"] {
      border-color: var(--active-route);
      background: var(--active-route);
      color: var(--active-page);
    }

    .narrative-counter {
      min-width: 5.2rem;
      color: var(--active-muted);
      font-size: 0.76rem;
      font-weight: 800;
      text-align: center;
    }

    .mobile-map {
      display: none;
      padding: var(--space-4);
      background: var(--active-page);
      color: var(--active-ink);
    }

    .mobile-goal,
    .mobile-branch {
      border: 1px solid var(--active-frame);
      border-radius: var(--radius-md);
      background: var(--active-mobile-card);
    }

    .mobile-goal {
      margin-bottom: var(--space-5);
      padding: var(--space-5);
      border-left: 0.35rem solid var(--active-route);
      font-size: 1.08rem;
      font-weight: 750;
      line-height: 1.42;
    }

    .mobile-branch {
      display: grid;
      gap: var(--space-3);
      margin-bottom: var(--space-5);
      padding: var(--space-4);
    }

    .mobile-actor {
      display: grid;
      place-items: center;
      min-height: 5rem;
      border-radius: var(--radius-sm);
      background: var(--active-mobile-actor);
      padding: var(--space-4);
      text-align: center;
      font-size: 1.12rem;
      font-weight: 800;
    }

    .mobile-impact,
    .mobile-discoverable {
      border-radius: var(--radius-sm);
      padding: var(--space-4);
      line-height: 1.42;
    }

    .mobile-impact {
      background: var(--active-mobile-impact);
      color: var(--active-ink);
    }

    .mobile-discoverable {
      background: var(--active-mobile-discoverable);
    }

    .mobile-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem 0.65rem;
      margin-top: var(--space-2);
      color: var(--active-muted);
      font-size: 0.8rem;
      font-weight: 700;
    }

    .mobile-route {
      color: var(--active-route);
    }

    @media (max-width: 980px) {
      main {
        padding: var(--space-4);
      }

      .map-shell[data-view="branch"] #impact-map {
        display: none;
      }

      .map-shell[data-view="branch"] .mobile-map {
        display: block;
      }

      .map-shell[data-view="axonometric"] {
        overflow-x: auto;
      }

      .map-shell[data-view="axonometric"] #axonometric-map,
      .map-shell[data-view="narrative"] #narrative-sequence {
        display: block;
        min-width: 1020px;
      }

      .map-shell[data-view="narrative"] {
        overflow-x: auto;
      }

      .title-row,
      .control-row {
        align-items: flex-start;
      }
    }

    @media (max-width: 620px) {
      .variant-controls {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        width: 100%;
      }

      .variant-controls button {
        width: 100%;
      }

      .report-controls .button-label {
        display: none;
      }

      .report-controls button {
        width: 2.35rem;
        padding: 0;
      }

      .narrative-controls {
        grid-template-columns: auto auto;
      }

      .narrative-position {
        grid-column: 1 / -1;
        grid-row: 1;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      html {
        scroll-behavior: auto;
      }

      #narrative-map [data-narrative-kind],
      #narrative-map [data-narrative-fracture] {
        transition: none;
      }
    }
  </style>
</head>
<body>
  <svg class="icon-bank" aria-hidden="true" focusable="false">

  <main>
    <header class="masthead">
      <div class="title-row">
        <div class="title-copy">
          <h1>Impact Map visual variants</h1>
        </div>
        <div class="report-controls" aria-label="Leave-behind options">
          <button type="button" data-action="open-report">
            <svg class="button-icon" aria-hidden="true"><use href="#i-external-link"></use></svg>
            <span class="button-label">Open leave-behind</span>
          </button>
          <button type="button" data-action="download-report">
            <svg class="button-icon" aria-hidden="true"><use href="#i-file-down"></use></svg>
            <span class="button-label">Download HTML</span>
          </button>
        </div>
      </div>

      <div class="variant-controls" role="group" aria-label="Visual treatment">
        <button type="button" data-variant="warm" aria-pressed="true">Warm editorial</button>
        <button type="button" data-variant="cobalt" aria-pressed="false">High-contrast evidence</button>
        <button type="button" data-variant="routes" aria-pressed="false">Route-forward</button>

      const statusLabels = {
        known: 'KNOWN',

        surface: 'SURFACE'
      };

      let activeVariant = 'warm';
      let activePattern = 'none';
      let activeView = 'branch';
      let activeNarrativeFrame = 0;
      let measureContext = null;

      function el(name, attrs) {
        const node = document.createElementNS(ns, name);
        Object.entries(attrs || {}).forEach((entry) => {
          node.setAttribute(entry[0], entry[1]);
        });
        return node;
      }

      function htmlEl(name, className, text) {
        const node = document.createElement(name);
        if (className) node.className = className;
        if (text !== undefined) node.textContent = text;
        return node;
      }

      function measuredTextWidth(text, fontSize, weight) {
        try {
          if (!measureContext) {
            const canvas = document.createElement('canvas');
            measureContext = canvas.getContext ? canvas.getContext('2d') : null;
          }
          if (measureContext) {
            measureContext.font = String(weight) + ' ' + String(fontSize) + 'px Arial Nova, Avenir Next, Arial, sans-serif';
            return measureContext.measureText(text).width;
          }
        } catch (error) {
          measureContext = null;
        }
        return Array.from(text).reduce((sum, character) => {
          if (character === ' ') return sum + fontSize * 0.29;
          if (/[MW@#%&]/.test(character)) return sum + fontSize * 0.72;
          if (/[ilI1.,:;]/.test(character)) return sum + fontSize * 0.31;
          return sum + fontSize * 0.56;
        }, 0);
      }

      function wrapLines(text, maxWidth, maxLines, fontSize, weight) {
        const words = text.trim().split(/\s+/);
        const lines = [];
        let line = '';
        words.forEach((word) => {
          const next = line ? line + ' ' + word : word;
          if (line && measuredTextWidth(next, fontSize, weight) > maxWidth) {
            lines.push(line);
            line = word;
          } else {
            line = next;
          }
        });
        if (line) lines.push(line);
        if (lines.length > maxLines) {
          const clipped = lines.slice(0, maxLines);
          clipped[maxLines - 1] = clipped[maxLines - 1].replace(/[.,;:]?$/, '') + '…';
          return clipped;
        }
        return lines;
      }

      function addText(group, text, options) {
        const settings = Object.assign({
          x: 0,
          y: 0,
          maxWidth: 240,
          maxLines: 5,
          fontSize: 16,
          lineHeight: 20,
          weight: 500,
          fill: 'var(--active-ink)',
          anchor: 'start',
          verticalCenter: false
        }, options || {});
        const lines = wrapLines(text, settings.maxWidth, settings.maxLines, settings.fontSize, settings.weight);
        const firstY = settings.verticalCenter
          ? settings.y - ((lines.length - 1) * settings.lineHeight) / 2
          : settings.y;
        const textNode = el('text', {
          x: settings.x,
          y: firstY,
          fill: settings.fill,
          'font-size': settings.fontSize,
          'font-weight': settings.weight,
          'text-anchor': settings.anchor
        });
        lines.forEach((line, index) => {
          const span = el('tspan', {
            x: settings.x,
            dy: index === 0 ? 0 : settings.lineHeight
          });
          span.textContent = line;
          textNode.appendChild(span);
        });
        group.appendChild(textNode);
        return textNode;
      }

      function layout() {
        const discoverables = [];
        const actorRows = [];
        let cursor = MAP.contentTop;
        data.actors.forEach((branch, actorIndex) => {
          const branchRows = [];
          branch.discoverables.forEach((discoverable) => {

          });

          cursor += MAP.branchGap;
        });

        const actors = [];
        const impacts = [];
        actorRows.forEach((rows, actorIndex) => {
          const firstCenter = rows[0].y + rows[0].h / 2;
          const lastCenter = rows[rows.length - 1].y + rows[rows.length - 1].h / 2;
          const center = (firstCenter + lastCenter) / 2;
          actors.push({
            x: MAP.columns.actor.x,
            y: center - MAP.columns.actor.h / 2,
            w: MAP.columns.actor.w,
            h: MAP.columns.actor.h,
            text: data.actors[actorIndex].actor
          });
          impacts.push({
            x: MAP.columns.impact.x,
            y: center - MAP.columns.impact.h / 2,
            w: MAP.columns.impact.w,
            h: MAP.columns.impact.h,
            text: data.actors[actorIndex].impact
          });
        });

        const firstCenter = discoverables[0].y + discoverables[0].h / 2;
        const lastCenter = discoverables[discoverables.length - 1].y + discoverables[discoverables.length - 1].h / 2;
        const goal = {
          x: MAP.columns.goal.x,
          y: (firstCenter + lastCenter) / 2 - MAP.columns.goal.h / 2,

        return {
          goal: goal,
          actors: actors,
          impacts: impacts,
          discoverables: discoverables,
          actorRows: actorRows
        };
      }

      function distance(a, b) {
        return Math.hypot(b.x - a.x, b.y - a.y);
      }

      function unitNormal(a, b) {
        const dx = b.x - a.x;
        const dy = b.y - a.y;
        const length = Math.hypot(dx, dy) || 1;
        return { x: -dy / length, y: dx / length };
      }

      function trimForArrowhead(points, headLength) {
        const cleaned = points.filter((point, index) => index === 0 || distance(point, points[index - 1]) > 0.01);
        let total = 0;
        let index;
        for (index = 1; index < cleaned.length; index += 1) total += distance(cleaned[index - 1], cleaned[index]);
        const target = Math.max(0, total - headLength);
        const body = [cleaned[0]];
        let travelled = 0;
        for (index = 1; index < cleaned.length; index += 1) {
          const segment = distance(cleaned[index - 1], cleaned[index]);
          if (travelled + segment >= target) {
            const ratio = segment ? (target - travelled) / segment : 0;
            body.push({
              x: cleaned[index - 1].x + (cleaned[index].x - cleaned[index - 1].x) * ratio,
              y: cleaned[index - 1].y + (cleaned[index].y - cleaned[index - 1].y) * ratio
            });
            break;
          }
          body.push(cleaned[index]);
          travelled += segment;
        }
        return { body: body, tip: cleaned[cleaned.length - 1] };
      }

      function offsetPoint(points, index, halfWidth, side) {
        if (index === 0) {
          const normal = unitNormal(points[0], points[1]);
          return {
            x: points[0].x + normal.x * halfWidth * side,
            y: points[0].y + normal.y * halfWidth * side
          };
        }
        if (index === points.length - 1) {
          const normal = unitNormal(points[index - 1], points[index]);
          return {
            x: points[index].x + normal.x * halfWidth * side,
            y: points[index].y + normal.y * halfWidth * side
          };
        }
        const before = unitNormal(points[index - 1], points[index]);
        const after = unitNormal(points[index], points[index + 1]);
        const mixX = before.x + after.x;
        const mixY = before.y + after.y;
        const mixLength = Math.hypot(mixX, mixY);
        if (mixLength < 0.001) {
          return {
            x: points[index].x + after.x * halfWidth * side,
            y: points[index].y + after.y * halfWidth * side
          };
        }
        const miterX = mixX / mixLength;
        const miterY = mixY / mixLength;
        const denominator = Math.max(0.38, Math.abs(miterX * after.x + miterY * after.y));
        const miterLength = Math.min(halfWidth / denominator, halfWidth * 2.1);
        return {
          x: points[index].x + miterX * miterLength * side,
          y: points[index].y + miterY * miterLength * side
        };
      }

      function solidArrowPath(points, bodyWidth, headLength, headWidth) {
        const trimmed = trimForArrowhead(points, headLength);
        const body = trimmed.body;
        if (body.length < 2) return '';
        const half = bodyWidth / 2;
        const left = body.map((point, index) => offsetPoint(body, index, half, 1));
        const right = body.map((point, index) => offsetPoint(body, index, half, -1));
        const base = body[body.length - 1];
        const headNormal = unitNormal(body[body.length - 2], base);
        const headLeft = {
          x: base.x + headNormal.x * headWidth / 2,
          y: base.y + headNormal.y * headWidth / 2
        };
        const headRight = {
          x: base.x - headNormal.x * headWidth / 2,
          y: base.y - headNormal.y * headWidth / 2
        };
        const commands = ['M ' + left[0].x.toFixed(2) + ' ' + left[0].y.toFixed(2)];
        left.slice(1).forEach((point) => {
          commands.push('L ' + point.x.toFixed(2) + ' ' + point.y.toFixed(2));
        });
        commands.push('L ' + headLeft.x.toFixed(2) + ' ' + headLeft.y.toFixed(2));
        commands.push('L ' + trimmed.tip.x.toFixed(2) + ' ' + trimmed.tip.y.toFixed(2));
        commands.push('L ' + headRight.x.toFixed(2) + ' ' + headRight.y.toFixed(2));
        right.reverse().forEach((point) => {
          commands.push('L ' + point.x.toFixed(2) + ' ' + point.y.toFixed(2));
        });
        commands.push('Z');
        return commands.join(' ');
      }

      function cubicPoints(from, to, steps) {
        const start = { x: from.x + from.w - 2, y: from.y + from.h / 2 };
        const end = { x: to.x + 5, y: to.y + to.h / 2 };
        const middle = (start.x + end.x) / 2;
        const controlA = { x: middle, y: start.y };
        const controlB = { x: middle, y: end.y };
        const points = [];
        const count = steps || 64;
        let step;
        for (step = 0; step <= count; step += 1) {
          const t = step / count;
          const mt = 1 - t;
          points.push({
            x: mt * mt * mt * start.x + 3 * mt * mt * t * controlA.x + 3 * mt * t * t * controlB.x + t * t * t * end.x,
            y: mt * mt * mt * start.y + 3 * mt * mt * t * controlA.y + 3 * mt * t * t * controlB.y + t * t * t * end.y
          });
        }
        return points;
      }

      function orthogonalPoints(from, to) {
        const start = { x: from.x + from.w - 2, y: from.y + from.h / 2 };
        const end = { x: to.x + 5, y: to.y + to.h / 2 };
        const middle = Math.round((start.x + end.x) / 2);
        return [
          start,
          { x: middle, y: start.y },
          { x: middle, y: end.y },
          end
        ];
      }

      function drawArrow(layer, from, to, treatment, color, width) {

          fill: color,
          stroke: 'none',
          opacity: 0.97
        }));

        const sizes = {

          discoverables: { w: 116, h: 74 },

      function axonometricLaneFill(treatment, laneId, index) {
        if (laneId === 'goals') return treatment.goalFill;
        if (laneId === 'actors') return treatment.actorFill;
        if (laneId === 'impacts') return treatment.impactFill;
        if (laneId === 'discoverables') {

      function axonometricCardInk(treatment, laneId) {
        if (laneId === 'goals' && treatment.goalInk) return treatment.goalInk;
        if (laneId === 'actors' && treatment.actorInk) return treatment.actorInk;
        return treatment.ink;

      function axonometricLayout() {
        const run = { x: 1320, y: -340 };
        const laneThickness = { x: 46, y: 74 };
        const nodes = {};
        const lanes = [];
        const endByLane = {
          goals: 0.88,
          actors: 0.93,
          impacts: 0.93,
          discoverables: 0.95,
          deliverables: 0.94
        };

        portfolioData.lanes.forEach((lane, laneIndex) => {
          const base = {
            x: 50 + laneIndex * 70,
            y: 390 + laneIndex * 170
          };
          const laneGeometry = {
            id: lane.id,
            label: lane.label,
            index: laneIndex,
            base: base,
            run: run,
            thickness: laneThickness,
            points: [
              base,
              { x: base.x + run.x, y: base.y + run.y },
              { x: base.x + run.x + laneThickness.x, y: base.y + run.y + laneThickness.y },
              { x: base.x + laneThickness.x, y: base.y + laneThickness.y }
            ]
          };
          lanes.push(laneGeometry);

          const size = axonometricCardSize(lane.id);
          const start = 0.05;
          const end = endByLane[lane.id];
          lane.items.forEach((item, itemIndex) => {
            const ratio = lane.items.length === 1 ? 0.5 : itemIndex / (lane.items.length - 1);
            const t = start + (end - start) * ratio;
            const anchor = {
              x: base.x + run.x * t + laneThickness.x * 0.52,
              y: base.y + run.y * t + laneThickness.y * 0.5
            };
            nodes[item.id] = {
              id: item.id,
              laneId: lane.id,
              laneIndex: laneIndex,
              itemIndex: itemIndex,
              label: item.label,
              detail: item.detail || item.label,
              x: anchor.x - size.w / 2,
              y: anchor.y - size.h,
              w: size.w,
              h: size.h
            };
          });
        });

        return { lanes: lanes, nodes: nodes };
      }

      function cubicBetweenCards(source, target, linkIndex) {
        const sourceCenterY = source.y + source.h / 2;
        const targetCenterY = target.y + target.h / 2;
        const targetBelow = targetCenterY >= sourceCenterY;
        const start = {
          x: source.x + source.w / 2,
          y: targetBelow ? source.y + source.h - 2 : source.y + 2
        };
        const end = {
          x: target.x + target.w / 2,
          y: targetBelow ? target.y + 2 : target.y + target.h - 2
        };
        const dx = end.x - start.x;
        const dy = end.y - start.y;
        const drift = ((linkIndex % 5) - 2) * 3;
        const controlA = {
          x: start.x + dx * 0.36,
          y: start.y + dy * 0.34 + drift
        };
        const controlB = {
          x: start.x + dx * 0.64,
          y: end.y - dy * 0.34 - drift
        };
        const points = [];
        const steps = 42;
        let step;
        for (step = 0; step <= steps; step += 1) {
          const t = step / steps;
          const mt = 1 - t;
          points.push({
            x: mt * mt * mt * start.x + 3 * mt * mt * t * controlA.x + 3 * mt * t * t * controlB.x + t * t * t * end.x,
            y: mt * mt * mt * start.y + 3 * mt * mt * t * controlA.y + 3 * mt * t * t * controlB.y + t * t * t * end.y
          });
        }
        return points;
      }

      function narrativeLayout() {
        const discoverables = [];
        const actors = [];
        const impacts = [];
        let discoverableIndex = 0;

        data.actors.forEach((branch, branchIndex) => {
          const branchDiscoverables = branch.discoverables.map((item) => {
            const node = {
              id: 'narrative-discoverable-' + discoverableIndex,
              kind: 'discoverable',
              branch: branchIndex,
              x: NARRATIVE.columns.discoverable.x,
              y: NARRATIVE.discoverableY[discoverableIndex],
              w: NARRATIVE.columns.discoverable.w,
              h: NARRATIVE.columns.discoverable.h,
              text: item.text,
              route: item.route,
              status: item.status,
              itemIndex: discoverableIndex
            };
            discoverables.push(node);
            discoverableIndex += 1;
            return node;
          });
          const firstCenter = branchDiscoverables[0].y + branchDiscoverables[0].h / 2;
          const lastCenter = branchDiscoverables[branchDiscoverables.length - 1].y + branchDiscoverables[branchDiscoverables.length - 1].h / 2;
          const center = (firstCenter + lastCenter) / 2;
          actors.push({
            id: 'narrative-actor-' + branchIndex,
            kind: 'actor',
            branch: branchIndex,
            x: NARRATIVE.columns.actor.x,
            y: center - NARRATIVE.columns.actor.h / 2,
            w: NARRATIVE.columns.actor.w,
            h: NARRATIVE.columns.actor.h,
            text: branch.actor
          });
          impacts.push({
            id: 'narrative-impact-' + branchIndex,
            kind: 'impact',
            branch: branchIndex,
            x: NARRATIVE.columns.impact.x,
            y: center - NARRATIVE.columns.impact.h / 2,
            w: NARRATIVE.columns.impact.w,
            h: NARRATIVE.columns.impact.h,
            text: branch.impact
          });
        });

        const firstCenter = discoverables[0].y + discoverables[0].h / 2;
        const lastCenter = discoverables[discoverables.length - 1].y + discoverables[discoverables.length - 1].h / 2;
        const center = (firstCenter + lastCenter) / 2;
        const goal = {
          id: 'narrative-goal',
          kind: 'goal',
          branch: -1,
          x: NARRATIVE.columns.goal.x,
          y: center - NARRATIVE.columns.goal.h / 2,
          w: NARRATIVE.columns.goal.w,
          h: NARRATIVE.columns.goal.h,
          text: data.goal

        return {
          goal: goal,
          actors: actors,
          impacts: impacts,
          discoverables: discoverables
        };

          maxWidth: 286,
          maxLines: 2,
          fontSize: 19,
          lineHeight: 23,
          weight: 820,
          fill: treatment.ink
        });

          x: 1172,

          'font-weight': 760
        });

        group.appendChild(ready);
        layer.appendChild(group);
      }

      function renderNarrativeCaption(treatment, frame) {
        const oldLayer = narrativeSvg.querySelector('[data-narrative-caption]');
        if (oldLayer) oldLayer.remove();
        const layer = el('g', { 'data-narrative-caption': 'true' });
        const eyebrow = el('text', {
          x: 70,
          y: 34,
          fill: treatment.route,
          'font-size': 13,
          'font-weight': 860,
          'letter-spacing': 1.5
        });
        eyebrow.textContent = frame.eyebrow.toUpperCase();
        layer.appendChild(eyebrow);
        addText(layer, frame.title, {
          x: 70,
          y: 70,
          maxWidth: 1230,
          maxLines: 2,
          fontSize: frame.mode === 'goal' ? 27 : 29,
          lineHeight: 31,
          weight: 830,
          fill: treatment.ink
        });
        if (frame.deck) {
          addText(layer, frame.deck, {
            x: 70,
            y: 132,
            maxWidth: 1240,
            maxLines: 1,
            fontSize: 16.5,
            lineHeight: 20,
            weight: 590,
            fill: treatment.muted
          });
        }
        const count = el('text', {
          x: 1530,
          y: 34,
          fill: treatment.muted,
          'font-size': 13,
          'font-weight': 800,
          'text-anchor': 'end'
        });
        count.textContent = String(activeNarrativeFrame + 1).padStart(2, '0') + ' / ' + String(narrativeFrames.length).padStart(2, '0');
        layer.appendChild(count);
        layer.appendChild(el('line', {
          x1: 70,
          y1: 151,
          x2: 1530,
          y2: 151,
          stroke: treatment.frame,
          'stroke-width': 1
        }));
        narrativeSvg.appendChild(layer);
      }

      function applyNarrativeFrame() {
        const frame = narrativeFrames[activeNarrativeFrame];
        const treatment = variants[activeVariant];
        const items = Array.from(narrativeSvg.querySelectorAll('[data-narrative-kind]'));
        items.forEach((item) => {
          const kind = item.dataset.narrativeKind;
          const branch = Number(item.dataset.narrativeBranch);
          let opacity = 1;
          if (frame.mode === 'goal') {
            opacity = kind === 'goal' ? 1 : kind === 'edge' ? 0.025 : 0.045;
          } else if (frame.mode === 'fracture') {
            opacity = kind === 'goal' ? 0.22 : kind === 'edge' ? 0.018 : 0.035;
          } else if (frame.mode === 'branch') {
            if (kind === 'goal') {
              opacity = 0.92;
            } else if (branch === frame.branch) {
              opacity = kind === 'edge' ? 0.9 : 1;
            } else if (branch < frame.branch) {
              opacity = kind === 'edge' ? 0.13 : 0.2;
            } else {
              opacity = kind === 'edge' ? 0.025 : 0.045;
            }
          } else if (frame.mode === 'full') {
            opacity = kind === 'edge' ? 0.62 : 0.96;
          } else if (frame.mode === 'routes') {
            if (kind === 'goal') opacity = 0.58;
            else if (kind === 'discoverable') opacity = 1;
            else opacity = kind === 'edge' ? 0.4 : 0.52;
          } else if (frame.mode === 'resolution') {
            if (kind === 'goal' || branch === 0) opacity = kind === 'edge' ? 0.95 : 1;
            else opacity = kind === 'edge' ? 0.32 : 0.66;
          }
          item.setAttribute('opacity', opacity);
        });

        const fracture = narrativeSvg.querySelector('[data-narrative-fracture]');
        if (fracture) fracture.setAttribute('opacity', frame.mode === 'fracture' ? 1 : 0);
        narrativeSvg.querySelectorAll('[data-narrative-route]').forEach((route) => {
          route.setAttribute('opacity', frame.mode === 'routes' ? 1 : 0.78);
        });

        renderNarrativeCaption(treatment, frame);
        narrativeMarkers.querySelectorAll('[data-narrative-frame]').forEach((button) => {
          if (Number(button.dataset.narrativeFrame) === activeNarrativeFrame) {
            button.setAttribute('aria-current', 'step');
          } else {
            button.removeAttribute('aria-current');
          }
        });
        narrativeCounter.textContent = 'Frame ' + (activeNarrativeFrame + 1) + ' of ' + narrativeFrames.length;
        narrativePrevious.disabled = activeNarrativeFrame === 0;
        narrativeNext.disabled = activeNarrativeFrame === narrativeFrames.length - 1;

        const accessibleTitle = narrativeSvg.querySelector('#narrative-title-accessible');
        const accessibleDescription = narrativeSvg.querySelector('#narrative-description-accessible');
        if (accessibleTitle) accessibleTitle.textContent = frame.eyebrow + ': ' + frame.title;
        if (accessibleDescription) {
          accessibleDescription.textContent = frame.deck || 'Impact Map narrative frame ' + (activeNarrativeFrame + 1) + ' of ' + narrativeFrames.length + '.';
        }
      }

      function setNarrativeFrame(frameIndex) {
        activeNarrativeFrame = Math.max(0, Math.min(narrativeFrames.length - 1, frameIndex));
        applyNarrativeFrame();
      }

      function ensureNarrativeMarkers() {
        if (narrativeMarkers.children.length) return;
        narrativeFrames.forEach((frame, index) => {
          const button = document.createElement('button');
          button.type = 'button';
          button.className = 'narrative-marker';
          button.dataset.narrativeFrame = index;
          button.setAttribute('aria-label', 'Frame ' + (index + 1) + ': ' + frame.eyebrow.replace(/^\d+\s*·\s*/, ''));
          button.textContent = index + 1;
          button.addEventListener('click', () => setNarrativeFrame(index));
          narrativeMarkers.appendChild(button);
        });
      }

      function renderNarrative(treatment) {
        ensureNarrativeMarkers();
        narrativeSvg.textContent = '';

        const title = el('title', { id: 'narrative-title-accessible' });
        title.textContent = 'Impact Map narrative still sequence';
        narrativeSvg.appendChild(title);
        const description = el('desc', { id: 'narrative-description-accessible' });
        description.textContent = 'A nine-frame narrative reveals the goal, four actor branches, their discoverable questions, routes, and a connected review result.';
        narrativeSvg.appendChild(description);
        narrativeSvg.appendChild(el('rect', {
          x: 1,
          y: 1,
          width: NARRATIVE.width - 2,
          height: NARRATIVE.height - 2,
          rx: 22,
          fill: treatment.background,
          stroke: treatment.frame,
          'stroke-width': 2
        }));

        const headings = el('g', { 'data-narrative-headings': 'true' });
        const labels = ['Goal', 'Actor', 'Impact', 'Discoverable'];
        const columns = Object.values(NARRATIVE.columns);
        labels.forEach((label, index) => {
          const heading = el('text', {
            x: columns[index].x + columns[index].w / 2,
            y: NARRATIVE.headingY,
            fill: treatment.headingInk,
            'font-size': 15,
            'font-weight': 810,
            'letter-spacing': 0.7,
            'text-anchor': 'middle'
          });
          heading.textContent = label;
          headings.appendChild(heading);
        });
        narrativeSvg.appendChild(headings);

        const map = narrativeLayout();
        const edges = el('g', { class: 'narrative-edges' });
        map.actors.forEach((actor, branchIndex) => {
          drawNarrativeEdge(edges, map.goal, actor, branchIndex, treatment);
          drawNarrativeEdge(edges, actor, map.impacts[branchIndex], branchIndex, treatment);
        });
        map.discoverables.forEach((discoverable) => {
          drawNarrativeEdge(
            edges,
            map.impacts[discoverable.branch],
            discoverable,
            discoverable.branch,
            treatment,
            discoverable.route
          );
        });
        narrativeSvg.appendChild(edges);

        const nodes = el('g', { class: 'narrative-nodes' });
        drawNarrativeCard(nodes, map.goal, treatment);
        map.actors.forEach((node) => drawNarrativeCard(nodes, node, treatment));
        map.impacts.forEach((node) => drawNarrativeCard(nodes, node, treatment));
        map.discoverables.forEach((node) => drawNarrativeCard(nodes, node, treatment));
        narrativeSvg.appendChild(nodes);

        const fracture = el('g', { class: 'narrative-fracture' });
        drawNarrativeFracture(fracture, treatment);
        narrativeSvg.appendChild(fracture);
        applyNarrativeFrame();
      }

      function setView(viewName) {
        activeView = ['branch', 'axonometric', 'narrative'].includes(viewName) ? viewName : 'branch';
        mapShell.dataset.view = activeView;
        root.dataset.mapView = activeView;
        viewButtons.forEach((button) => {
          button.setAttribute('aria-pressed', String(button.dataset.view === activeView));
        });
      }

      function render(variantName) {
        activeVariant = variants[variantName] ? variantName : 'warm';
        const treatment = variants[activeVariant];
        const map = layout();
        const renderedPattern = treatment.allowPatterns ? activePattern : 'none';
        setActiveCss(treatment);
        svg.textContent = '';

        const title = el('title', { id: 'map-title' });
        title.textContent = treatment.label + ' Impact Map';
        svg.appendChild(title);
        const description = el('desc', { id: 'map-description' });
        description.textContent = 'Goal, Actor, Impact, and Discoverable remain fixed. Actors are centered and emphasized. Each connector is one filled shape so arrow body and head share the same geometry.';
        svg.appendChild(description);

        const defs = el('defs');
        addPatternDefs(defs);
        svg.appendChild(defs);

        svg.appendChild(el('rect', {
          x: 1,
          y: 1,
          width: MAP.width - 2,
          height: MAP.height - 2,
          rx: 22,
          fill: treatment.background,
          stroke: treatment.frame,
          'stroke-width': 2
        }));

        const backgroundLayer = el('g', { class: 'background-pattern' });
        drawBackgroundPattern(backgroundLayer, renderedPattern, treatment);
        svg.appendChild(backgroundLayer);

        const mapGround = el('g', { class: 'map-ground' });
        drawLaneBackgrounds(mapGround, map, treatment);
        svg.appendChild(mapGround);

        const headings = ['Goal', 'Actor', 'Impact', 'Discoverable'];
        const headingX = [
          MAP.columns.goal.x + MAP.columns.goal.w / 2,
          MAP.columns.actor.x + MAP.columns.actor.w / 2,
          MAP.columns.impact.x + MAP.columns.impact.w / 2,
          MAP.columns.discoverable.x + MAP.columns.discoverable.w / 2
        ];
        headings.forEach((heading, index) => {
          const label = el('text', {
            x: headingX[index],
            y: activeVariant === 'vellum' ? MAP.headingY + 4 : MAP.headingY,
            fill: treatment.headingInk,
            'text-anchor': 'middle',
            'font-size': treatment.headingSize,
            'font-weight': activeVariant === 'vellum' ? 850 : 760,
            'letter-spacing': activeVariant === 'vellum' ? 1.5 : 0.2
          });
          label.textContent = heading;
          svg.appendChild(label);
        });

        const edges = el('g', { class: 'edges' });
        map.actors.forEach((actor, actorIndex) => {
          drawArrow(edges, map.goal, actor, treatment, treatment.edge);
          drawArrow(edges, actor, map.impacts[actorIndex], treatment, treatment.edge);
        });
        map.discoverables.forEach((discoverable) => {
          const color = treatment.routeForward ? routeColors[discoverable.route] : treatment.edge;
          drawArrow(
            edges,
            map.impacts[discoverable.actorIndex],
            discoverable,
            treatment,
            color,
            treatment.routeForward ? 4.5 : treatment.edgeWidth
          );
        });
        svg.appendChild(edges);

        const nodes = el('g', { class: 'nodes' });
        drawNode(nodes, map.goal, treatment, 'goal', 0);
        map.actors.forEach((node, index) => drawNode(nodes, node, treatment, 'actor', index));
        map.impacts.forEach((node, index) => drawNode(nodes, node, treatment, 'impact', index));
        map.discoverables.forEach((node, index) => drawNode(nodes, node, treatment, 'discoverable', index));
        svg.appendChild(nodes);

        variantButtons.forEach((button) => {
          button.setAttribute('aria-pressed', String(button.dataset.variant === activeVariant));
        });
        patternButtons.forEach((button) => {
          button.setAttribute('aria-pressed', String(
            treatment.allowPatterns &&
            button.dataset.pattern === activePattern
          ));
          button.disabled = !treatment.allowPatterns;
        });
        root.dataset.variant = activeVariant;
        history.replaceState(null, '', '#' + activeVariant);

      function escapeHtml(value) {
        return String(value)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#039;');
      }

      function safeId(value) {
        return String(value).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
      }

      function resolvedColor(value) {
        const match = String(value).match(/^var\((--[^)]+)\)$/);
        if (!match) return value;
        return getComputedStyle(root).getPropertyValue(match[1]).trim() || value;
      }

          '</style></head><body><nav class="jump" aria-label="Report pages">' + jumpLinks +
          '</nav>' + pageMarkup +
          '<script>(()=>{const p=[...document.querySelectorAll(".page")],l=[...document.querySelectorAll(".jump a")];function current(id){l.forEach(a=>{if(a.hash==="#" + id)a.setAttribute("aria-current","page");else a.removeAttribute("aria-current")})}function go(d){const y=scrollY+innerHeight*.45;let i=p.findIndex(n=>n.offsetTop+n.offsetHeight>y);if(i<0)i=0;i=Math.max(0,Math.min(p.length-1,i+d));current(p[i].id);location.hash=p[i].id}addEventListener("hashchange",()=>current(location.hash.slice(1)||p[0].id));if("IntersectionObserver" in window){const ratios=new Map;const observer=new IntersectionObserver(entries=>{entries.forEach(e=>ratios.set(e.target.id,e.intersectionRatio));let best=p[0].id,score=-1;ratios.forEach((ratio,id)=>{if(ratio>score){score=ratio;best=id}});current(best)},{threshold:[.25,.45,.65,.85]});p.forEach(page=>observer.observe(page))}current(location.hash.slice(1)||p[0].id);addEventListener("keydown",e=>{if(["ArrowRight","ArrowDown","PageDown"].includes(e.key)){e.preventDefault();go(1)}if(["ArrowLeft","ArrowUp","PageUp"].includes(e.key)){e.preventDefault();go(-1)}if(e.key==="Home"){e.preventDefault();current(p[0].id);location.hash=p[0].id}if(e.key==="End"){e.preventDefault();current(p[p.length-1].id);location.hash=p[p.length-1].id}})})();<\/script>' +
          '</body></html>';
      }

      function createReportUrl() {
        return URL.createObjectURL(new Blob([reportHtml()], { type: 'text/html' }));
      }

      variantButtons.forEach((button) => {
        button.addEventListener('click', () => render(button.dataset.variant));
      });

      patternButtons.forEach((button) => {
        button.addEventListener('click', () => {
          activePattern = button.dataset.pattern;
          render(activeVariant);
        });
      });

      viewButtons.forEach((button) => {
        button.addEventListener('click', () => {
          setView(button.dataset.view);
        });
      });

      narrativePrevious.addEventListener('click', () => {
        setNarrativeFrame(activeNarrativeFrame - 1);
      });

      narrativeNext.addEventListener('click', () => {
        setNarrativeFrame(activeNarrativeFrame + 1);
      });

      document.addEventListener('keydown', (event) => {
        if (activeView !== 'narrative') return;
        if (event.target && /^(INPUT|SELECT|TEXTAREA|BUTTON)$/.test(event.target.tagName)) return;
        if (event.key === 'ArrowRight' || event.key === 'PageDown') {
          event.preventDefault();
          setNarrativeFrame(activeNarrativeFrame + 1);
        }
        if (event.key === 'ArrowLeft' || event.key === 'PageUp') {
          event.preventDefault();
          setNarrativeFrame(activeNarrativeFrame - 1);
        }
        if (event.key === 'Home') {
          event.preventDefault();
          setNarrativeFrame(0);
        }
        if (event.key === 'End') {
          event.preventDefault();
          setNarrativeFrame(narrativeFrames.length - 1);
        }
      });

      document.querySelector('[data-action="open-report"]').addEventListener('click', () => {
        const url = createReportUrl();
        window.open(url, '_blank', 'noopener');
        window.setTimeout(() => URL.revokeObjectURL(url), 120000);
      });

      document.querySelector('[data-action="download-report"]').addEventListener('click', () => {
        const url = createReportUrl();
        const link = document.createElement('a');
        link.href = url;
        link.download = 'impact-map-leave-behind-' + activeVariant + '.html';
        document.body.appendChild(link);
        link.click();
        link.remove();
        window.setTimeout(() => URL.revokeObjectURL(url), 2000);
      });

      const initialVariant = variants[location.hash.slice(1)] ? location.hash.slice(1) : 'warm';
      render(initialVariant);
      setView('branch');
    })();
  </script>
</body>
</html>
