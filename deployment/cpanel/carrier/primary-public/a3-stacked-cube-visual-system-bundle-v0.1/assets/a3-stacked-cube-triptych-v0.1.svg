      <text x="700" y="226" class="a3-strong"><tspan x="700" dy="0">Operational /</tspan><tspan x="700" dy="1.25em">assignment</tspan></text>
    </g><path class="a3-route secondary" d="M 654 398 C 670 398, 670 228, 678 228"></path><text x="688" y="286" class="a3-secondary"><tspan x="688" dy="0">mirrors · no cutover yet</tspan></text><rect class="a3-gate" x="682" y="326" width="188" height="92" rx="6"></rect><text x="696" y="356" class="a3-strong"><tspan x="696" dy="0">GATE + ROLLBACK</tspan></text><text x="696" y="386" class="a3-secondary"><tspan x="696" dy="0">parity · audit · recovery</tspan><tspan x="696" dy="1.25em">path</tspan></text><rect class="a3-human" x="478" y="596" width="394" height="116" rx="6"></rect><text x="492" y="626" class="a3-strong"><tspan x="492" dy="0">HUMAN WORKFLOW AUTHORITY</tspan></text><text x="492" y="668" class="a3-secondary"><tspan x="492" dy="0">Curator work remains an actor/workflow surface</tspan><tspan x="492" dy="1.25em">until separately bounded.</tspan></text></g><g>
        <rect x="908" y="8" width="434" height="742" rx="8" fill="#082f57" stroke="#7aa6c9"></rect>
        <text x="928" y="42" class="a3-strong"><tspan x="928" dy="0">3 · VALIDATED AUTHORITY</tspan></text>
        <text x="928" y="82" class="a3-secondary"><tspan x="928" dy="0">Only the evidenced capability transfers.</tspan><tspan x="928" dy="1.25em">Retained legacy and human work stay visible.</tspan></text>
        <text x="928" y="155" class="a3-strong"><tspan x="928" dy="0">LEGACY</tspan></text>
