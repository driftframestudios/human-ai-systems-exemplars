<svg xmlns="http://www.w3.org/2000/svg" class="a3-svg" viewBox="0 0 1350 760" role="img" aria-labelledby="triptych-title triptych-desc" style="color:#eef7ff">
      <defs>
      <marker id="a3-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor"></path>
      </marker>
      <pattern id="a3-hatch" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
        <rect width="9" height="9" fill="#164f78"></rect>
        <line x1="0" y1="0" x2="0" y2="9" stroke="#65ccda" stroke-width="2"></line>
      </pattern>
    </defs>
      <title id="triptych-title">A3 Stacked Cube Strangler-Fig Storyboard Triptych</title>
      <desc id="triptych-desc">Current legacy authority, a bounded evidence period with shadow routing and no cutover, and selective validated authority transfer with retained legacy and rollback.</desc>
      <style>
        text{font-family:Inter,system-ui,sans-serif;font-size:16px;fill:#eef7ff}
        .a3-strong{font-weight:600}.a3-secondary{fill:#b7d2e8}
        .a3-front,.a3-top,.a3-side{stroke:#7aa6c9;stroke-width:1}
        .state-legacy .a3-front,.state-legacy .a3-top,.state-legacy .a3-side{fill:#184f7a}
        .state-retained_legacy .a3-front,.state-retained_legacy .a3-top,.state-retained_legacy .a3-side{fill:#213e5a;stroke:#a8bfd2}
        .state-shadow .a3-front,.state-shadow .a3-top,.state-shadow .a3-side{fill:url(#a3-hatch);stroke:#65ccda}
        .state-new .a3-front,.state-new .a3-top,.state-new .a3-side{fill:#2f78b7;stroke:#9adce4;stroke-width:2}
        .a3-gate{fill:#0f3d66;stroke:#65ccda;stroke-width:2}
        .a3-human{fill:#163756;stroke:#91b7d6}
        .a3-route{fill:none;stroke:#eef7ff;stroke-width:2;marker-end:url(#a3-arrow)}
        .a3-route.secondary{stroke:#b7d2e8;stroke-dasharray:7 7}
      </style>
      <rect width="1350" height="760" fill="#062c56"></rect>
      <g>
        <rect x="8" y="8" width="434" height="742" rx="8" fill="#082f57" stroke="#7aa6c9"></rect>
        <text x="28" y="42" class="a3-strong"><tspan x="28" dy="0">1 · CURRENT AUTHORITY</tspan></text>
        <text x="28" y="82" class="a3-secondary"><tspan x="28" dy="0">Coupled and unknown work remains under legacy</tspan><tspan x="28" dy="1.25em">or human authority.</tspan></text>
        <text x="28" y="155" class="a3-strong"><tspan x="28" dy="0">LEGACY</tspan></text>
        <text x="238" y="155" class="a3-strong"><tspan x="238" dy="0">STRANGLER / NEW</tspan></text><g class="a3-cube state-legacy" data-cube-id="CAP-SEARCH"
      role="button" tabindex="0" aria-label="Search; Legacy authority">
      <title>Standard and advanced search — Legacy authority</title>
      <polygon class="a3-top" points="28,188 37,179 213,179 204,188"></polygon>
