      <rect class="a3-front" x="28" y="374" width="176" height="45" rx="5"></rect>
      <text x="40" y="396" class="a3-strong"><tspan x="40" dy="0">Operational /</tspan><tspan x="40" dy="1.25em">assignment</tspan></text>
    </g><text x="240" y="276" class="a3-secondary"><tspan x="240" dy="0">No verified seam</tspan></text><rect class="a3-human" x="28" y="596" width="394" height="116" rx="6"></rect><text x="42" y="626" class="a3-strong"><tspan x="42" dy="0">HUMAN WORKFLOW AUTHORITY</tspan></text><text x="42" y="668" class="a3-secondary"><tspan x="42" dy="0">Curator work remains an actor/workflow surface</tspan><tspan x="42" dy="1.25em">until separately bounded.</tspan></text></g><g>
        <rect x="458" y="8" width="434" height="742" rx="8" fill="#082f57" stroke="#7aa6c9"></rect>
        <text x="478" y="42" class="a3-strong"><tspan x="478" dy="0">2 · BOUNDED EVIDENCE PERIOD</tspan></text>
        <text x="478" y="82" class="a3-secondary"><tspan x="478" dy="0">A named seam carries shadow traffic. Legacy</tspan><tspan x="478" dy="1.25em">authority and rollback remain.</tspan></text>
        <text x="478" y="155" class="a3-strong"><tspan x="478" dy="0">LEGACY</tspan></text>
