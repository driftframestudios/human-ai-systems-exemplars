      <text x="490" y="396" class="a3-strong"><tspan x="490" dy="0">Operational /</tspan><tspan x="490" dy="1.25em">assignment</tspan></text>
    </g><g class="a3-cube state-shadow" data-cube-id="CAP-OP-ASSIGN"
      role="button" tabindex="0" aria-label="Operational / assignment; Shadow / dual-run">
