<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="clean-title clean-desc">
  <title id="clean-title">Which workflow stages create the most metadata corrections?</title>
  <desc id="clean-desc">A sorted horizontal bar chart shows synthetic metadata corrections per 100 samples. Review has 41, Preparation 31, Analysis 24, Intake 18, Report 15, and Archive 9. Uncertainty was not estimated for this synthetic form-selection exemplar.</desc>
  <defs><pattern id="clean-grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#cfe7f7" stroke-opacity=".42"/><circle cx="0" cy="0" r="1.4" fill="#f1b88e" fill-opacity=".25"/></pattern><filter id="clean-shadow" x="-12%" y="-18%" width="124%" height="145%"><feDropShadow dx="0" dy="7" stdDeviation="6" flood-color="#071a35" flood-opacity=".27"/></filter><style>.sans{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.mono{font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace}.eyebrow{font-size:14px;font-weight:800;letter-spacing:1.8px}.title{font-size:38px;font-weight:820;letter-spacing:-.8px}.lead{font-size:17px;font-weight:620}.label{font-size:16px;font-weight:720}.value{font-size:15px;font-weight:850}.note{font-size:13px;font-weight:650}.ink{fill:#17345f}.body{fill:#304a71}.white{fill:#fffdf8}.muted{fill:#5d6f8b}</style></defs>
  <rect width="1600" height="900" fill="#fffaf2"/><rect x="28" y="28" width="1544" height="844" rx="28" fill="#17345f"/><rect x="20" y="20" width="1544" height="844" rx="28" fill="#fffdf8" stroke="#17345f" stroke-width="2"/><rect x="21" y="21" width="1542" height="842" rx="27" fill="url(#clean-grid)"/>
  <path d="M20 48Q20 20 48 20H1536Q1564 20 1564 48V184H20Z" fill="#2855f3"/><text x="56" y="57" class="mono eyebrow white">CLEAN EXEMPLAR · SORTED BAR</text><text x="56" y="105" class="sans title white">Which workflow stages create the most metadata corrections?</text><text x="56" y="144" class="sans lead white">Prospective genomics operations example · synthetic counts · corrections per 100 samples</text>
  <rect x="1235" y="52" width="278" height="86" rx="14" fill="#fffdf8" stroke="#17345f" stroke-width="2"/><text x="1257" y="82" class="mono eyebrow ink">UNIT</text><text x="1257" y="111" class="sans label body">corrections / 100 samples</text>
  <g id="bar-chart" role="group" aria-labelledby="bar-title"><title id="bar-title">Sorted correction rates by workflow stage</title>
    <line x1="360" y1="234" x2="1450" y2="234" stroke="#17345f" stroke-width="2"/><line x1="360" y1="234" x2="360" y2="710" stroke="#17345f" stroke-width="2"/>
    <g class="mono note muted"><text x="360" y="220" text-anchor="middle">0</text><text x="625" y="220" text-anchor="middle">10</text><text x="890" y="220" text-anchor="middle">20</text><text x="1155" y="220" text-anchor="middle">30</text><text x="1420" y="220" text-anchor="middle">40</text></g>
    <g stroke="#9ab9cc" stroke-opacity=".48"><line x1="625" y1="234" x2="625" y2="710"/><line x1="890" y1="234" x2="890" y2="710"/><line x1="1155" y1="234" x2="1155" y2="710"/><line x1="1420" y1="234" x2="1420" y2="710"/></g>
    <g filter="url(#clean-shadow)">
      <text x="330" y="300" text-anchor="end" class="sans label ink">Review</text><rect x="360" y="270" width="1087" height="46" rx="8" fill="#2855f3"/><text x="1464" y="300" class="mono value ink">41</text>
      <text x="330" y="378" text-anchor="end" class="sans label ink">Preparation</text><rect x="360" y="348" width="822" height="46" rx="8" fill="#4a79f6"/><text x="1199" y="378" class="mono value ink">31</text>
      <text x="330" y="456" text-anchor="end" class="sans label ink">Analysis</text><rect x="360" y="426" width="636" height="46" rx="8" fill="#78a6f8"/><text x="1013" y="456" class="mono value ink">24</text>
      <text x="330" y="534" text-anchor="end" class="sans label ink">Intake</text><rect x="360" y="504" width="477" height="46" rx="8" fill="#79c6bd"/><text x="854" y="534" class="mono value ink">18</text>
      <text x="330" y="612" text-anchor="end" class="sans label ink">Report</text><rect x="360" y="582" width="398" height="46" rx="8" fill="#f1b88e"/><text x="775" y="612" class="mono value ink">15</text>
      <text x="330" y="690" text-anchor="end" class="sans label ink">Archive</text><rect x="360" y="660" width="239" height="46" rx="8" fill="#ffd3d0"/><text x="616" y="690" class="mono value ink">9</text>
    </g>
  </g>
  <rect x="56" y="752" width="1480" height="76" rx="14" fill="#17345f"/><circle cx="84" cy="780" r="6" fill="#f2ff67"/><text x="104" y="785" class="sans note white">Source: synthetic form-selection example; no observed program population. Uncertainty: not estimated. Read exact values from the companion table.</text><text x="104" y="811" class="sans note" fill="#cfe7f7">Interpretation: review carries the highest synthetic correction rate, followed by preparation and analysis.</text>
</svg>
