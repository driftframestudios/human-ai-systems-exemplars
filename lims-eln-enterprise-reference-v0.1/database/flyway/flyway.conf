# Flyway owns migration ordering, checksums, serialization, transactions, and
# schema history. Runtime connection values arrive through FLYWAY_URL,
# FLYWAY_USER, and FLYWAY_PASSWORD from the deployment environment. Profile
# locations include release-attested afterConnect callbacks that verify the
# bounded login and adopt the stable NOLOGIN owner before Flyway proceeds.
flyway.baselineOnMigrate=false
flyway.cleanDisabled=true
flyway.validateOnMigrate=true
flyway.outOfOrder=false
flyway.validateMigrationNaming=true
flyway.encoding=UTF-8
flyway.defaultSchema=public
flyway.createSchemas=false
flyway.connectRetries=10
flyway.lockRetryCount=10
flyway.mixed=false
flyway.group=false
flyway.placeholderReplacement=false
