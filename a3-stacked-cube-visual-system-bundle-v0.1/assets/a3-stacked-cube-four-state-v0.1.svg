        <title>3 · Shadow / dual-run</title>
        <rect x="687" y="7" width="326" height="646" rx="8" fill="#082f57" stroke="#7aa6c9"></rect>
        <text x="702" y="40" class="a3-strong"><tspan x="702" dy="0">3 · SHADOW / DUAL-RUN</tspan></text>
        <text x="702" y="82" class="a3-secondary"><tspan x="702" dy="0">Shadow traffic collects evidence.</tspan><tspan x="702" dy="1.25em">Legacy remains authoritative.</tspan></text>
        <text x="702" y="168" class="a3-strong"><tspan x="702" dy="0">LEGACY</tspan></text>
