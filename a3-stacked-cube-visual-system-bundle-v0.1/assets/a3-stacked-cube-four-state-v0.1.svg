        <text x="362" y="82" class="a3-secondary"><tspan x="362" dy="0">The boundary is defined. No execution</tspan><tspan x="362" dy="1.25em">or decision authority moves.</tspan></text>
        <text x="362" y="168" class="a3-strong"><tspan x="362" dy="0">LEGACY</tspan></text>
        <text x="520" y="168" class="a3-strong"><tspan x="520" dy="0">BOUNDARY / NEW</tspan></text><g class="a3-cube state-legacy" data-cube-id="CAP-SEARCH"
