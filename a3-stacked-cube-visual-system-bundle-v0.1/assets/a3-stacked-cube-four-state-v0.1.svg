    </g><rect class="a3-gate" x="860" y="325" width="132" height="84" rx="6"></rect><text x="872" y="353" class="a3-strong"><tspan x="872" dy="0">EVIDENCE GATE</tspan></text><text x="872" y="381" class="a3-secondary"><tspan x="872" dy="0">dual-run</tspan></text><rect class="a3-human" x="702" y="520" width="296" height="96" rx="6"></rect><text x="716" y="550" class="a3-strong"><tspan x="716" dy="0">HUMAN WORKFLOW AUTHORITY</tspan></text><text x="716" y="584" class="a3-secondary"><tspan x="716" dy="0">Curators train while QA validates and</tspan><tspan x="716" dy="1.25em">SOP sections are drafted.</tspan></text></g><g id="four-state-f3" data-phase="F3" role="group" aria-label="4 · Validated authority">
