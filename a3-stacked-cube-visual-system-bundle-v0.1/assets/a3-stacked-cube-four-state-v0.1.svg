<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 660" role="img" aria-labelledby="four-state-title four-state-desc" style="color:#eef7ff">
      <defs>
      <pattern id="a3-hatch" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
        <rect width="9" height="9" fill="#164f78"></rect>
        <line x1="0" y1="0" x2="0" y2="9" stroke="#65ccda" stroke-width="2"></line>
      </pattern>
    </defs>
      <title id="four-state-title">Evidence-Guided Capability Transfer Model — four-state reference strip</title>
      <desc id="four-state-desc">Current authority, an identified boundary with no move, shadow dual-run with legacy authority, and validated selective transfer with rollback. Curator participation advances from workflow evidence to design review, training, and procedure-supported use.</desc>
      <style>
        text{font-family:Inter,system-ui,sans-serif;font-size:15px;fill:#eef7ff}
        .a3-strong{font-weight:600}.a3-secondary{fill:#b7d2e8}
        .a3-front,.a3-top,.a3-side{stroke:#7aa6c9;stroke-width:1}
        .state-legacy .a3-front,.state-legacy .a3-top,.state-legacy .a3-side{fill:#184f7a}
        .state-retained_legacy .a3-front,.state-retained_legacy .a3-top,.state-retained_legacy .a3-side{fill:#213e5a;stroke:#a8bfd2}
        .state-seam .a3-front,.state-seam .a3-top,.state-seam .a3-side{fill:#082f57;stroke:#65ccda;stroke-width:2;stroke-dasharray:6 5}
        .state-shadow .a3-front,.state-shadow .a3-top,.state-shadow .a3-side{fill:url(#a3-hatch);stroke:#65ccda}
        .state-new .a3-front,.state-new .a3-top,.state-new .a3-side{fill:#2f78b7;stroke:#9adce4;stroke-width:2}
        .a3-gate{fill:#0f3d66;stroke:#65ccda;stroke-width:2}
        .a3-fallback rect{fill:#213e5a;stroke:#a8bfd2;stroke-width:2;stroke-dasharray:7 5}
        .a3-human{fill:#163756;stroke:#91b7d6}
        .a3-route{fill:currentColor;color:#eef7ff}
        .a3-route.secondary{color:#b7d2e8}
      </style>
      <rect width="1360" height="660" fill="#062c56"></rect>
      <g id="four-state-f0" data-phase="F0" role="group" aria-label="1 · Current authority">
        <title>1 · Current authority</title>
        <rect x="7" y="7" width="326" height="646" rx="8" fill="#082f57" stroke="#7aa6c9"></rect>
        <text x="22" y="40" class="a3-strong"><tspan x="22" dy="0">1 · CURRENT AUTHORITY</tspan></text>
        <text x="22" y="82" class="a3-secondary"><tspan x="22" dy="0">Most work stays legacy or human.</tspan><tspan x="22" dy="1.25em">Unknown coupling remains visible.</tspan></text>
        <text x="22" y="168" class="a3-strong"><tspan x="22" dy="0">LEGACY</tspan></text>
        <text x="180" y="168" class="a3-strong"><tspan x="180" dy="0">BOUNDARY / NEW</tspan></text><g class="a3-cube state-legacy" data-cube-id="CAP-SEARCH"
