<svg xmlns="http://www.w3.org/2000/svg" class="a3-svg" viewBox="0 0 1350 760" role="img" aria-labelledby="triptych-title triptych-desc" style="color:#eef7ff">
      <defs>
      <pattern id="a3-hatch" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
        <rect width="9" height="9" fill="#164f78"></rect>
        <line x1="0" y1="0" x2="0" y2="9" stroke="#65ccda" stroke-width="2"></line>
      </pattern>
    </defs>
      <title id="triptych-title">Evidence-Guided Capability Transfer Model — three-phase storyboard</title>
      <desc id="triptych-desc">Current legacy authority, a bounded evidence period with shadow routing and no transfer, and selective validated authority transfer with retained legacy and rollback. Curators contribute workflow evidence, shape the design in reviews, then train while launch procedures are written.</desc>
      <style>
        text{font-family:Inter,system-ui,sans-serif;font-size:16px;fill:#eef7ff}
        .a3-strong{font-weight:600}.a3-secondary{fill:#b7d2e8}
        .a3-front,.a3-top,.a3-side{stroke:#7aa6c9;stroke-width:1}
        .state-legacy .a3-front,.state-legacy .a3-top,.state-legacy .a3-side{fill:#184f7a}
        .state-retained_legacy .a3-front,.state-retained_legacy .a3-top,.state-retained_legacy .a3-side{fill:#213e5a;stroke:#a8bfd2}
        .state-shadow .a3-front,.state-shadow .a3-top,.state-shadow .a3-side{fill:url(#a3-hatch);stroke:#65ccda}
        .state-new .a3-front,.state-new .a3-top,.state-new .a3-side{fill:#2f78b7;stroke:#9adce4;stroke-width:2}
        .a3-gate{fill:#0f3d66;stroke:#65ccda;stroke-width:2}
        .a3-fallback rect{fill:#213e5a;stroke:#a8bfd2;stroke-width:2;stroke-dasharray:7 5}
        .a3-human{fill:#163756;stroke:#91b7d6}
        .a3-route{fill:currentColor;color:#eef7ff}
        .a3-route.secondary{color:#b7d2e8}
      </style>
      <rect width="1350" height="760" fill="#062c56"></rect>
      <g id="triptych-f0" data-phase="F0" role="group" aria-label="1 · CURRENT AUTHORITY">
        <title>1 · CURRENT AUTHORITY</title>
        <rect x="8" y="8" width="434" height="742" rx="8" fill="#082f57" stroke="#7aa6c9"></rect>
        <text x="28" y="42" class="a3-strong"><tspan x="28" dy="0">1 · CURRENT AUTHORITY</tspan></text>
        <text x="28" y="82" class="a3-secondary"><tspan x="28" dy="0">Current authority, coupling, and uncertainty</tspan><tspan x="28" dy="1.25em">stay explicit.</tspan></text>
        <text x="28" y="155" class="a3-strong"><tspan x="28" dy="0">LEGACY</tspan></text>
        <text x="238" y="155" class="a3-strong"><tspan x="238" dy="0">BOUNDARY / NEW</tspan></text><g class="a3-cube state-legacy" data-cube-id="CAP-SEARCH"
      role="group" aria-label="Search; Legacy authority">
      <title>Standard and advanced search — Legacy authority</title>
      <polygon class="a3-top" points="28,188 42,174 232,174 218,188"></polygon>
      <polygon class="a3-side" points="218,188 232,174 232,236 218,250"></polygon>
      <rect class="a3-front" x="28" y="188" width="190" height="62" rx="5"></rect>
      <text x="40" y="210" class="a3-strong"><tspan x="40" dy="0">Search</tspan></text>
    </g><g class="a3-cube state-legacy" data-cube-id="CAP-SPECIMEN"
      role="group" aria-label="Specimen overview; Legacy authority">
      <title>Specimen details and overview — Legacy authority</title>
      <polygon class="a3-top" points="28,264 42,250 232,250 218,264"></polygon>
      <polygon class="a3-side" points="218,264 232,250 232,312 218,326"></polygon>
      <rect class="a3-front" x="28" y="264" width="190" height="62" rx="5"></rect>
      <text x="40" y="286" class="a3-strong"><tspan x="40" dy="0">Specimen overview</tspan></text>
    </g><g class="a3-cube state-legacy" data-cube-id="CAP-VARIANT"
      role="group" aria-label="Variant details; Legacy authority">
      <title>Variant detail views and status rules — Legacy authority</title>
      <polygon class="a3-top" points="28,340 42,326 232,326 218,340"></polygon>
      <polygon class="a3-side" points="218,340 232,326 232,388 218,402"></polygon>
      <rect class="a3-front" x="28" y="340" width="190" height="62" rx="5"></rect>
      <text x="40" y="362" class="a3-strong"><tspan x="40" dy="0">Variant details</tspan></text>
    </g><g class="a3-cube state-legacy" data-cube-id="CAP-OP-ASSIGN"
      role="group" aria-label="Operational / assignment; Legacy authority">
      <title>Profiles, permissions &amp; case assignment — Legacy authority</title>
      <polygon class="a3-top" points="28,416 42,402 232,402 218,416"></polygon>
      <polygon class="a3-side" points="218,416 232,402 232,464 218,478"></polygon>
      <rect class="a3-front" x="28" y="416" width="190" height="62" rx="5"></rect>
      <text x="40" y="438" class="a3-strong"><tspan x="40" dy="0">Operational /</tspan><tspan x="40" dy="1.25em">assignment</tspan></text>
    </g><text x="240" y="276" class="a3-secondary"><tspan x="240" dy="0">No verified boundary</tspan></text><rect class="a3-human" x="28" y="590" width="394" height="132" rx="6"></rect><text x="42" y="626" class="a3-strong"><tspan x="42" dy="0">HUMAN WORKFLOW AUTHORITY</tspan></text><text x="42" y="664" class="a3-secondary"><tspan x="42" dy="0">Curators surface workflow needs and</tspan><tspan x="42" dy="1.25em">operational evidence from daily work.</tspan></text></g><g id="triptych-f2" data-phase="F2" role="group" aria-label="2 · BOUNDED EVIDENCE PERIOD">
        <title>2 · BOUNDED EVIDENCE PERIOD</title>
        <rect x="458" y="8" width="434" height="742" rx="8" fill="#082f57" stroke="#7aa6c9"></rect>
        <text x="478" y="42" class="a3-strong"><tspan x="478" dy="0">2 · BOUNDED EVIDENCE PERIOD</tspan></text>
        <text x="478" y="82" class="a3-secondary"><tspan x="478" dy="0">Bounded traffic builds evidence while legacy</tspan><tspan x="478" dy="1.25em">authority and rollback remain.</tspan></text>
        <text x="478" y="155" class="a3-strong"><tspan x="478" dy="0">LEGACY</tspan></text>
        <text x="688" y="155" class="a3-strong"><tspan x="688" dy="0">BOUNDARY / NEW</tspan></text><g class="a3-cube state-legacy" data-cube-id="CAP-SEARCH"
