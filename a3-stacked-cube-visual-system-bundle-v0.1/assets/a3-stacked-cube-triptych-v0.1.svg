      <rect x="928" y="416" width="190" height="84" rx="6"></rect>
      <text x="940" y="442" class="a3-strong"><tspan x="940" dy="0">FALLBACK ROUTE</tspan></text>
      <text x="940" y="466" class="a3-secondary"><tspan x="940" dy="0">Prior implementation</tspan><tspan x="940" dy="1.25em">retained</tspan></text>
    </g><g class="a3-cube state-new" data-cube-id="CAP-OP-ASSIGN"
      role="group" aria-label="Operational / assignment; New authority">
