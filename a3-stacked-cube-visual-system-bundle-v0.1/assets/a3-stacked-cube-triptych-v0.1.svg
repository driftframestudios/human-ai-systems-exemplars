      <polygon class="a3-top" points="928,188 942,174 1132,174 1118,188"></polygon>
      <polygon class="a3-side" points="1118,188 1132,174 1132,236 1118,250"></polygon>
      <rect class="a3-front" x="928" y="188" width="190" height="62" rx="5"></rect>
      <text x="940" y="210" class="a3-strong"><tspan x="940" dy="0">Search</tspan></text>
    </g><g class="a3-cube state-retained_legacy" data-cube-id="CAP-SPECIMEN"
      role="group" aria-label="Specimen overview; Retained legacy">
