      <text x="490" y="286" class="a3-strong"><tspan x="490" dy="0">Specimen overview</tspan></text>
    </g><g class="a3-cube state-retained_legacy" data-cube-id="CAP-VARIANT"
      role="group" aria-label="Variant details; Retained legacy">
      <title>Variant detail views and status rules — Retained legacy</title>
      <polygon class="a3-top" points="478,340 492,326 682,326 668,340"></polygon>
      <polygon class="a3-side" points="668,340 682,326 682,388 668,402"></polygon>
      <rect class="a3-front" x="478" y="340" width="190" height="62" rx="5"></rect>
      <text x="490" y="362" class="a3-strong"><tspan x="490" dy="0">Variant details</tspan></text>
    </g><g class="a3-cube state-legacy" data-cube-id="CAP-OP-ASSIGN"
      role="group" aria-label="Operational / assignment; Legacy authority">
      <title>Profiles, permissions &amp; case assignment — Legacy authority</title>
      <polygon class="a3-top" points="478,416 492,402 682,402 668,416"></polygon>
      <polygon class="a3-side" points="668,416 682,402 682,464 668,478"></polygon>
      <rect class="a3-front" x="478" y="416" width="190" height="62" rx="5"></rect>
      <text x="490" y="438" class="a3-strong"><tspan x="490" dy="0">Operational /</tspan><tspan x="490" dy="1.25em">assignment</tspan></text>
    </g><g class="a3-cube state-shadow" data-cube-id="CAP-OP-ASSIGN"
      role="group" aria-label="Operational / assignment; Shadow / dual-run">
      <title>Profiles, permissions &amp; case assignment — Shadow / dual-run</title>
      <polygon class="a3-top" points="688,204 702,190 892,190 878,204"></polygon>
      <polygon class="a3-side" points="878,204 892,190 892,252 878,266"></polygon>
      <rect class="a3-front" x="688" y="204" width="190" height="62" rx="5"></rect>
      <text x="700" y="226" class="a3-strong"><tspan x="700" dy="0">Operational /</tspan><tspan x="700" dy="1.25em">assignment</tspan></text>
    </g><path class="a3-route secondary" d="M 676.0 408.0 L 676.0 290.0 L 680.5 290.0 L 674.0 278.0 L 667.5 290.0 L 672.0 290.0 L 672.0 408.0 Z" aria-hidden="true"></path><text x="688" y="294" class="a3-secondary"><tspan x="688" dy="0">mirrors · no transfer yet</tspan></text><rect class="a3-gate" x="682" y="326" width="188" height="92" rx="6"></rect><text x="696" y="356" class="a3-strong"><tspan x="696" dy="0">GATE + ROLLBACK</tspan></text><text x="696" y="386" class="a3-secondary"><tspan x="696" dy="0">parity · audit · recovery</tspan><tspan x="696" dy="1.25em">path</tspan></text><rect class="a3-human" x="478" y="590" width="394" height="132" rx="6"></rect><text x="492" y="626" class="a3-strong"><tspan x="492" dy="0">HUMAN WORKFLOW AUTHORITY</tspan></text><text x="492" y="664" class="a3-secondary"><tspan x="492" dy="0">Curators shape the design through continual</tspan><tspan x="492" dy="1.25em">review and sprint-closure presentations.</tspan></text></g><g id="triptych-f3" data-phase="F3" role="group" aria-label="3 · VALIDATED AUTHORITY">
        <title>3 · VALIDATED AUTHORITY</title>
        <rect x="908" y="8" width="434" height="742" rx="8" fill="#082f57" stroke="#7aa6c9"></rect>
        <text x="928" y="42" class="a3-strong"><tspan x="928" dy="0">3 · VALIDATED AUTHORITY</tspan></text>
        <text x="928" y="82" class="a3-secondary"><tspan x="928" dy="0">Only an evidenced capability transfers;</tspan><tspan x="928" dy="1.25em">retained work and rollback stay visible.</tspan></text>
        <text x="928" y="155" class="a3-strong"><tspan x="928" dy="0">LEGACY</tspan></text>
        <text x="1138" y="155" class="a3-strong"><tspan x="1138" dy="0">BOUNDARY / NEW</tspan></text><g class="a3-cube state-legacy" data-cube-id="CAP-SEARCH"
      role="group" aria-label="Search; Legacy authority">
