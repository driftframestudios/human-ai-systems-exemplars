      <text x="490" y="210" class="a3-strong"><tspan x="490" dy="0">Search</tspan></text>
    </g><g class="a3-cube state-retained_legacy" data-cube-id="CAP-SPECIMEN"
      role="group" aria-label="Specimen overview; Retained legacy">
      <title>Specimen details and overview — Retained legacy</title>
      <polygon class="a3-top" points="478,264 492,250 682,250 668,264"></polygon>
      <polygon class="a3-side" points="668,264 682,250 682,312 668,326"></polygon>
