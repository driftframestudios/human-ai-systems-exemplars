      <text x="1150" y="226" class="a3-strong"><tspan x="1150" dy="0">Operational /</tspan><tspan x="1150" dy="1.25em">assignment</tspan></text>
    </g><rect class="a3-gate" x="1132" y="326" width="188" height="92" rx="6"></rect><text x="1146" y="356" class="a3-strong"><tspan x="1146" dy="0">VALIDATED GATE</tspan></text><text x="1146" y="386" class="a3-secondary"><tspan x="1146" dy="0">protected behavior</tspan><tspan x="1146" dy="1.25em">verified</tspan></text><path class="a3-route secondary" d="M 1136.0 277.7 L 1117.7 405.8 L 1113.3 405.2 L 1118.0 418.0 L 1126.1 407.0 L 1121.7 406.4 L 1140.0 278.3 Z" aria-hidden="true"></path><text x="1138" y="294" class="a3-secondary"><tspan x="1138" dy="0">validated transfer ·</tspan><tspan x="1138" dy="1.25em">rollback stays</tspan></text><rect class="a3-human" x="928" y="590" width="394" height="132" rx="6"></rect><text x="942" y="626" class="a3-strong"><tspan x="942" dy="0">HUMAN WORKFLOW AUTHORITY</tspan></text><text x="942" y="664" class="a3-secondary"><tspan x="942" dy="0">Curators train on each validated portion while</tspan><tspan x="942" dy="1.25em">launch SOPs are written and reviewed.</tspan></text></g>
    </svg>
