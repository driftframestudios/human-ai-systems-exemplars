      <polygon class="a3-top" points="928,264 942,250 1132,250 1118,264"></polygon>
      <polygon class="a3-side" points="1118,264 1132,250 1132,312 1118,326"></polygon>
      <rect class="a3-front" x="928" y="264" width="190" height="62" rx="5"></rect>
      <text x="940" y="286" class="a3-strong"><tspan x="940" dy="0">Specimen overview</tspan></text>
    </g><g class="a3-cube state-retained_legacy" data-cube-id="CAP-VARIANT"
      role="group" aria-label="Variant details; Retained legacy">
      <title>Variant detail views and status rules — Retained legacy</title>
      <polygon class="a3-top" points="928,340 942,326 1132,326 1118,340"></polygon>
      <polygon class="a3-side" points="1118,340 1132,326 1132,388 1118,402"></polygon>
      <rect class="a3-front" x="928" y="340" width="190" height="62" rx="5"></rect>
      <text x="940" y="362" class="a3-strong"><tspan x="940" dy="0">Variant details</tspan></text>
    </g><g class="a3-fallback" role="group" aria-label="Fallback route; prior implementation retained for recovery">
