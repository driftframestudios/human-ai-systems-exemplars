name: Release and production schema delivery

on:
  pull_request:
    branches:
      - release
      - prod
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  push:
    branches:
      - release
      - prod

permissions:
  contents: read

jobs:
  contract:
    name: Schema delivery contract
    if: >-
      (github.event_name == 'pull_request' &&
       github.event.pull_request.draft == false &&
       ((github.base_ref == 'release' && vars.ACTIONS_BUDGET_RELEASE == 'true') ||
        (github.base_ref == 'prod' && vars.ACTIONS_BUDGET_PROD == 'true'))) ||
      (github.event_name == 'push' &&
       ((github.ref_name == 'release' && vars.ACTIONS_BUDGET_RELEASE == 'true') ||
        (github.ref_name == 'prod' && vars.ACTIONS_BUDGET_PROD == 'true')))
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    concurrency:
      group: schema-delivery-contract-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    env:
      RECEIVER: ${{ github.event_name == 'pull_request' && github.base_ref || github.ref_name }}
      RELEASE_BUDGET_MINUTES: ${{ vars.ACTIONS_BUDGET_RELEASE_MINUTES }}
      PROD_BUDGET_MINUTES: ${{ vars.ACTIONS_BUDGET_PROD_MINUTES }}

    steps:
      - name: Receive the candidate revision and history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Use the reviewed Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm

      - name: Install the locked release toolchain
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Check schema identities and delivery bytes
        run: |
          npm run check:schemas
          npm run build:schema-delivery
          npm run check:schema-delivery

      - name: Dry-run the receiving Cloudflare environment
        shell: bash
        env:
          WRANGLER_LOG_PATH: ${{ runner.temp }}/wrangler-logs
        run: |
          set -euo pipefail
          case "$RECEIVER" in
            release) npm run dry-run:schema-delivery:release ;;
            prod) npm run dry-run:schema-delivery ;;
            *) echo "Choose the release or prod receiver."; exit 2 ;;
          esac

      - name: Prepare the pinned secret-material reader
        run: npm run security:secrets:install

      - name: Prove and read the secret-material boundary
        run: |
          npm run test:secret-material
          npm run security:secrets

      - name: Record the bounded contract receipt
        if: always()
        shell: bash
        run: |
          {
            echo "## Schema delivery contract"
            echo
            echo "- Receiver: \`$RECEIVER\`"
            echo "- Candidate: \`$GITHUB_SHA\`"
            if [[ "$RECEIVER" == "release" ]]; then
              echo "- Approved cycle allocation: \`${RELEASE_BUDGET_MINUTES:-unset} minutes\`"
            else
              echo "- Approved cycle allocation: \`${PROD_BUDGET_MINUTES:-unset} minutes\`"
            fi
            echo "- Contract: schema identity, exact delivery bytes, Wrangler dry run, and secret-material boundary"
            echo "- Deployment authority: independently selected through \`DEPLOYMENT_ACTIVE_RECEIVERS\`"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy schema receiver
    needs: contract
    if: >-
      github.event_name == 'push' &&
      contains(fromJSON(vars.DEPLOYMENT_ACTIVE_RECEIVERS || '[]'), github.ref_name)
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    concurrency:
      group: schema-delivery-deploy-${{ github.ref_name }}
      cancel-in-progress: false
    environment:
      name: ${{ github.ref_name }}
    env:
      RECEIVER: ${{ github.ref_name }}

    steps:
      - name: Receive the accepted branch coordinate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use the reviewed Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm

      - name: Install the locked deployment toolchain
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Confirm the credential receiver
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${CLOUDFLARE_ACCOUNT_ID:-}" || -z "${CLOUDFLARE_API_TOKEN:-}" ]]; then
            echo "The $RECEIVER environment is ready for its Cloudflare account coordinate and API token."
            exit 2
          fi

      - name: Rebuild and verify the accepted asset closure
        run: |
          npm run build:schema-delivery
          npm run check:schema-delivery

      - name: Deploy the selected schema receiver
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WRANGLER_LOG_PATH: ${{ runner.temp }}/wrangler-logs
        run: |
          set -euo pipefail
          case "$RECEIVER" in
            release) npm run deploy:schema-delivery:release -- --message "$GITHUB_REPOSITORY@$GITHUB_SHA" ;;
            prod) npm run deploy:schema-delivery:prod -- --message "$GITHUB_REPOSITORY@$GITHUB_SHA" ;;
            *) echo "Choose the release or prod receiver."; exit 2 ;;
          esac

      - name: Record the deployment receipt
        shell: bash
        run: |
          {
            echo "## Schema receiver deployment"
            echo
            echo "- Receiver: \`$RECEIVER\`"
            echo "- Repository coordinate: \`$GITHUB_SHA\`"
            echo "- Wrangler configuration: \`cloudflare/schema-delivery/wrangler.jsonc\`"
            echo "- Recovery: use the preceding Cloudflare Worker version named in deployment history"
          } >> "$GITHUB_STEP_SUMMARY"
