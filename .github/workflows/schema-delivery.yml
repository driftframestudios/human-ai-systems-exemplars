name: Release and production schema delivery

on:
  pull_request:
    branches:
      - release
      - prod
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  push:
    branches:
      - release
      - prod

permissions:
  contents: read

jobs:
  contract:
    name: Schema delivery contract
    if: >-
      (github.event_name == 'pull_request' &&
       github.event.pull_request.draft == false &&
       ((github.base_ref == 'release' && vars.ACTIONS_BUDGET_RELEASE == 'true') ||
        (github.base_ref == 'prod' && vars.ACTIONS_BUDGET_PROD == 'true'))) ||
      (github.event_name == 'push' &&
       ((github.ref_name == 'release' && vars.ACTIONS_BUDGET_RELEASE == 'true') ||
        (github.ref_name == 'prod' && vars.ACTIONS_BUDGET_PROD == 'true')))
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    concurrency:
      group: schema-delivery-contract-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    env:
      RECEIVER: ${{ github.event_name == 'pull_request' && github.base_ref || github.ref_name }}
      RELEASE_BUDGET_MINUTES: ${{ vars.ACTIONS_BUDGET_RELEASE_MINUTES }}
      PROD_BUDGET_MINUTES: ${{ vars.ACTIONS_BUDGET_PROD_MINUTES }}

    steps:
      - name: Receive the candidate revision and history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Use the reviewed Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.4"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            cloudflare/schemas-worker/package-lock.json

      - name: Record the admitted Node runtime
        run: node tools/check-node-runtime.mjs

      - name: Install the locked root toolchain
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Install the locked schema Worker toolchain
        working-directory: cloudflare/schemas-worker
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Observe the installed Wrangler dependency path
        run: |
          npm ls wrangler miniflare sharp --all
          npm --prefix cloudflare/schemas-worker ls wrangler miniflare sharp --all

      - name: Check schema identities
        run: npm run check:schemas

      - name: Check the reviewed dependency floor
        run: npm run test:dependency-security

      - name: Check the accepted schema Worker publication
        working-directory: cloudflare/schemas-worker
        run: |
          npm run check:accepted-publication
          npm test

      - name: Dry-run the schema Worker bundle
        working-directory: cloudflare/schemas-worker
        env:
          WRANGLER_LOG_PATH: ${{ runner.temp }}/wrangler-logs
        run: npm exec -- wrangler deploy --dry-run

      - name: Prepare the pinned secret-material reader
        run: npm run security:secrets:install

      - name: Prove and inspect the selected public artifact
        run: |
          npm run test:secret-material
          npm run security:secrets:canary
          npm run security:secrets:artifact -- cloudflare/schemas-worker/public

      - name: Record the bounded contract receipt
        if: always()
        shell: bash
        run: |
          {
            echo "## Schema delivery contract"
            echo
            echo "- Receiver: \`$RECEIVER\`"
            echo "- Candidate: \`$GITHUB_SHA\`"
            if [[ "$RECEIVER" == "release" ]]; then
              echo "- Approved cycle allocation: \`${RELEASE_BUDGET_MINUTES:-unset} minutes\`"
            else
              echo "- Approved cycle allocation: \`${PROD_BUDGET_MINUTES:-unset} minutes\`"
            fi
            echo "- Contract: schema identity, reviewed dependency path, exact accepted Worker publication, Worker unit tests, Wrangler dry run, and selected-artifact secret boundary"
            echo "- Deployment authority: a successful \`prod\` push with \`DEPLOYMENT_ACTIVE_RECEIVERS\` and \`SCHEMA_WORKER_DEPENDENCY_GATE=open\`"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy production schema Worker
    needs: contract
    if: >-
      github.event_name == 'push' &&
      github.ref_name == 'prod' &&
      contains(fromJSON(vars.DEPLOYMENT_ACTIVE_RECEIVERS || '[]'), 'prod') &&
      vars.SCHEMA_WORKER_DEPENDENCY_GATE == 'open'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    concurrency:
      group: schema-delivery-deploy-prod
      cancel-in-progress: false
    environment:
      name: prod
    env:
      RECEIVER: prod

    steps:
      - name: Receive the accepted branch coordinate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Use the reviewed Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.4"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            cloudflare/schemas-worker/package-lock.json

      - name: Record the admitted Node runtime
        run: node tools/check-node-runtime.mjs

      - name: Install the locked root toolchain
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Install the locked schema Worker toolchain
        working-directory: cloudflare/schemas-worker
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify the accepted schema Worker publication
        working-directory: cloudflare/schemas-worker
        run: npm run check:accepted-publication

      - name: Deploy the accepted schema Worker
        working-directory: cloudflare/schemas-worker
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WRANGLER_LOG_PATH: ${{ runner.temp }}/wrangler-logs
        run: |
          set -euo pipefail
          if [[ -z "${CLOUDFLARE_ACCOUNT_ID:-}" || -z "${CLOUDFLARE_API_TOKEN:-}" ]]; then
            echo "The $RECEIVER environment is ready for its Cloudflare account coordinate and API token."
            exit 2
          fi
          exec ./node_modules/.bin/wrangler deploy --strict --message "$GITHUB_REPOSITORY@$GITHUB_SHA"

      - name: Record the deployment receipt
        shell: bash
        run: |
          {
            echo "## Schema receiver deployment"
            echo
            echo "- Receiver: \`$RECEIVER\`"
            echo "- Repository coordinate: \`$GITHUB_SHA\`"
            echo "- Wrangler configuration: \`cloudflare/schemas-worker/wrangler.jsonc\`"
            echo "- Dependency gate: \`SCHEMA_WORKER_DEPENDENCY_GATE=open\`"
            echo "- Recovery: use the preceding Cloudflare Worker version named in deployment history"
          } >> "$GITHUB_STEP_SUMMARY"
