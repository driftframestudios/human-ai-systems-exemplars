name: Prototype, iframe, media, and public-reference contracts

on:
  workflow_dispatch:
    inputs:
      suite:
        description: Contract family to exercise
        required: true
        default: all
        type: choice
        options:
          - all
          - core
          - iframe
          - media
          - narrative
          - public-references
      confirm_run:
        description: Acquire a standard runner for this selected suite
        required: true
        default: false
        type: boolean
      include_browser:
        description: Exercise selected rendered-page contracts with Chromium and their named engine checks
        required: true
        default: false
        type: boolean
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    paths:
      - ".github/workflows/prototype-unit-tests.yml"
      - ".github/dependencies/**"
      - ".agents/skills/**/SKILL.md"
      - ".agents/skills/**/scripts/**"
      - ".agents/skills/publication-selection.json"
      - ".env.public.example"
      - "package.json"
      - "package-lock.json"
      - "AUTHORS"
      - "CITATION.cff"
      - "GOVERNANCE.md"
      - "LICENSE"
      - "attribution.yml"
      - "tests/attribution/**"
      - "tests/core-architectures/**"
      - "tests/context-canvas/**"
      - "tests/suites/**"
      - "tests/iframe-routes/**"
      - "tests/narrative-architectures/**"
      - "tests/media-publication/**"
      - "tests/public-references/**"
      - "tests/skills/**"
      - "planning/media-publication/**"
      - "deployment/public-references/**"
      - "tools/build-prod-projection.mjs"
      - "tools/prepare-r2-progressive-video.mjs"
      - "tools/registry-reference-contract.mjs"
      - "tools/verify-r2-video-route.mjs"
      - "tools/verify-registry-public-references.mjs"
      - "cloudflare/r2-video-delivery/**"
      - "tools/core-architecture-browser-helper.mjs"
      - "tools/core-decision-canvas-contract.mjs"
      - "tools/core-iframe-carrier-contract.mjs"
      - "tools/core-planning-instrument-contract.mjs"
      - "tools/core-reference-instrument-contract.mjs"
      - "tools/canvas-iframe-route-browser-contract.mjs"
      - "tools/form-control-label-contract.mjs"
      - "tools/generate-debrief-image-derivatives.mjs"
      - "tools/initiative-costing-label-contract.mjs"
      - "tools/iframe-route-package-engine.mjs"
      - "tools/materialize-public-references.mjs"
      - "tools/materialize-debrief-case-briefs.mjs"
      - "tools/package-canvas-iframe-routes.mjs"
      - "tools/package-iframe-routes.mjs"
      - "tools/package-v1-iframe-routes.mjs"
      - "tools/context-canvas-visual-reference.mjs"
      - "tools/rail-label-failures.mjs"
      - "tools/test-suite-plan.mjs"
      - "tools/verify-live-iframe-routes.mjs"
      - "tools/attribution-contract.mjs"
      - "tools/cross-prototype-exchange-contract.mjs"
      - "tools/narrative-architecture-contract.mjs"
      - "core-architectures-chimeric-prototype-current-pack-v0.1/**"
      - "iframe-route-families/**"
      - "participatory-design-kit-chimeric-prototype-set-v0.1/**"
      - "collaboration/**"
      - "context-canvas-project-surface/**"
      - "visualization-fidelity-atlas-bundle-v0.1/**"

permissions:
  contents: read

concurrency:
  group: prototype-units-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  public-reference-contracts:
    name: Public-reference contracts
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' &&
       inputs.confirm_run &&
       (inputs.suite == 'all' || inputs.suite == 'public-references'))
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Check out the candidate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Use the reviewed Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22.23.4"

      - name: Record the admitted Node runtime
        run: node tools/check-node-runtime.mjs

      - name: Use the reviewed Python runtime
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install the locked Node dependencies
        run: npm ci --ignore-scripts

      - name: Exercise the owned contract routes
        run: npm run test:node-runtime && npm run test:public-reference-contracts

  prototype-units:
    name: Selected prototype or iframe contract
    if: >-
      (github.event_name == 'workflow_dispatch' &&
       inputs.confirm_run &&
       inputs.suite != 'media' &&
       inputs.suite != 'public-references') ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.draft == false &&
       vars.PROTOTYPE_UNIT_TESTS_AUTOMATIC == 'true')
    runs-on: ubuntu-24.04
    # The explicit all-plus-browser route exercises Chromium, Firefox, and WebKit
    # across every carrier family in sequence. Thirty minutes keeps that release
    # proof bounded while preserving headroom for the complete declared route.
    timeout-minutes: 30

    steps:
      - name: Check out the candidate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Use the reviewed Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22.23.4"

      - name: Record the admitted Node runtime
        run: node tools/check-node-runtime.mjs

      - name: Install the locked root toolchain
        run: npm ci --ignore-scripts

      - name: Exercise Context Canvas source and inventory contracts
        run: |
          npm run check:debrief-case-briefs
          npm run test:context-canvas
          npm run test:suites:unit
          npm run visual:context-canvas-reference -- --list
          npm run check:debrief-image-derivatives

      - name: Install Chromium for the selected rendered-page contracts
        if: ${{ github.event_name == 'pull_request' || inputs.include_browser }}
        run: npm run playwright -- install --with-deps chromium

      - name: Install WebKit for the Context Canvas image-delivery contract
        if: ${{ github.event_name == 'pull_request' || (inputs.include_browser && (inputs.suite == 'all' || inputs.suite == 'iframe')) }}
        run: npm run playwright -- install --with-deps webkit

      - name: Install Firefox for the all-family Debrief reading contracts
        if: ${{ github.event_name == 'pull_request' || (inputs.include_browser && inputs.suite == 'all') }}
        run: npm run playwright -- install --with-deps firefox

      - name: Exercise the selected source contracts
        env:
          SELECTED_SUITE: ${{ inputs.suite || 'all' }}
          INCLUDE_BROWSER: ${{ github.event_name == 'pull_request' || inputs.include_browser }}
        shell: bash
        run: |
          set -euo pipefail

          case "$SELECTED_SUITE" in
            core)
              npm run test:attribution
              npm run test:iframe-routes
              npm run check:iframe-routes
              npm run test:core-architectures
              if [[ "$INCLUDE_BROWSER" == "true" ]]; then
                npm run test:core-browser
                npm run test:iframe-ancestry-browser
              fi
              ;;
            iframe)
              npm run test:attribution
              npm run test:iframe-routes
              npm run check:iframe-routes
              if [[ "$INCLUDE_BROWSER" == "true" ]]; then
                npm run test:debrief-catalog-preview-browser
                npm run test:prototype-control-labels
                npm run test:iframe-browser
                npm run test:iframe-ancestry-browser
              fi
              ;;
            narrative)
              npm run test:narrative-architectures
              if [[ "$INCLUDE_BROWSER" == "true" ]]; then npm run test:narrative-browser; fi
              ;;
            all)
              npm run test:attribution
              npm run test:iframe-routes
              npm run check:iframe-routes
              npm run test:prototype-units
              if [[ "$INCLUDE_BROWSER" == "true" ]]; then
                npm run test:about-media-browser
                npm run test:debrief-catalog-preview-browser
                npm run test:debrief-reading-layout-browser
                npm run test:debrief-reference-figures-browser
                npm run test:debrief-caption-colors-browser
                npm run test:ai-systems-reading-layout-browser
                npm run test:site-navigation-browser
                npm run test:debrief-link-cues-browser
                npm run test:context-canvas-image-delivery-browser
                npm run test:who-to-believe-system-graph-browser
                npm run test:prod-css-projection-browser
                npm run test:prototype-control-labels
                npm run test:core-browser
                npm run test:canvas-iframe-routes
                npm run test:iframe-ancestry-browser
                npm run test:narrative-browser
                npm run test:prototype-exchanges
              fi
              ;;
            *)
              echo "Choose core, iframe, narrative, or all."
              exit 2
              ;;
          esac

  media-publication:
    name: Media preparation and delivery contracts
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' &&
       inputs.confirm_run &&
       (inputs.suite == 'all' || inputs.suite == 'media'))
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Record the runner image and media-job start
        id: media-runtime
        shell: bash
        run: |
          set -euo pipefail
          : "${ImageVersion:?GitHub-hosted runner image version is required}"
          printf 'image-version=%s\n' "$ImageVersion" >> "$GITHUB_OUTPUT"
          printf 'job-started-at=%s\n' "$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Check out the candidate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Use the reviewed Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22.23.4"

      - name: Record the admitted Node runtime
        run: node tools/check-node-runtime.mjs

      - name: Install the locked root toolchain
        run: npm ci --ignore-scripts

      - name: Resolve the verified Ubuntu media package plan
        id: media-apt-plan
        shell: bash
        run: |
          set -euo pipefail
          started=$SECONDS
          mapfile -t packages < <(
            sed -E 's/[[:space:]]*#.*$//' .github/dependencies/media-apt-packages.txt |
              sed -E '/^[[:space:]]*$/d'
          )
          if ((${#packages[@]} == 0)); then
            echo "The media package manifest must select at least one Ubuntu package." >&2
            exit 2
          fi
          for package in "${packages[@]}"; do
            if [[ ! "$package" =~ ^[a-z0-9][a-z0-9+.-]*$ ]]; then
              echo "The media package manifest contains an unsupported package token: $package" >&2
              exit 2
            fi
          done

          sudo apt-get update
          plan="$RUNNER_TEMP/media-apt-plan.txt"
          LC_ALL=C apt-get --simulate install --no-install-recommends "${packages[@]}" |
            awk -f .github/dependencies/apt-install-plan.awk |
            sort -u > "$plan"
          if [[ ! -s "$plan" ]]; then
            dpkg-query --show --showformat='${binary:Package}=${Version}\n' "${packages[@]}" |
              sort -u > "$plan"
          fi

          digest="$(sha256sum "$plan" | awk '{print $1}')"
          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"
          printf 'package-count=%s\n' "$(wc -l < "$plan" | tr -d ' ')" >> "$GITHUB_OUTPUT"
          printf 'resolve-seconds=%s\n' "$((SECONDS - started))" >> "$GITHUB_OUTPUT"

      - name: Restore the verified FFmpeg package closure
        id: restore-media-apt
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/media-apt-archives
          key: media-apt-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.media-apt-plan.outputs.digest }}-${{ steps.media-runtime.outputs.image-version }}
          restore-keys: |
            media-apt-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.media-apt-plan.outputs.digest }}-

      - name: Install the verified Ubuntu media toolchain
        id: install-media-apt
        env:
          MEDIA_APT_ARCHIVES: ${{ runner.temp }}/media-apt-archives
        shell: bash
        run: |
          set -euo pipefail
          started=$SECONDS
          mapfile -t packages < <(
            sed -E 's/[[:space:]]*#.*$//' .github/dependencies/media-apt-packages.txt |
              sed -E '/^[[:space:]]*$/d'
          )
          mkdir -p "$MEDIA_APT_ARCHIVES/partial"
          chmod 0755 "$MEDIA_APT_ARCHIVES"
          sudo chown _apt:root "$MEDIA_APT_ARCHIVES/partial"
          sudo chmod 0700 "$MEDIA_APT_ARCHIVES/partial"
          # Download and installation remain separate so a restored archive can
          # satisfy the second phase entirely from the verified local closure.
          sudo apt-get \
            -o Dir::Cache::archives="$MEDIA_APT_ARCHIVES" \
            install --download-only --yes --no-install-recommends "${packages[@]}"
          sudo apt-get \
            -o Dir::Cache::archives="$MEDIA_APT_ARCHIVES" \
            install --no-download --yes --no-install-recommends "${packages[@]}"
          sudo chmod -R a+rX "$MEDIA_APT_ARCHIVES"
          printf 'install-seconds=%s\n' "$((SECONDS - started))" >> "$GITHUB_OUTPUT"

      - name: Confirm the media toolchain and exercise both preparation strategies
        id: media-contracts
        env:
          MEDIA_TEST_REQUIRE_FFMPEG: "true"
          PLAYWRIGHT_BROWSER_CHANNEL: chrome
        shell: bash
        run: |
          set -euo pipefail
          started=$SECONDS
          google-chrome --version
          ffmpeg -version
          ffprobe -version
          npm run test:media-publication
          npm run test:video-receivers-browser
          printf 'test-seconds=%s\n' "$((SECONDS - started))" >> "$GITHUB_OUTPUT"

      - name: Compile the exact Worker package for inspection
        id: worker-dry-run
        shell: bash
        run: |
          set -euo pipefail
          started=$SECONDS
          npm run dry-run:r2-video-delivery
          printf 'compile-seconds=%s\n' "$((SECONDS - started))" >> "$GITHUB_OUTPUT"

      - name: Save the verified FFmpeg package closure
        id: save-media-apt
        if: >-
          success() &&
          github.event_name == 'workflow_dispatch' &&
          github.ref == 'refs/heads/main' &&
          steps.restore-media-apt.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/media-apt-archives
          key: media-apt-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.media-apt-plan.outputs.digest }}-${{ steps.media-runtime.outputs.image-version }}

      - name: Record the media lane receipt
        if: always()
        env:
          APT_INSTALL_SECONDS: ${{ steps.install-media-apt.outputs.install-seconds }}
          APT_PACKAGE_COUNT: ${{ steps.media-apt-plan.outputs.package-count }}
          APT_PLAN_DIGEST: ${{ steps.media-apt-plan.outputs.digest }}
          APT_RESOLVE_SECONDS: ${{ steps.media-apt-plan.outputs.resolve-seconds }}
          CACHE_HIT: ${{ steps.restore-media-apt.outputs.cache-hit }}
          CACHE_MATCHED_KEY: ${{ steps.restore-media-apt.outputs.cache-matched-key }}
          CACHE_RESTORE_OUTCOME: ${{ steps.restore-media-apt.outcome }}
          CACHE_SAVE_OUTCOME: ${{ steps.save-media-apt.outcome }}
          JOB_STARTED_AT: ${{ steps.media-runtime.outputs.job-started-at }}
          MEDIA_CONTRACTS_OUTCOME: ${{ steps.media-contracts.outcome }}
          MEDIA_TEST_SECONDS: ${{ steps.media-contracts.outputs.test-seconds }}
          RUNNER_IMAGE_VERSION: ${{ steps.media-runtime.outputs.image-version }}
          WORKER_COMPILE_OUTCOME: ${{ steps.worker-dry-run.outcome }}
          WORKER_COMPILE_SECONDS: ${{ steps.worker-dry-run.outputs.compile-seconds }}
        shell: bash
        run: |
          set -euo pipefail
          case "${CACHE_RESTORE_OUTCOME:-skipped}" in
            success)
              if [[ "${CACHE_HIT:-}" == "true" ]]; then
                cache_standing="exact hit"
              elif [[ -n "${CACHE_MATCHED_KEY:-}" ]]; then
                cache_standing="compatible restore"
              else
                cache_standing="miss"
              fi
              ;;
            failure) cache_standing="unavailable" ;;
            cancelled) cache_standing="cancelled" ;;
            skipped) cache_standing="skipped" ;;
            *) cache_standing="unrecorded" ;;
          esac
          started_at="${JOB_STARTED_AT:-$(date +%s)}"
          total_seconds="$(( $(date +%s) - started_at ))"
          chrome_version="$(google-chrome --version 2>/dev/null || printf 'unavailable')"
          ffmpeg_version="$(ffmpeg -version 2>/dev/null | sed -n '1p' || printf 'unavailable')"
          ffprobe_version="$(ffprobe -version 2>/dev/null | sed -n '1p' || printf 'unavailable')"
          {
            echo "## Media preparation and delivery receipt"
            echo
            echo "| Field | Observation |"
            echo "| --- | --- |"
            echo "| Runner image | ${RUNNER_IMAGE_VERSION:-unrecorded} |"
            echo "| Browser receiver | ${chrome_version} |"
            echo "| FFmpeg | ${ffmpeg_version} |"
            echo "| FFprobe | ${ffprobe_version} |"
            echo "| Package closure | ${APT_PACKAGE_COUNT:-unrecorded} packages |"
            echo "| Package-plan digest | ${APT_PLAN_DIGEST:-unrecorded} |"
            echo "| Cache | ${cache_standing}; save ${CACHE_SAVE_OUTCOME:-skipped} |"
            echo "| Package-plan resolution | ${APT_RESOLVE_SECONDS:-unrecorded}s |"
            echo "| Media package installation | ${APT_INSTALL_SECONDS:-unrecorded}s |"
            echo "| Media and browser contracts | ${MEDIA_CONTRACTS_OUTCOME:-skipped}; ${MEDIA_TEST_SECONDS:-unrecorded}s |"
            echo "| Worker compilation | ${WORKER_COMPILE_OUTCOME:-skipped}; ${WORKER_COMPILE_SECONDS:-unrecorded}s |"
            echo "| Observed job time | ${total_seconds}s |"
          } >> "$GITHUB_STEP_SUMMARY"
