name: main / schema receiver route receipt

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    paths:
      - ".github/workflows/schema-receiver-routes.yml"
      - ".github/workflows/schema-pages.yml"
      - ".github/workflows/prototype-unit-tests.yml"
      - "package.json"
      - "package-lock.json"
      - "AUTHORS"
      - "CITATION.cff"
      - "LICENSE"
      - "AI-DATA-USE.md"
      - "attribution.yml"
      - "collaboration/investment-analysis/**"
      - "context-canvas-project-surface/context-canvas/visitor-boundary-contract.js"
      - "tests/schema-pages/**"
      - "tools/attribution-contract.mjs"
      - "tools/check-schema-surface.mjs"
      - "tools/build-schema-pages.mjs"
      - "tools/core-architecture-browser-helper.mjs"
      - "tools/publication-boundary.mjs"
      - "tools/schema-receiver-routes.mjs"
      - "tools/schema-publication.mjs"
      - "tools/schema-publication-lock.json"
      - "tools/schema-site-release.mjs"
      - "tools/verify-schema-pages-receiver.mjs"
      - ".agents/skills/**"
      - "schemas/**"
      - "threadkeeping/collaboration-accounts/**"
      - "threadkeeping/context-canvas-public-reference-materialization.md"
      - "threadkeeping/repository-secret-material-boundary.md"
      - "context-canvas-project-surface/context-canvas/collaboration-skills.html"
      - "context-canvas-project-surface/context-canvas/atlas-gallery.js"
      - "tests/visualization-fidelity-atlas/**"
      - "core-architectures-chimeric-prototype-current-pack-v0.1/core-architectures-chimeric-prototype-manifest-v0.1.json"
      - "core-architectures-chimeric-prototype-current-pack-v0.1/strategy-canvas-system-v0.2/strategy-canvas-evidence.v0.1.json"
      - "context-canvas-project-surface/context-canvas/prototypes/core-architectures/chimeric-pack-v0.1/core-architectures-chimeric-prototype-manifest-v0.1.json"
      - "a3-stacked-cube-atlas-expanded-bundle-v0.2/schema/**"
      - "a3-stacked-cube-visual-system-bundle-v0.1/schema/**"
      - "visualization-fidelity-atlas-bundle-v0.1/*.json*"
      - "context-canvas-project-surface/context-canvas/prototypes/narrative-architectures/**"
      - "core-architectures-chimeric-prototype-current-pack-v0.1/strategy-canvas-system-v0.2/strategy-canvas.schema.json"
      - "context-canvas-project-surface/context-canvas/prototypes/prototype-local-manifest.schema.json"
      - "supportive-change-writing-exemplars-bundle-v0.1/manifest.json"
      - "supportive-change-writing-exemplars-bundle-v0.1/schema/**"
      - "lims-eln-functional-nucleus/site-reading-governance/schemas/**"
      - "lims-eln-functional-nucleus/site-reading-governance/tools/validate_governance.py"
      - "lims-eln-functional-nucleus/lims-eln-program-specification/machine-node.json"

permissions:
  contents: read

concurrency:
  group: schema-receiver-routes-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  receiver-routes:
    name: Advisory schema receiver routes
    if: >-
      vars.ACTIONS_BUDGET_MAIN == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
       github.event.pull_request.draft == false)
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    environment:
      name: main
      deployment: false

    steps:
      - name: Receive the candidate revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Use the reviewed Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm

      - name: Install the locked schema toolchain
        run: npm ci --ignore-scripts

      - name: Install the browser used by the public-surface checks
        run: npm exec -- playwright install --with-deps chromium

      - name: Read schema identities and build receiver routes
        id: schema
        continue-on-error: true
        run: npm run check:schemas && npm run test:schema-pages

      - name: Describe the advisory receipt
        if: always()
        shell: bash
        env:
          SCHEMA_OUTCOME: ${{ steps.schema.outcome }}
        run: |
          if [[ "$SCHEMA_OUTCOME" == "success" ]]; then
            {
              echo "## Schema receiver route receipt"
              echo
              echo "Receiver identities and representative contracts align with their declared schema routes."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "## Schema receiver route receipt"
              echo
              echo "A schema identity, receiver route, or representative contract invites review."
              echo "The pull request remains available for collaboration; the preceding step names the affected surface."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
