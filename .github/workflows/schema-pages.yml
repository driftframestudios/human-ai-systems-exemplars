name: Publish schema documentation

on:
  push:
    branches:
      - docs
    paths:
      - ".github/workflows/schema-pages.yml"
      - "package.json"
      - "package-lock.json"
      - "AUTHORS"
      - "CITATION.cff"
      - "LICENSE"
      - "AI-DATA-USE.md"
      - "attribution.yml"
      - "context-canvas-project-surface/context-canvas/visitor-boundary-contract.js"
      - "schemas/**"
      - "supportive-change-writing-exemplars-bundle-v0.1/manifest.json"
      - "supportive-change-writing-exemplars-bundle-v0.1/schema/**"
      - "lims-eln-functional-nucleus/site-reading-governance/schemas/**"
      - "lims-eln-functional-nucleus/lims-eln-program-specification/machine-node.json"
      - "tools/build-schema-pages.mjs"
      - "tools/attribution-contract.mjs"
      - "tools/check-schema-surface.mjs"
      - "tools/schema-receiver-routes.mjs"
      - "tests/schema-pages/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: schema-pages
  cancel-in-progress: true

jobs:
  publish:
    name: Check, build, and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the docs branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Install the locked toolchain
        run: npm ci --ignore-scripts

      - name: Check schema contracts
        run: npm run check:schemas

      - name: Test schema documentation closure
        run: npm run test:schema-pages

      - name: Build schema documentation
        env:
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: npm run build:schema-pages

      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: .schema-pages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
