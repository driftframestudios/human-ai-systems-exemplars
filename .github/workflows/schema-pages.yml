name: Publish schema documentation

on:
  workflow_dispatch:
    inputs:
      source_revision:
        description: Accepted main source (full lowercase SHA)
        required: true
        type: string
      projection_revision:
        description: Reviewed docs projection (full lowercase SHA)
        required: true
        type: string
      release_tag:
        description: Annotated site release tag (pages-vMAJOR.MINOR.PATCH)
        required: true
        type: string
      activate_deployment:
        description: Publish the verified site release
        required: true
        default: false
        type: boolean

concurrency:
  group: schema-pages
  cancel-in-progress: false

jobs:
  publish:
    name: Verify and publish the reviewed site release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Bind accepted coordinates
        env:
          WORKFLOW_REF: ${{ github.ref }}
          SOURCE_REVISION: ${{ inputs.source_revision }}
          PROJECTION_REVISION: ${{ inputs.projection_revision }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          test "$WORKFLOW_REF" = refs/heads/main
          [[ "$SOURCE_REVISION" =~ ^[a-f0-9]{40}$ ]]
          [[ "$PROJECTION_REVISION" =~ ^[a-f0-9]{40}$ ]]
          [[ "$RELEASE_TAG" =~ ^pages-v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source_revision }}
          path: source
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.projection_revision }}
          path: projection
          persist-credentials: false
          fetch-depth: 0
      - name: Confirm accepted branch ancestry
        env:
          SOURCE_REVISION: ${{ inputs.source_revision }}
          PROJECTION_REVISION: ${{ inputs.projection_revision }}
        run: |
          test "$(git -C source rev-parse HEAD)" = "$SOURCE_REVISION"
          test "$(git -C projection rev-parse HEAD)" = "$PROJECTION_REVISION"
          git -C source merge-base --is-ancestor "$SOURCE_REVISION" origin/main
          git -C projection merge-base --is-ancestor "$PROJECTION_REVISION" origin/docs
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d
        id: pages
      - name: Load the workflow-owned release verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: release-tools
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: source/package-lock.json
      - name: Prepare locked dependencies
        working-directory: source
        run: npm ci --ignore-scripts
      - name: Confirm the configured public host
        working-directory: source
        env:
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          node --input-type=module -e 'import fs from "node:fs"; const host=fs.readFileSync("schemas/CNAME","utf8").trim(); const url=new URL(process.env.PAGES_BASE_URL); if(!/^[a-z0-9.-]+$/.test(host)||url.hostname!==host||url.protocol!=="https:") process.exit(1);'
      - name: Exercise schema and site contracts
        working-directory: source
        run: npm run check:schemas && npm run test:schema-pages
      - name: Build the tagged site
        working-directory: source
        env:
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
          PAGES_SOURCE_REVISION: ${{ inputs.source_revision }}
          PAGES_RELEASE_TAG: ${{ inputs.release_tag }}
        run: npm run build:schema-pages
      - name: Compare the exact reviewed artifact and tag
        working-directory: release-tools
        env:
          SOURCE_REVISION: ${{ inputs.source_revision }}
          PROJECTION_REVISION: ${{ inputs.projection_revision }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: >-
          node tools/verify-schema-pages-receiver.mjs --source-root ../source
          --source-revision "$SOURCE_REVISION" --source-branch origin/main
          --projection-root ../projection --projection-revision "$PROJECTION_REVISION"
          --projection-branch origin/docs --release-tag "$RELEASE_TAG"
      - name: Observe the selected public artifact
        working-directory: source
        run: |
          npm run security:secrets:install
          npm run security:secrets:canary
          npm run security:secrets:artifact -- .schema-pages
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        if: inputs.activate_deployment
        with:
          path: source/.schema-pages
          include-hidden-files: true
      - uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128
        if: inputs.activate_deployment
        id: deployment
