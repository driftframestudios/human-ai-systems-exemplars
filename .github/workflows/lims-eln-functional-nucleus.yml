name: LIMS and ELN functional nucleus proof

on:
  workflow_dispatch:
    inputs:
      proof:
        description: Choose the bounded evidence this run will produce
        required: true
        default: workbench
        type: choice
        options:
          - contracts
          - workbench
          - simulation
          - comparison
          - governance
          - full
      confirm_run:
        description: Confirm a human has allocated this remote proof
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: functional-nucleus-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nucleus-proof:
    if: ${{ vars.ENABLE_GITHUB_ACTIONS == 'true' && inputs.confirm_run }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: ""

      - name: Install the shared contract
        if: ${{ inputs.proof != 'governance' }}
        run: >-
          python -m pip install --disable-pip-version-check
          -e ./lims-eln-functional-nucleus/lims-eln-program-specification

      - name: Install workbench proof dependencies
        if: ${{ inputs.proof == 'workbench' || inputs.proof == 'full' }}
        run: >-
          python -m pip install --disable-pip-version-check
          -e './lims-eln-functional-nucleus/lims-eln-enterprise-implementation[test]'

      - name: Install comparison proof dependencies
        if: ${{ inputs.proof == 'comparison' || inputs.proof == 'full' }}
        run: >-
          python -m pip install --disable-pip-version-check
          -e './lims-eln-functional-nucleus/lims-eln-comparative-evidence[validation]'

      - name: Exercise the shared contract package
        if: ${{ inputs.proof == 'contracts' || inputs.proof == 'full' }}
        working-directory: lims-eln-functional-nucleus/lims-eln-program-specification
        run: |
          python scripts/validate_program.py
          PYTHONPATH=src python scripts/generate_contract_schemas.py --check
          PYTHONPATH=src python -m unittest discover -s tests -v

      - name: Exercise the enterprise workbench and domain services
        if: ${{ inputs.proof == 'workbench' || inputs.proof == 'full' }}
        working-directory: lims-eln-functional-nucleus/lims-eln-enterprise-implementation
        run: python scripts/validate_repository.py

      - name: Exercise the selected-future simulation
        if: ${{ inputs.proof == 'simulation' || inputs.proof == 'full' }}
        working-directory: lims-eln-functional-nucleus/lims-eln-simulated-final-state
        run: |
          PYTHONPATH=src python -m unittest discover -s tests -v
          python tools/check_contract_conformance.py --contract-source ../lims-eln-program-specification/src

      - name: Exercise comparative evidence
        if: ${{ inputs.proof == 'comparison' || inputs.proof == 'full' }}
        working-directory: lims-eln-functional-nucleus/lims-eln-comparative-evidence
        run: |
          PYTHONPATH=src python -m unittest discover -s tests -v
          python tools/check_contract_conformance.py --contract-source ../lims-eln-program-specification/src

      - name: Exercise governance contracts
        if: ${{ inputs.proof == 'governance' || inputs.proof == 'full' }}
        working-directory: lims-eln-functional-nucleus/site-reading-governance
        run: |
          python tools/validate_governance.py
          python tools/check_language.py
          python tools/scan_secret_shapes.py
          python -m unittest discover -s tests -v
