name: Production projection and carrier contracts

on:
  workflow_dispatch:
    inputs:
      production_tag:
        description: Annotated production-vMAJOR.MINOR.PATCH tag to package and verify
        required: true
        default: production-v0.2.0
        type: string
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    paths:
      - ".github/workflows/production-carrier-contracts.yml"
      - "package.json"
      - "package-lock.json"
      - "AUTHORS"
      - "LICENSE"
      - "attribution.yml"
      - "collaboration/**"
      - "core-architectures-chimeric-prototype-current-pack-v0.1/**"
      - "deployment/cpanel/**"
      - "deployment/public-references/**"
      - "context-canvas-project-surface/**"
      - "iframe-route-families/**"
      - "participatory-design-kit-chimeric-prototype-set-v0.1/**"
      - "schemas/**"
      - "tests/prod-deployment/**"
      - "tools/**"
      - "visualization-fidelity-atlas-bundle-v0.1/**"

permissions:
  contents: read

concurrency:
  group: production-carrier-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Projection, carrier, and transfer contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      # Pull requests retain the immutable v0.2 fixture. Manual dispatches
      # exercise the explicitly selected accepted production tag.
      PRODUCTION_TAG: ${{ inputs.production_tag || 'production-v0.2.0' }}

    steps:
      - name: Check out the candidate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Use the reviewed Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm

      - name: Install the locked root toolchain
        run: npm ci --ignore-scripts

      - name: Exercise production delivery contracts
        run: npm run test:prod-deployment

      - name: Form and independently inspect the selected carrier envelope
        run: |
          npm run build:prod-carrier-transfer -- --tag "$PRODUCTION_TAG"
          npm run verify:prod-carrier-transfer -- --tag "$PRODUCTION_TAG" --receipt ".cpanel-transfer/$PRODUCTION_TAG/hase-$PRODUCTION_TAG.receipt.json"
          unzip -t ".cpanel-transfer/$PRODUCTION_TAG/hase-$PRODUCTION_TAG.zip"
