name: Visual Fidelity source and browser contracts

on:
  workflow_dispatch:
    inputs:
      include_browser:
        description: Exercise the rendered contracts in Chromium, Firefox, and WebKit
        required: true
        default: true
        type: boolean
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    paths:
      - ".github/workflows/visual-fidelity-contracts.yml"
      - ".agents/skills/README.md"
      - ".agents/skills/publication-selection.json"
      - ".agents/skills/design-token-pipeline-stewardship/**"
      - "package.json"
      - "package-lock.json"
      - "attribution.yml"
      - "planning/README.md"
      - "planning/visual-fidelity-contracts/**"
      - "tests/suites/catalog.json"
      - "tests/suites/evidence-boundaries.md"
      - "tests/suites/planner.test.mjs"
      - "tools/attribution-contract.mjs"
      - "tools/build-visual-fidelity-pattern-library.mjs"
      - "tools/check-readme-routes.mjs"
      - "tools/core-architecture-browser-helper.mjs"
      - "tools/schema-publication.mjs"
      - "tools/schema-receiver-routes.mjs"
      - "tests/visual-fidelity-contracts/**"
      - "visual-fidelity-contracts/**"

permissions:
  contents: read

concurrency:
  group: visual-fidelity-contracts-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  source:
    name: Source and generated-artifact closure
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out the candidate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use the reviewed Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm

      - name: Install the locked root toolchain
        run: npm ci --ignore-scripts

      - name: Exercise source contracts and accepted generated bytes
        run: |
          npm run test:visual-fidelity-contracts:source
          npm run check:visual-fidelity-pattern-library
          npm run test:suites:unit
          npm run check:readme-routes

  browser:
    name: Chromium, Firefox, and WebKit behavior
    needs: source
    if: ${{ github.event_name == 'pull_request' || inputs.include_browser }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out the candidate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use the reviewed Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm

      - name: Install the locked root toolchain
        run: npm ci --ignore-scripts

      - name: Install the named browser engines
        run: npm exec -- playwright install --with-deps chromium firefox webkit

      - name: Exercise rendered behavior across the named engines
        run: npm run test:visual-fidelity-contracts:browser
