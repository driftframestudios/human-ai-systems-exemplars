name: LIMS and ELN enterprise reference proof

on:
  workflow_dispatch:
    inputs:
      proof:
        description: Choose the evidence this run will produce
        required: true
        default: offline
        type: choice
        options:
          - offline
          - database
          - full
      confirm_run:
        description: Confirm a human has allocated this remote proof
        required: true
        default: false
        type: boolean
      retain_database_receipt:
        description: Retain the database receipt for one day
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  offline-reference:
    name: Python ${{ matrix.python-version }} offline proof
    if: ${{ vars.ENABLE_GITHUB_ACTIONS == 'true' && inputs.confirm_run && (inputs.proof == 'offline' || inputs.proof == 'full') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.12"
          - "3.13"

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Validate the reference pack
        working-directory: lims-eln-enterprise-reference-v0.1
        env:
          PYTHONPATH: src
        run: |
          python -m pip install .
          python scripts/validate_pack.py

  database-rehearsal:
    name: PostgreSQL ${{ matrix.postgresql-major }} migration, contract, and security proof
    if: ${{ vars.ENABLE_GITHUB_ACTIONS == 'true' && inputs.confirm_run && (inputs.proof == 'database' || inputs.proof == 'full') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - postgresql-major: "16"
            postgresql-image: postgres:16-bookworm@sha256:92620daddcd947f8d5ab5ba66e848702fe443d87fed30c4cea8e389fd78dfc55
          - postgresql-major: "18"
            postgresql-image: postgres:18-bookworm@sha256:1961f96e6029a02c3812d7cb329a3b03a3ac2bb067058dec17b0f5596aca9296
    services:
      postgres:
        image: ${{ matrix.postgresql-image }}
        env:
          POSTGRES_PASSWORD: synthetic-ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Execute clean-install and upgrade rehearsal
        working-directory: lims-eln-enterprise-reference-v0.1
        env:
          LIMS_DB_HOST: 127.0.0.1
          LIMS_DB_PORT: "5432"
          LIMS_DB_ADMIN: postgres
          LIMS_DB_PASSWORD: synthetic-ci-only-password
          LIMS_DB_PREFIX: lims_reference_ci_pg${{ matrix.postgresql-major }}
          LIMS_DB_RECEIPT_DIR: ${{ runner.temp }}/lims-database-receipts-pg${{ matrix.postgresql-major }}
        run: ./scripts/run_database_rehearsal.sh

      - name: Retain database rehearsal receipt
        if: ${{ always() && inputs.retain_database_receipt }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lims-database-rehearsal-receipt-pg${{ matrix.postgresql-major }}
          path: ${{ runner.temp }}/lims-database-receipts-pg${{ matrix.postgresql-major }}/
          if-no-files-found: warn
          retention-days: 1
