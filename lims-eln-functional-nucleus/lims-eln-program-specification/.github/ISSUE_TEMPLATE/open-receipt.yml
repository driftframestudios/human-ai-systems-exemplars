name: Open receipt
description: Define the evidence event and accountable acceptance needed for promotion.
title: "RCP: "
labels:
  - open-receipt
body:
  - type: dropdown
    id: proof_class
    attributes:
      label: Proof class
      options:
        - configured_vendor_environments
        - representative_migration_and_restore
        - production_security_and_observability
        - scientific_quality_regulatory_acceptance
    validations:
      required: true
  - type: textarea
    id: success_event
    attributes:
      label: Success event
      description: Describe the evidence event that closes the selected evidence mode.
    validations:
      required: true
  - type: dropdown
    id: evidence_mode
    attributes:
      label: Evidence mode
      options:
        - simulated
        - observed
    validations:
      required: true
  - type: textarea
    id: paired_state
    attributes:
      label: Paired simulated and observed state
      description: Identify the simulated closure or observed successor and state the other branch explicitly.
    validations:
      required: true
  - type: textarea
    id: artifact_locators
    attributes:
      label: Evidence artifact locators and limitations
      description: List governed locators assumptions limitations and requalification triggers.
    validations:
      required: true
  - type: textarea
    id: accountable_roles
    attributes:
      label: Accountable roles
      description: Name role identifiers. For simulated closure, identify role-bound synthetic decisions and preserve advisory authority.
    validations:
      required: true
