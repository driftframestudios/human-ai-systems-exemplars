name: Decision
description: Record a bounded decision, alternatives, predictions, and falsifiers.
title: "DEC: "
labels:
  - decision
body:
  - type: textarea
    id: question
    attributes:
      label: Decision question
      description: State the question and the material effect it governs.
    validations:
      required: true
  - type: textarea
    id: desired_state
    attributes:
      label: Desired state
      description: Describe the stable and verifiable outcome.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and tradeoffs
    validations:
      required: true
  - type: textarea
    id: forecast
    attributes:
      label: Probability event, estimate, horizon, assumptions, and falsifiers
      description: State exactly what event the probability estimates and when it can be recalibrated.
    validations:
      required: true
