<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="920" viewBox="0 0 1600 920" role="img" aria-labelledby="rest-title rest-desc">
  <title id="rest-title">Resting Concepts return loop</title>
  <desc id="rest-desc">A seven-move loop removes a page from current use without deleting it. The author identifies no current use, records why it is parked, names an observable reactivation condition, moves it to Resting Concepts, waits for the trigger, moves it back, and updates the register. The source register is empty and retains only Page, Parked because, and Reactivate when.</desc>
  <defs><pattern id="rest-grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#cfe7f7" stroke-opacity=".42"/><circle cx="0" cy="0" r="1.4" fill="#f1b88e" fill-opacity=".26"/></pattern><filter id="rest-shadow" x="-14%" y="-20%" width="128%" height="150%"><feDropShadow dx="0" dy="7" stdDeviation="6" flood-color="#071a35" flood-opacity=".28"/></filter><style>.sans{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.mono{font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace}.eyebrow{font-size:14px;font-weight:800;letter-spacing:1.8px}.title{font-size:39px;font-weight:820;letter-spacing:-.8px}.lead{font-size:17px;font-weight:620}.lane{font-size:15px;font-weight:850;letter-spacing:1.2px}.kicker{font-size:12px;font-weight:850;letter-spacing:1px}.card{font-size:15px;font-weight:760}.copy{font-size:14px;font-weight:620}.ink{fill:#17345f}.body{fill:#304a71}.white{fill:#fffdf8}.muted{fill:#5d6f8b}</style></defs>
  <rect width="1600" height="920" fill="#fffaf2"/><rect x="28" y="28" width="1544" height="864" rx="28" fill="#17345f"/><rect x="20" y="20" width="1544" height="864" rx="28" fill="#fffdf8" stroke="#17345f" stroke-width="2"/><rect x="21" y="21" width="1542" height="862" rx="27" fill="url(#rest-grid)"/>
  <path d="M20 48Q20 20 48 20H1536Q1564 20 1564 48V176H20Z" fill="#2855f3"/><text x="56" y="57" class="mono eyebrow white">RESTING CONCEPTS · RECOVERABLE RETURN</text><text x="56" y="105" class="sans title white">Keep inactive context recoverable without crowding current work</text><text x="56" y="141" class="sans lead white">A reason and observable return condition travel with every resting page.</text>
  <rect x="1224" y="51" width="290" height="84" rx="14" fill="#fffdf8" stroke="#17345f" stroke-width="2"/><text x="1247" y="81" class="mono kicker ink">BOUNDARY</text><text x="1247" y="107" class="sans copy body">Neither deletion nor</text><text x="1247" y="127" class="sans copy body">permanent archive</text>
  <g id="return-loop" role="group" aria-labelledby="return-title"><title id="return-title">Seven-move resting and return loop</title><text x="56" y="218" class="mono lane ink">RETURN LOOP · PARK WITH A REASON, RESUME ON A TRIGGER</text>
    <path d="M340 309C470 209 654 209 772 301" fill="none" stroke="#2855f3" stroke-width="7"/><path d="M764 287L790 314L755 312Z" fill="#2855f3"/>
    <path d="M1020 309C1150 209 1334 209 1418 312" fill="none" stroke="#2855f3" stroke-width="7"/><path d="M1406 300L1436 328L1397 321Z" fill="#2855f3"/>
    <path d="M1438 422C1382 540 1202 560 1098 490" fill="none" stroke="#2855f3" stroke-width="7"/><path d="M1110 477L1076 476L1094 506Z" fill="#2855f3"/>
    <path d="M832 482C702 566 500 548 430 460" fill="none" stroke="#2855f3" stroke-width="7"/><path d="M442 448L408 440L424 472Z" fill="#2855f3"/>
    <g filter="url(#rest-shadow)">
      <rect x="56" y="282" width="292" height="142" rx="15" fill="#d9efea" stroke="#17345f" stroke-width="2"/><circle cx="83" cy="310" r="15" fill="#17345f"/><text x="83" y="315" text-anchor="middle" class="mono kicker white">1</text><text x="110" y="314" class="sans card ink">Identify no current use</text><text x="82" y="354" class="sans copy body"><tspan x="82">Name the active area or decision</tspan><tspan x="82" dy="22">that no longer needs this page.</tspan></text>
      <rect x="488" y="220" width="292" height="142" rx="15" fill="#cfe7f7" stroke="#17345f" stroke-width="2"/><circle cx="515" cy="248" r="15" fill="#17345f"/><text x="515" y="253" text-anchor="middle" class="mono kicker white">2</text><text x="542" y="252" class="sans card ink">Record parked because</text><text x="514" y="292" class="sans copy body"><tspan x="514">Preserve the reason so future</tspan><tspan x="514" dy="22">readers do not reconstruct it.</tspan></text>
      <rect x="794" y="282" width="292" height="142" rx="15" fill="#e7efff" stroke="#17345f" stroke-width="2"/><circle cx="821" cy="310" r="15" fill="#17345f"/><text x="821" y="315" text-anchor="middle" class="mono kicker white">3</text><text x="848" y="314" class="sans card ink">Name reactivate when</text><text x="820" y="354" class="sans copy body"><tspan x="820">Use an observable event, decision,</tspan><tspan x="820" dy="22">dependency, or changed condition.</tspan></text>
      <rect x="1220" y="282" width="292" height="142" rx="15" fill="#fff5de" stroke="#17345f" stroke-width="2"/><circle cx="1247" cy="310" r="15" fill="#17345f"/><text x="1247" y="315" text-anchor="middle" class="mono kicker white">4</text><text x="1274" y="314" class="sans card ink">Move here</text><text x="1246" y="354" class="sans copy body"><tspan x="1246">Remove the page from current work</tspan><tspan x="1246" dy="22">while retaining findability.</tspan></text>
      <rect x="1154" y="468" width="292" height="142" rx="15" fill="#ffd3d0" stroke="#17345f" stroke-width="2"/><circle cx="1181" cy="496" r="15" fill="#17345f"/><text x="1181" y="501" text-anchor="middle" class="mono kicker white">5</text><text x="1208" y="500" class="sans card ink">Trigger occurs</text><text x="1180" y="540" class="sans copy body"><tspan x="1180">The named return condition becomes</tspan><tspan x="1180" dy="22">true; stewardship resumes.</tspan></text>
      <rect x="730" y="468" width="292" height="142" rx="15" fill="#f2ff67" stroke="#17345f" stroke-width="2"/><circle cx="757" cy="496" r="15" fill="#17345f"/><text x="757" y="501" text-anchor="middle" class="mono kicker white">6</text><text x="784" y="500" class="sans card ink">Move back</text><text x="756" y="540" class="sans copy body"><tspan x="756">Return the page to an active home</tspan><tspan x="756" dy="22">with its context intact.</tspan></text>
      <rect x="306" y="468" width="292" height="142" rx="15" fill="#fffdf8" stroke="#17345f" stroke-width="2"/><circle cx="333" cy="496" r="15" fill="#17345f"/><text x="333" y="501" text-anchor="middle" class="mono kicker white">7</text><text x="360" y="500" class="sans card ink">Update register</text><text x="332" y="540" class="sans copy body"><tspan x="332">Record the move and the active</tspan><tspan x="332" dy="22">receiving context.</tspan></text>
    </g>
  </g>
  <g id="rest-register" role="group" aria-labelledby="rest-register-title"><title id="rest-register-title">Empty resting concepts register</title>
    <rect x="56" y="668" width="1480" height="178" rx="18" fill="#17345f"/><text x="82" y="706" class="mono lane" fill="#f2ff67">SOURCE REGISTER · CURRENT SNAPSHOT</text><rect x="82" y="730" width="1428" height="44" rx="9" fill="#cfe7f7"/><text x="112" y="758" class="mono kicker ink">PAGE</text><text x="606" y="758" class="mono kicker ink">PARKED BECAUSE</text><text x="1110" y="758" class="mono kicker ink">REACTIVATE WHEN</text><rect x="82" y="782" width="1428" height="42" rx="9" fill="#fffdf8"/><text x="796" y="809" text-anchor="middle" class="sans card muted">(none yet)</text>
  </g>
</svg>
