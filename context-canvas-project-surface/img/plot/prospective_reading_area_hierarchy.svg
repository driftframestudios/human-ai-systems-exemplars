<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100" role="img" aria-labelledby="plan-title plan-desc">
  <title id="plan-title">Prospective Site Reading area decision hierarchy</title>
  <desc id="plan-desc">A decision hierarchy starts with an orientation index, adds durable shared scaffolds, and then supplies a legibility contract and documented reading anatomy. Beneath it, the area hierarchy moves from the Prospective Site Readings root to four landmarks, then to each reading root and ordinary one-layer supporting pages, with deeper structures allowed only as manifest-declared legacy exceptions. Eight capabilities describe what the area buys.</desc>
  <defs><pattern id="plan-grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#cfe7f7" stroke-opacity=".42"/><circle cx="0" cy="0" r="1.4" fill="#f1b88e" fill-opacity=".26"/></pattern><filter id="plan-shadow" x="-14%" y="-20%" width="128%" height="150%"><feDropShadow dx="0" dy="7" stdDeviation="6" flood-color="#071a35" flood-opacity=".28"/></filter><style>.sans{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.mono{font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace}.eyebrow{font-size:14px;font-weight:800;letter-spacing:1.8px}.title{font-size:39px;font-weight:820;letter-spacing:-.8px}.lead{font-size:17px;font-weight:620}.lane{font-size:15px;font-weight:850;letter-spacing:1.2px}.kicker{font-size:12px;font-weight:850;letter-spacing:1px}.card{font-size:15px;font-weight:760}.copy{font-size:14px;font-weight:620}.micro{font-size:12px;font-weight:680}.ink{fill:#17345f}.body{fill:#304a71}.white{fill:#fffdf8}.muted{fill:#5d6f8b}</style></defs>
  <rect width="1600" height="1100" fill="#fffaf2"/><rect x="28" y="28" width="1544" height="1044" rx="28" fill="#17345f"/><rect x="20" y="20" width="1544" height="1044" rx="28" fill="#fffdf8" stroke="#17345f" stroke-width="2"/><rect x="21" y="21" width="1542" height="1042" rx="27" fill="url(#plan-grid)"/>
  <path d="M20 48Q20 20 48 20H1536Q1564 20 1564 48V176H20Z" fill="#2855f3"/><text x="56" y="57" class="mono eyebrow white">PLANS FOR PROSPECTIVE SITE READING AREA · DECISION HIERARCHY</text><text x="56" y="105" class="sans title white">Make the area navigable before the first exemplar lands</text><text x="56" y="141" class="sans lead white">A reusable planning artifact for orientation, scaffolding, legibility, verified handoff, and accountable delivery ownership.</text>
  <rect x="1264" y="50" width="250" height="84" rx="14" fill="#fffdf8" stroke="#17345f" stroke-width="2"/><text x="1286" y="80" class="mono kicker ink">GOVERNING ROOT</text><text x="1286" y="106" class="sans copy body">Prospective Site</text><text x="1286" y="126" class="sans copy body">Readings · v0.3.0</text>
  <g id="decision-hierarchy" role="group" aria-labelledby="decision-title"><title id="decision-title">Decision hierarchy</title><text x="56" y="220" class="mono lane ink">DECISION HIERARCHY · BUY ORIENTATION BEFORE COMPLEXITY</text>
    <g filter="url(#plan-shadow)"><rect x="56" y="246" width="420" height="132" rx="15" fill="#d9efea" stroke="#17345f" stroke-width="2"/><circle cx="84" cy="274" r="15" fill="#17345f"/><text x="84" y="279" text-anchor="middle" class="mono kicker white">1</text><text x="112" y="278" class="sans card ink">Orientation index</text><text x="82" y="318" class="sans copy body"><tspan x="82">Exact titles make the area findable;</tspan><tspan x="82" dy="22">UUID and manifest preserve identity.</tspan></text><path d="M484 295H506V283L534 312L506 341V329H484Z" fill="#2855f3"/>
    <rect x="542" y="246" width="420" height="132" rx="15" fill="#cfe7f7" stroke="#17345f" stroke-width="2"/><circle cx="570" cy="274" r="15" fill="#17345f"/><text x="570" y="279" text-anchor="middle" class="mono kicker white">2</text><text x="598" y="278" class="sans card ink">Durable shared scaffolds</text><text x="568" y="318" class="sans copy body"><tspan x="568">Stage unsettled work, rest it recoverably,</tspan><tspan x="568" dy="22">route visuals, and preserve decisions.</tspan></text><path d="M970 295H992V283L1020 312L992 341V329H970Z" fill="#2855f3"/>
    <rect x="1028" y="246" width="508" height="132" rx="15" fill="#fff5de" stroke="#17345f" stroke-width="2"/><circle cx="1056" cy="274" r="15" fill="#17345f"/><text x="1056" y="279" text-anchor="middle" class="mono kicker white">3</text><text x="1084" y="278" class="sans card ink">Legibility contract + documented anatomy</text><text x="1054" y="318" class="sans copy body"><tspan x="1054">Package complete readings with source, structure,</tspan><tspan x="1054" dy="22">accessible visuals, verification, and handoff intact.</tspan></text></g>
  </g>
  <g id="area-hierarchy" role="group" aria-labelledby="area-title"><title id="area-title">Area hierarchy</title><text x="56" y="433" class="mono lane ink">AREA HIERARCHY · ONE ORDINARY SUPPORT LAYER, DECLARED EXCEPTIONS</text>
    <path d="M796 512V536" stroke="#2855f3" stroke-width="6"/><path d="M796 552L783 530H809Z" fill="#2855f3"/>
    <path d="M796 614V638" stroke="#2855f3" stroke-width="6"/><path d="M796 654L783 632H809Z" fill="#2855f3"/>
    <path d="M796 716V740" stroke="#2855f3" stroke-width="6"/><path d="M796 756L783 734H809Z" fill="#2855f3"/>
    <g filter="url(#plan-shadow)"><rect x="544" y="459" width="504" height="62" rx="14" fill="#17345f"/><text x="796" y="497" text-anchor="middle" class="sans card white">Prospective Site Readings root · governing orientation</text>
    <rect x="74" y="555" width="338" height="70" rx="14" fill="#d9efea" stroke="#17345f" stroke-width="2"/><text x="243" y="586" text-anchor="middle" class="sans card ink">Concept Nursery</text><text x="243" y="607" text-anchor="middle" class="mono micro body">STAGE</text>
    <rect x="448" y="555" width="338" height="70" rx="14" fill="#cfe7f7" stroke="#17345f" stroke-width="2"/><text x="617" y="586" text-anchor="middle" class="sans card ink">Resting Concepts</text><text x="617" y="607" text-anchor="middle" class="mono micro body">REST + RETURN</text>
    <rect x="822" y="555" width="338" height="70" rx="14" fill="#fff5de" stroke="#17345f" stroke-width="2"/><text x="991" y="586" text-anchor="middle" class="sans card ink">Visual Fidelity Atlas</text><text x="991" y="607" text-anchor="middle" class="mono micro body">SELECT + BRIEF</text>
    <rect x="1196" y="555" width="338" height="70" rx="14" fill="#ffd3d0" stroke="#17345f" stroke-width="2"/><text x="1365" y="586" text-anchor="middle" class="sans card ink">Collaboration Cycle</text><text x="1365" y="607" text-anchor="middle" class="mono micro body">RECORD + PROPAGATE</text>
    <rect x="514" y="655" width="564" height="66" rx="14" fill="#f2ff67" stroke="#17345f" stroke-width="2"/><text x="796" y="686" text-anchor="middle" class="sans card ink">Reading root · complete prospective reading package</text><text x="796" y="707" text-anchor="middle" class="mono micro body">SOURCE · ANATOMY · ARTIFACTS · ACCEPTANCE</text>
    <rect x="292" y="757" width="542" height="72" rx="14" fill="#e7efff" stroke="#17345f" stroke-width="2"/><text x="563" y="789" text-anchor="middle" class="sans card ink">Ordinary one-layer supporting pages</text><text x="563" y="811" text-anchor="middle" class="sans micro body">heavy beats · appendices · evidence companions</text>
    <rect x="872" y="757" width="542" height="72" rx="14" fill="#fffdf8" stroke="#17345f" stroke-width="2" stroke-dasharray="10 8"/><text x="1143" y="789" text-anchor="middle" class="sans card ink">Manifest-declared legacy exceptions</text><text x="1143" y="811" text-anchor="middle" class="sans micro body">deeper structure only when identity and need are explicit</text></g>
  </g>
  <g id="abilities" role="group" aria-labelledby="abilities-title"><title id="abilities-title">Eight abilities purchased by the planning surface</title><rect x="56" y="872" width="1480" height="158" rx="18" fill="#17345f"/><text x="82" y="909" class="mono lane" fill="#f2ff67">ABILITIES PURCHASED</text><g class="sans copy ink"><rect x="82" y="932" width="340" height="36" rx="10" fill="#d9efea"/><text x="99" y="956">Navigate without a database</text><rect x="438" y="932" width="340" height="36" rx="10" fill="#cfe7f7"/><text x="455" y="956">Resolve exact-title identity</text><rect x="794" y="932" width="340" height="36" rx="10" fill="#fff5de"/><text x="811" y="956">Stage unsettled work</text><rect x="1150" y="932" width="360" height="36" rx="10" fill="#ffd3d0"/><text x="1167" y="956">Rest context recoverably</text><rect x="82" y="980" width="340" height="36" rx="10" fill="#cfe7f7"/><text x="99" y="1004">Select and brief visuals</text><rect x="438" y="980" width="340" height="36" rx="10" fill="#fff5de"/><text x="455" y="1004">Record + propagate decisions</text><rect x="794" y="980" width="340" height="36" rx="10" fill="#ffd3d0"/><text x="811" y="1004">Package a complete reading</text><rect x="1150" y="980" width="360" height="36" rx="10" fill="#f2ff67"/><text x="1167" y="1004">Verify anatomy + accessibility</text></g></g>
</svg>
