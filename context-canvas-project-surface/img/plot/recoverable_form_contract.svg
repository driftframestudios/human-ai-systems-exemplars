<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040" role="img" aria-labelledby="form-title form-desc">
  <title id="form-title">The recoverable form contract</title>
  <desc id="form-desc">A person's purpose moves through semantic HTML, understandable interaction state, typed validation and recovery, a replay-safe service command, a governed domain or provider boundary, and a durable receipt. Support and return reconnect the receipt with the person while shared issue and operation identities keep browser, service, provider, and support routes coherent.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#2855f3" stroke-opacity=".055"/></pattern>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#2855f3"/></marker>
    <marker id="return" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#fa7065"/></marker>
  </defs>
  <style>
    .field{fill:#fffaf2}.grid{fill:url(#grid)}.frame{fill:none;stroke:#17345f;stroke-width:2}.header{fill:#2855f3}.panel{fill:#fffdf8;stroke:#17345f;stroke-width:2}.shadow{fill:#17345f}.powder{fill:#cfe7f7}.sea{fill:#d9efea}.cream{fill:#fff5de}.pale{fill:#e7efff}.blush{fill:#ffd3d0}.acid{fill:#f2ff67}.cobalt{fill:#2855f3}
    .title{fill:#fffdf8;font:750 37px system-ui,sans-serif}.subtitle{fill:#e7efff;font:500 16px system-ui,sans-serif}.eyebrow-on{fill:#f2ff67;font:750 12px ui-monospace,monospace;letter-spacing:1.4px}.eyebrow{fill:#5d6f8b;font:750 12px ui-monospace,monospace;letter-spacing:1.1px}.section{fill:#17345f;font:750 19px system-ui,sans-serif}.body{fill:#304a71;font:500 13.5px system-ui,sans-serif}.strong{fill:#17345f;font:700 13.5px system-ui,sans-serif}.mono{fill:#304a71;font:650 11.5px ui-monospace,monospace}.mono-on{fill:#fffdf8;font:700 11.5px ui-monospace,monospace;letter-spacing:.4px}.flow{fill:none;stroke:#2855f3;stroke-width:5;marker-end:url(#arrow)}.return-flow{fill:none;stroke:#fa7065;stroke-width:4;stroke-dasharray:11 9;marker-end:url(#return)}.rail{stroke:#7893bc;stroke-width:2}
  </style>
  <rect class="field" width="1600" height="1040"/><rect class="grid" x="20" y="20" width="1560" height="1000" rx="28"/><rect class="frame" x="20" y="20" width="1560" height="1000" rx="28"/>
  <g role="group" aria-labelledby="heading"><title id="heading">Diagram heading</title><path class="header" d="M20 48a28 28 0 0 1 28-28h1504a28 28 0 0 1 28 28v124H20Z"/><text class="eyebrow-on" x="54" y="60">SEMANTICS · AUTHORITY · RECOVERY</text><text class="title" x="54" y="108">The form is a contract that can carry a person back into the work</text><text class="subtitle" x="54" y="141">Meaning and recovery travel together through browser, service, provider, receipt, and support.</text></g>
  <g role="group" aria-labelledby="purpose"><title id="purpose">Person's purpose</title><rect class="shadow" x="62" y="232" width="198" height="246" rx="18"/><rect class="panel cream" x="54" y="224" width="198" height="246" rx="18"/><text class="eyebrow" x="76" y="258">01 · PURPOSE</text><text class="section" x="76" y="296">Person’s intent</text><text class="body" x="76" y="332">Apply · pay · consent</text><text class="body" x="76" y="356">Create · correct · resume</text><line class="rail" x1="76" y1="382" x2="230" y2="382"/><text class="strong" x="76" y="414">Understand the request,</text><text class="strong" x="76" y="436">result, and available help.</text></g>
  <path class="flow" d="M270 346H308" aria-hidden="true"/>
  <g role="group" aria-labelledby="html"><title id="html">Semantic HTML</title><rect class="shadow" x="334" y="232" width="198" height="246" rx="18"/><rect class="panel powder" x="326" y="224" width="198" height="246" rx="18"/><text class="eyebrow" x="348" y="258">02 · MEANING</text><text class="section" x="348" y="296">Semantic HTML</text><text class="body" x="348" y="332">Label · group · hint</text><text class="body" x="348" y="356">Purpose · form ownership</text><line class="rail" x1="348" y1="382" x2="502" y2="382"/><text class="strong" x="348" y="414">Browser-readable names,</text><text class="strong" x="348" y="436">relationships, and data.</text></g>
  <path class="flow" d="M542 346H580" aria-hidden="true"/>
  <g role="group" aria-labelledby="state"><title id="state">Understandable interaction state</title><rect class="shadow" x="606" y="232" width="198" height="246" rx="18"/><rect class="panel sea" x="598" y="224" width="198" height="246" rx="18"/><text class="eyebrow" x="620" y="258">03 · STATE</text><text class="section" x="620" y="296">Understandable</text><text class="section" x="620" y="320">interaction state</text><text class="body" x="620" y="352">Entered · locally ready</text><text class="body" x="620" y="376">Saved · submitted · returned</text><line class="rail" x1="620" y1="398" x2="774" y2="398"/><text class="strong" x="620" y="430">Valid work remains</text><text class="strong" x="620" y="452">available for correction.</text></g>
  <path class="flow" d="M814 346H852" aria-hidden="true"/>
  <g role="group" aria-labelledby="recovery"><title id="recovery">Typed validation and recovery</title><rect class="shadow" x="878" y="232" width="198" height="246" rx="18"/><rect class="panel pale" x="870" y="224" width="198" height="246" rx="18"/><text class="eyebrow" x="892" y="258">04 · RECOVERY</text><text class="section" x="892" y="296">Typed validation</text><text class="section" x="892" y="320">and recovery</text><text class="body" x="892" y="352">Issue identity · source</text><text class="body" x="892" y="376">Summary · inline · focus</text><line class="rail" x1="892" y1="398" x2="1046" y2="398"/><text class="strong" x="892" y="430">One issue travels into</text><text class="strong" x="892" y="452">service and support.</text></g>
  <path class="flow" d="M1086 346H1124" aria-hidden="true"/>
  <g role="group" aria-labelledby="command"><title id="command">Replay-safe service command</title><rect class="shadow" x="1150" y="232" width="198" height="246" rx="18"/><rect class="panel acid" x="1142" y="224" width="198" height="246" rx="18"/><text class="eyebrow" x="1164" y="258">05 · AUTHORITY</text><text class="section" x="1164" y="296">Replay-safe</text><text class="section" x="1164" y="320">service command</text><text class="body" x="1164" y="352">Actor · intent · schema</text><text class="body" x="1164" y="376">Idempotency · resource</text><line class="rail" x1="1164" y1="398" x2="1318" y2="398"/><text class="strong" x="1164" y="430">The service establishes</text><text class="strong" x="1164" y="452">the authoritative result.</text></g>
  <path class="flow" d="M1358 346H1396" aria-hidden="true"/>
  <g role="group" aria-labelledby="provider"><title id="provider">Governed domain or provider boundary</title><rect class="shadow" x="1422" y="232" width="124" height="246" rx="18"/><rect class="panel blush" x="1414" y="224" width="124" height="246" rx="18"/><text class="eyebrow" x="1432" y="258">06</text><text class="section" x="1432" y="294">Domain</text><text class="section" x="1432" y="318">or provider</text><text class="body" x="1432" y="352">Auth</text><text class="body" x="1432" y="376">Payment</text><text class="body" x="1432" y="400">Policy</text><text class="body" x="1432" y="424">Verification</text><text class="body" x="1432" y="448">Reconcile</text></g>
  <g role="group" aria-labelledby="identity"><title id="identity">Shared identities</title><rect class="cobalt" x="54" y="526" width="1484" height="94" rx="16"/><text class="mono-on" x="80" y="560">SHARED IDENTITIES</text><text class="title" x="80" y="596" style="font-size:24px">Field, issue, operation, resource, and receipt references keep every channel on the same account.</text></g>
  <g role="group" aria-labelledby="outcomes"><title id="outcomes">Authoritative outcomes and continuations</title><text class="eyebrow" x="54" y="674">AUTHORITATIVE OUTCOME + CONTINUATION</text>
    <rect class="panel sea" x="54" y="694" width="276" height="152" rx="14"/><text class="eyebrow" x="76" y="726">ACCEPTED</text><text class="strong" x="76" y="756">Committed operation</text><text class="body" x="76" y="784">Present a durable receipt</text><text class="body" x="76" y="806">and useful next step.</text>
    <rect class="panel powder" x="350" y="694" width="276" height="152" rx="14"/><text class="eyebrow" x="372" y="726">UNDER REVIEW</text><text class="strong" x="372" y="756">Open institutional decision</text><text class="body" x="372" y="784">Present status, owner, and</text><text class="body" x="372" y="806">review continuation.</text>
    <rect class="panel cream" x="646" y="694" width="276" height="152" rx="14"/><text class="eyebrow" x="668" y="726">REJECTED</text><text class="strong" x="668" y="756">Authoritative rule declined</text><text class="body" x="668" y="784">Explain correction, another</text><text class="body" x="668" y="806">channel, or appeal.</text>
    <rect class="panel blush" x="942" y="694" width="276" height="152" rx="14"/><text class="eyebrow" x="964" y="726">UNRESOLVED</text><text class="strong" x="964" y="756">Response remains open</text><text class="body" x="964" y="784">Retrieve by operation identity</text><text class="body" x="964" y="806">and reconcile deliberately.</text>
    <rect class="panel acid" x="1238" y="694" width="300" height="152" rx="14"/><text class="eyebrow" x="1260" y="726">STALE</text><text class="strong" x="1260" y="756">Resource or policy advanced</text><text class="body" x="1260" y="784">Show the difference and support</text><text class="body" x="1260" y="806">deliberate resubmission.</text>
  </g>
  <g role="group" aria-labelledby="receipt"><title id="receipt">Durable receipt and support return</title><path class="return-flow" d="M1426 870C1280 978 330 978 164 870" aria-hidden="true"/><rect class="panel" x="402" y="874" width="796" height="100" rx="16"/><text class="eyebrow" x="430" y="906">DURABLE RECEIPT · SUPPORT · RETURN</text><text class="section" x="430" y="940">The person and support team locate the same operation and continue within granted authority.</text></g>
  <text class="mono" x="54" y="1002">REFERENCE ARCHITECTURE · target browser, assistive-technology, service, provider, security, and participant evidence establish readiness</text>
</svg>
