<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="operating-surface-title operating-surface-desc">
  <title id="operating-surface-title">Operational state becomes a shared product capability</title>
  <desc id="operating-surface-desc">Morning SQL, human queues used as status, and the macro-based Failure Tracker feed five related implementation moves. Profile-scoped dashboards and reports, modeled state and qualification rules, service-layer current-state updates, structured transmission fields, and genomic-viewer note types combine into shared operating surfaces. A concrete React, Java, PostgreSQL, outbox, and Amazon SQS path carries current state and recoverable events. The final band names changed work, investment, and the two separately reported starting burdens.</desc>

  <defs>
    <clipPath id="operating-frame-clip">
      <rect x="18" y="18" width="1564" height="1084" rx="28"/>
    </clipPath>
    <pattern id="operating-speckle" width="38" height="38" patternUnits="userSpaceOnUse">
      <circle cx="7" cy="10" r="1" fill="#17345f" opacity=".11"/>
      <circle cx="30" cy="27" r=".8" fill="#2855f3" opacity=".09"/>
    </pattern>
    <pattern id="operating-grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#2855f3" stroke-width="1" opacity=".09"/>
    </pattern>
    <style>
      .paper{fill:#fffaf2}.speckle{fill:url(#operating-speckle)}.grid{fill:url(#operating-grid)}
      .frame{fill:none;stroke:#17345f;stroke-width:3}.outline{stroke:#17345f;stroke-width:2;fill:#fffdf8}
      .shadow{fill:#17345f}.cobalt{fill:#2855f3}.cobalt-dark{fill:#153fbe}.cobalt-pale{fill:#e7efff}
      .cream{fill:#fff5de}.powder{fill:#cfe7f7}.salmon{fill:#ffd3d0}.acid{fill:#f2ff67}
      .sea{fill:#d9efea}.coral{fill:#fa7065}.white{fill:#fffdf8}.ink{fill:#17345f}
      .rule{stroke:#17345f;stroke-width:2}.hairline{stroke:#7893bc;stroke-width:1.2}
      .arrow-cobalt{fill:#2855f3}.arrow-coral{fill:#fa7065}.arrow-sea{fill:#4b918b}
      .eyebrow{font:700 13px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:1.45px;fill:#405574}
      .eyebrow-on{font:700 13px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:1.45px;fill:#e8efff}
      .title{font:780 36px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#fffdf8}
      .subtitle{font:520 17px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#e8efff}
      .section{font:760 15px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:1.1px;fill:#17345f}
      .card-title{font:760 19px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#17345f}
      .card-copy{font:520 14px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#304a71}
      .body{font:520 14px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#304a71}
      .body-strong{font:680 14px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#17345f}
      .body-on{font:580 14px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#fffdf8}
      .micro{font:700 11px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.7px;fill:#405574}
      .micro-on{font:700 11px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.7px;fill:#e8efff}
      .band-title{font:760 17px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#17345f}
      .band-copy{font:520 13px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#304a71}
    </style>
  </defs>

  <g clip-path="url(#operating-frame-clip)">
    <rect class="paper" x="18" y="18" width="1564" height="1084"/>
    <rect class="speckle" x="18" y="18" width="1564" height="1084"/>
    <rect class="cobalt" x="18" y="18" width="1564" height="142"/>
    <rect class="grid" x="18" y="18" width="1564" height="142"/>
  </g>
  <rect class="frame" x="18" y="18" width="1564" height="1084" rx="28"/>

  <g role="group" aria-labelledby="operating-heading">
    <title id="operating-heading">Operational field heading</title>
    <text class="eyebrow-on" x="54" y="54">GENOMIC VIEWER · OPERATING STATE</text>
    <text class="title" x="54" y="98">Operational state becomes a shared product capability</text>
    <text class="subtitle" x="54" y="128">Recurring reconstruction → explicit state → useful surfaces → recoverable movement</text>
    <rect class="acid" x="1268" y="48" width="260" height="34" rx="7"/>
    <text class="body-strong" x="1288" y="70">CURRENT STATE AT POINT OF USE</text>
    <rect class="salmon" x="1268" y="91" width="260" height="27" rx="6"/>
    <text class="micro" x="1288" y="109">STATE FIRST · THEN EVENTS</text>
  </g>

  <text class="section" x="54" y="194">RECONSTRUCTED OPERATING STATE</text>
  <text class="section" x="436" y="194">COLLECTIVE IMPLEMENTATION MOVES</text>
  <text class="section" x="1168" y="194">SHARED SYSTEM SURFACES</text>

  <g id="source-to-moves" aria-hidden="true">
    <path class="arrow-cobalt" d="M374 274C405 274 420 302 444 302V293L460 305L444 317V308C416 308 403 280 374 280Z"/>
    <path class="arrow-sea" d="M374 424C406 424 420 388 444 388V379L460 385L444 397V394C415 394 404 430 374 430Z"/>
    <path class="arrow-coral" d="M374 564C412 558 417 468 444 468V459L460 465L444 477V474C411 474 409 570 374 570Z"/>
    <path class="arrow-coral" d="M374 575C407 575 420 542 444 542V533L460 545L444 557V548C415 548 405 581 374 581Z"/>
    <path class="arrow-coral" d="M374 586C411 591 418 622 444 622V613L460 625L444 637V628C414 628 405 597 374 592Z"/>
  </g>

  <g role="group" aria-labelledby="reconstructed-state-title">
    <title id="reconstructed-state-title">Three reconstructed forms of operating state</title>

    <rect class="shadow" x="62" y="223" width="312" height="125" rx="14"/>
    <rect class="outline cream" x="54" y="215" width="312" height="125" rx="14"/>
    <rect class="cobalt-dark" x="72" y="233" width="90" height="24" rx="5"/>
    <text class="micro-on" x="85" y="250">RITUAL 01</text>
    <text class="card-title" x="72" y="286">Morning SQL</text>
    <text class="card-copy" x="72" y="311">
      <tspan x="72">Plate-gender discordance, stuck samples,</tspan>
      <tspan x="72" dy="19">and control issues reconstructed each day.</tspan>
    </text>

    <rect class="shadow" x="62" y="373" width="312" height="125" rx="14"/>
    <rect class="outline powder" x="54" y="365" width="312" height="125" rx="14"/>
    <rect class="cobalt-dark" x="72" y="383" width="90" height="24" rx="5"/>
    <text class="micro-on" x="85" y="400">RITUAL 02</text>
    <text class="card-title" x="72" y="436">Human queues as status</text>
    <text class="card-copy" x="72" y="461">
      <tspan x="72">“On hold” and “Investigating” borrowed</tspan>
      <tspan x="72" dy="19">human ownership to represent case state.</tspan>
    </text>

    <rect class="shadow" x="62" y="523" width="312" height="125" rx="14"/>
    <rect class="outline salmon" x="54" y="515" width="312" height="125" rx="14"/>
    <rect class="cobalt-dark" x="72" y="533" width="90" height="24" rx="5"/>
    <text class="micro-on" x="85" y="550">RITUAL 03</text>
    <text class="card-title" x="72" y="586">Failure Tracker</text>
    <text class="card-copy" x="72" y="611">
      <tspan x="72">Macro spreadsheet · dozens of columns ·</tspan>
      <tspan x="72" dy="19">team-by-team status edits.</tspan>
    </text>
  </g>

  <g role="group" aria-labelledby="implementation-field-title">
    <title id="implementation-field-title">Five implementation moves that collectively form the operating surface</title>
    <rect class="shadow" x="444" y="215" width="620" height="463" rx="17"/>
    <rect class="outline sea" x="436" y="207" width="620" height="463" rx="17"/>
    <rect class="acid" x="438" y="209" width="616" height="45" rx="15"/>
    <text class="micro" x="460" y="237">ONE OPERATING CONTRACT · FIVE RECEIVING COMPONENT FAMILIES</text>

    <rect class="outline cream" x="460" y="270" width="572" height="70" rx="10"/>
    <text class="micro" x="478" y="293">MORNING SQL</text>
    <text class="card-title" x="478" y="320">Profile-scoped dashboard + reports</text>

    <rect class="outline powder" x="460" y="350" width="572" height="70" rx="10"/>
    <text class="micro" x="478" y="373">HUMAN QUEUES</text>
    <text class="card-title" x="478" y="400">Modeled state + qualification rules</text>

    <rect class="outline cream" x="460" y="430" width="572" height="70" rx="10"/>
    <text class="micro" x="478" y="453">FAILURE TRACKER · MOVE 1 OF 3</text>
    <text class="card-title" x="478" y="480">Service-layer current-state updates</text>

    <rect class="outline powder" x="460" y="510" width="572" height="70" rx="10"/>
    <text class="micro" x="478" y="533">FAILURE TRACKER · MOVE 2 OF 3</text>
    <text class="card-title" x="478" y="560">Structured transmission fields</text>

    <rect class="outline cream" x="460" y="590" width="572" height="70" rx="10"/>
    <text class="micro" x="478" y="613">FAILURE TRACKER · MOVE 3 OF 3</text>
    <text class="card-title" x="478" y="640">Genomic viewer note types</text>
  </g>

  <g id="moves-to-surfaces" aria-hidden="true">
    <path class="arrow-cobalt" d="M1032 301H1176V292L1192 306L1176 320V311H1032Z"/>
    <path class="arrow-sea" d="M1032 381H1176V372L1192 386L1176 400V391H1032Z"/>
    <path class="arrow-coral" d="M1032 461C1092 461 1115 314 1176 314V305L1192 306L1176 329V320C1121 320 1098 471 1032 471Z"/>
    <path class="arrow-cobalt" d="M1032 541C1094 541 1112 466 1176 466V457L1192 466L1176 481V475C1117 475 1099 551 1032 551Z"/>
    <path class="arrow-coral" d="M1032 621C1094 621 1114 546 1176 546V537L1192 546L1176 561V555C1118 555 1100 631 1032 631Z"/>
  </g>

  <g role="group" aria-labelledby="shared-surfaces-title">
    <title id="shared-surfaces-title">Shared surfaces receiving the operating state</title>
    <rect class="shadow" x="1176" y="215" width="368" height="463" rx="17"/>
    <rect class="outline salmon" x="1168" y="207" width="368" height="463" rx="17"/>
    <rect class="cobalt-dark" x="1170" y="209" width="364" height="45" rx="15"/>
    <text class="micro-on" x="1192" y="237">CURRENT STATE ARRIVES WITH THE WORK</text>

    <rect class="outline white" x="1192" y="270" width="320" height="72" rx="10"/>
    <text class="micro" x="1210" y="293">OPERATING INTELLIGENCE</text>
    <text class="card-title" x="1210" y="320">Dashboard + reports</text>

    <rect class="outline white" x="1192" y="350" width="320" height="72" rx="10"/>
    <text class="micro" x="1210" y="373">QUALIFIED ACTION</text>
    <text class="card-title" x="1210" y="400">Assignment + queue state</text>

    <rect class="outline white" x="1192" y="430" width="320" height="72" rx="10"/>
    <text class="micro" x="1210" y="453">CROSS-SYSTEM STATE</text>
    <text class="card-title" x="1210" y="480">Transmitted status fields</text>

    <rect class="outline white" x="1192" y="510" width="320" height="72" rx="10"/>
    <text class="micro" x="1210" y="533">CASE-LOCAL CONTEXT</text>
    <text class="card-title" x="1210" y="560">Viewer note types</text>

    <rect class="acid" x="1192" y="598" width="320" height="50" rx="9" stroke="#17345f" stroke-width="2"/>
    <text class="body-strong" x="1210" y="620">Shared operating state</text>
    <text class="body" x="1210" y="640">Current status travels with the work.</text>
  </g>

  <g role="group" aria-labelledby="event-path-title">
    <title id="event-path-title">Concrete data and event movement</title>
    <text class="section" x="54" y="712">DATA + EVENT MOVEMENT</text>

    <rect class="shadow" x="62" y="738" width="270" height="126" rx="13"/>
    <rect class="outline powder" x="54" y="730" width="270" height="126" rx="13"/>
    <text class="micro" x="72" y="754">01 · INTERACTION BOUNDARY</text>
    <text class="band-title" x="72" y="785">React + Java services</text>
    <text class="band-copy" x="72" y="809">
      <tspan x="72">Profile, qualification, assignment,</tspan>
      <tspan x="72" dy="18">and action resolve before response.</tspan>
    </text>

    <path class="arrow-cobalt" aria-hidden="true" d="M324 786H334V776L350 793L334 810V800H324Z"/>

    <rect class="shadow" x="358" y="738" width="270" height="126" rx="13"/>
    <rect class="outline sea" x="350" y="730" width="270" height="126" rx="13"/>
    <text class="micro" x="368" y="754">02 · CURRENT RELATIONAL STATE</text>
    <text class="band-title" x="368" y="785">PostgreSQL transaction</text>
    <text class="band-copy" x="368" y="809">
      <tspan x="368">Case, status, assignment, reason,</tspan>
      <tspan x="368" dy="18">and revision commit together.</tspan>
    </text>

    <path class="arrow-cobalt" aria-hidden="true" d="M620 786H630V776L646 793L630 810V800H620Z"/>

    <rect class="shadow" x="654" y="738" width="270" height="126" rx="13"/>
    <rect class="outline cream" x="646" y="730" width="270" height="126" rx="13"/>
    <text class="micro" x="664" y="754">03 · DURABLE MOVEMENT</text>
    <text class="band-title" x="664" y="785">Transactional outbox</text>
    <text class="band-copy" x="664" y="809">
      <tspan x="664">Stable event identity accompanies</tspan>
      <tspan x="664" dy="18">the committed operating change.</tspan>
    </text>

    <path class="arrow-cobalt" aria-hidden="true" d="M916 786H926V776L942 793L926 810V800H916Z"/>

    <rect class="shadow" x="950" y="738" width="270" height="126" rx="13"/>
    <rect class="outline salmon" x="942" y="730" width="270" height="126" rx="13"/>
    <text class="micro" x="960" y="754">04 · QUEUED DELIVERY</text>
    <text class="band-title" x="960" y="785">Amazon SQS</text>
    <text class="band-copy" x="960" y="809">
      <tspan x="960">At-least-once delivery keeps event</tspan>
      <tspan x="960" dy="18">movement explicit and observable.</tspan>
    </text>

    <path class="arrow-cobalt" aria-hidden="true" d="M1212 786H1222V776L1238 793L1222 810V800H1212Z"/>

    <rect class="shadow" x="1246" y="738" width="290" height="126" rx="13"/>
    <rect class="outline acid" x="1238" y="730" width="290" height="126" rx="13"/>
    <text class="micro" x="1256" y="754">05 · APPLY + RECOVERY</text>
    <text class="band-title" x="1256" y="785">Idempotent apply</text>
    <text class="band-copy" x="1256" y="809">
      <tspan x="1256">Retry, quarantine, and replay retain</tspan>
      <tspan x="1256" dy="18">a recoverable path after failure.</tspan>
    </text>
  </g>

  <g role="group" aria-labelledby="changed-work-title">
    <title id="changed-work-title">Changed work and investment</title>
    <rect class="shadow" x="62" y="902" width="1466" height="174" rx="14"/>
    <rect class="outline white" x="54" y="894" width="1466" height="174" rx="14"/>
    <rect class="cobalt-dark" x="56" y="896" width="1462" height="43" rx="12"/>
    <text class="micro-on" x="76" y="923">CHANGED WORK + INVESTMENT</text>

    <text class="band-title" x="76" y="970">Curators</text>
    <text class="band-copy" x="76" y="994">
      <tspan x="76">Inspect current issues and assign work</tspan>
      <tspan x="76" dy="18">within current assay sign-off.</tspan>
    </text>

    <line class="hairline" x1="514" y1="958" x2="514" y2="1028"/>
    <text class="band-title" x="542" y="970">Shared operation</text>
    <text class="band-copy" x="542" y="994">
      <tspan x="542">Structured status travels across systems;</tspan>
      <tspan x="542" dy="18">explicit recovery retains failed movement.</tspan>
    </text>

    <line class="hairline" x1="1002" y1="958" x2="1002" y2="1028"/>
    <text class="band-title" x="1030" y="970">Investment path</text>
    <text class="band-copy" x="1030" y="994">
      <tspan x="1030">Clinical informatics shapes context; platform and data</tspan>
      <tspan x="1030" dy="18">engineering carry state; operations and Quality carry recovery.</tspan>
    </text>

    <rect class="acid" x="76" y="1034" width="1422" height="24" rx="5"/>
    <text class="micro" x="92" y="1051">TWO DISTINCT STARTING BURDENS · 30+ MIN DAILY SQL + EMAIL · 15–20 MIN PER CURATOR FOR ASSIGNMENT AND REASSIGNMENT</text>
  </g>
</svg>
