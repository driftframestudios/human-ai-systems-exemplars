<text x="40" y="79" font-size="30" font-weight="bold">Published labels and mode flags can differ</text>
<text x="40" y="113" class="label">All product types | 10000 records | 339 machine-failure labels</text>
<text x="40" y="144" class="small">Descriptive comparison. Product type is a source quality variant; record identifiers are not timestamps.</text>
</g>
