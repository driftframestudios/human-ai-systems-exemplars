<svg xmlns="http://www.w3.org/2000/svg" id="atlas-ai4i-reconciliation-figure" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-labelledby="atlas-ai4i-reconciliation-title atlas-ai4i-reconciliation-description">
<title id="atlas-ai4i-reconciliation-title">Published labels and mode flags can differ: All product types</title>
<desc id="atlas-ai4i-reconciliation-description">All product types: 10000 records, 339 Machine failure labels, 348 records with any mode flag, 27 label/flag disagreements. Rates use the published Machine failure field. The released table supplies record identifiers rather than observation timestamps. Source type: published-generated-records; DOI https://doi.org/10.24432/C5HS5C; license CC-BY-4.0; verified-input SHA-256 dc6630cd9b1f0f853922fad78a1b6436570d3f1ec863f1dd5c4340ac56bc8a8e.</desc>
<style>
