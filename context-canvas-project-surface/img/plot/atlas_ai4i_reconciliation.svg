#atlas-ai4i-reconciliation-figure .small{font-size:14px}#atlas-ai4i-reconciliation-figure .body{font-size:16px}
#atlas-ai4i-reconciliation-figure .label{font-size:19px}#atlas-ai4i-reconciliation-figure .number{font-size:25px;font-variant-numeric:tabular-nums}
#atlas-ai4i-reconciliation-figure .big{font-size:38px;font-weight:bold}#atlas-ai4i-reconciliation-figure .tick{font-size:13px}
#atlas-ai4i-reconciliation-figure .cell{font-size:14px;font-variant-numeric:tabular-nums}#atlas-ai4i-reconciliation-figure .inverse{fill:#fffcf5}
#atlas-ai4i-reconciliation-figure .rule{stroke:#d4e3f5;stroke-width:1}
</style>
