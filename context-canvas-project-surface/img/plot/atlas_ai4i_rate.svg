<title id="atlas-ai4i-rate-title">Machine-failure frequency by product type: All product types</title>
<desc id="atlas-ai4i-rate-description">All product types: 10000 records, 339 Machine failure labels, 348 records with any mode flag, 27 label/flag disagreements. Rates use the published Machine failure field. The released table supplies record identifiers rather than observation timestamps. Source type: published-generated-records; DOI https://doi.org/10.24432/C5HS5C; license CC-BY-4.0; verified-input SHA-256 dc6630cd9b1f0f853922fad78a1b6436570d3f1ec863f1dd5c4340ac56bc8a8e.</desc>
