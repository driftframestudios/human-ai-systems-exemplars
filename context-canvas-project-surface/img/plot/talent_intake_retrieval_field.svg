<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="tir-title tir-desc">
  <title id="tir-title">Retrieval determines who enters the decision set</title>
  <desc id="tir-desc">An operating field follows candidate-authored hero, resume, body-of-work, and public surfaces through parse and normalize, skills projection, retrieval, ordered rubric review, and named human review. Stated, normalized, inferred, and unresolved signals retain distinct standing and provenance. Research on resume-screening bias and an EEOC age-screening settlement are attached to retrieval and ordering mechanisms. New York City automated-employment-decision-tool audit and notice duties and European Union high-risk employment AI and human-oversight duties are attached where jurisdiction and deployment place the mechanism in scope. The field presents an inspectable retrieval set; named human roles retain employment decisions.</desc>

  <defs>
    <pattern id="tir-grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#cfe7f7" stroke-width="1" opacity="0.5"/>
    </pattern>
    <style>
      .sans { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
      .eyebrow { font-size: 13px; font-weight: 850; letter-spacing: 1.7px; }
      .title { font-size: 40px; font-weight: 830; letter-spacing: -1px; }
      .lead { font-size: 15.5px; font-weight: 650; }
      .section { font-size: 18px; font-weight: 850; }
      .stage-title { font-size: 15px; font-weight: 850; }
      .copy { font-size: 12.5px; font-weight: 620; }
      .small { font-size: 11.5px; font-weight: 650; }
      .micro { font-size: 11px; font-weight: 850; letter-spacing: .66px; }
      .ink { fill: #17345f; }
      .body { fill: #304a71; }
      .muted { fill: #5d6f8b; }
      .white { fill: #fffdf8; }
      .cobalt { fill: #2855f3; }
    </style>
  </defs>

  <rect width="1600" height="1120" fill="#fffaf2"/>
  <rect x="28" y="28" width="1552" height="1072" rx="28" fill="#17345f"/>
  <rect x="20" y="20" width="1552" height="1072" rx="28" fill="#fffdf8" stroke="#17345f" stroke-width="2"/>
  <rect x="21" y="21" width="1550" height="1070" rx="27" fill="url(#tir-grid)" opacity="0.58"/>

  <g id="tir-question" role="group" aria-labelledby="tir-question-title">
    <title id="tir-question-title">The retrieval question</title>
    <path d="M20 48Q20 20 48 20H1544Q1572 20 1572 48V180H20Z" fill="#2855f3"/>
    <text x="56" y="58" class="sans eyebrow white">TALENT INTAKE · RETRIEVAL FIELD</text>
    <text x="56" y="107" class="sans title white">Retrieval determines who enters the decision set</text>
    <text x="56" y="144" class="sans lead" fill="#e7efff">A parser recommends what it can find; inspectability begins before a query returns a set.</text>
    <rect x="1192" y="45" width="337" height="104" rx="14" fill="#fffdf8" stroke="#17345f" stroke-width="2"/>
    <rect x="1204" y="58" width="8" height="78" rx="4" fill="#f2ff67"/>
    <text x="1230" y="80" class="mono micro cobalt">DECISION BOUNDARY</text>
    <text x="1230" y="104" class="sans copy ink">The system assembles an inspectable set.</text>
    <text x="1230" y="126" class="sans copy ink">Named people retain employment judgment.</text>
  </g>

  <g id="tir-populations" role="group" aria-labelledby="tir-populations-title">
    <title id="tir-populations-title">Populations operating and governing the field</title>
    <g class="sans micro ink">
      <rect x="54" y="202" width="286" height="42" rx="10" fill="#d9efea" stroke="#17345f" stroke-width="2"/>
      <text x="197" y="228" text-anchor="middle">CANDIDATE + AUTHOR</text>
      <rect x="352" y="202" width="286" height="42" rx="10" fill="#cfe7f7" stroke="#17345f" stroke-width="2"/>
      <text x="495" y="228" text-anchor="middle">PARSER + TALENT SYSTEM</text>
      <rect x="650" y="202" width="286" height="42" rx="10" fill="#e7efff" stroke="#17345f" stroke-width="2"/>
      <text x="793" y="228" text-anchor="middle">RECRUITING OPERATIONS</text>
      <rect x="948" y="202" width="286" height="42" rx="10" fill="#fff5de" stroke="#17345f" stroke-width="2"/>
      <text x="1091" y="228" text-anchor="middle">RECRUITER + HIRING MANAGER</text>
      <rect x="1246" y="202" width="286" height="42" rx="10" fill="#ffd3d0" stroke="#17345f" stroke-width="2"/>
      <text x="1389" y="228" text-anchor="middle">LEGAL + EEO + SYSTEM STEWARD</text>
    </g>
  </g>

  <g id="tir-mechanism" role="group" aria-labelledby="tir-mechanism-title">
    <title id="tir-mechanism-title">Candidate-authored surfaces through named human review</title>
    <rect x="62" y="278" width="1484" height="478" rx="18" fill="#17345f"/>
    <rect x="54" y="270" width="1484" height="478" rx="18" fill="#fffdf8" stroke="#17345f" stroke-width="2"/>
    <text x="78" y="303" class="mono eyebrow cobalt">MECHANISM · INSPECT EACH TRANSFORMATION</text>
    <text x="1512" y="302" text-anchor="end" class="mono micro ink">SOURCE → STANDING → RELATION → OWNER → CORRECTION</text>

    <g id="tir-authored" role="group" aria-labelledby="tir-authored-title">
      <title id="tir-authored-title">Candidate-authored surfaces</title>
      <rect x="76" y="328" width="207" height="239" rx="13" fill="#d9efea" stroke="#17345f" stroke-width="2"/>
      <text x="96" y="357" class="mono micro cobalt">01 · AUTHORED</text>
      <text x="96" y="384" class="sans stage-title ink">Candidate surfaces</text>
      <text x="96" y="416" class="sans copy body">Hero claim</text>
      <text x="96" y="439" class="sans copy body">Resume text</text>
      <text x="96" y="462" class="sans copy body">Body-of-work artifact</text>
      <text x="96" y="485" class="sans copy body">Public artifact URL</text>
      <rect x="96" y="512" width="166" height="34" rx="17" fill="#17345f"/>
      <text x="179" y="533" text-anchor="middle" class="mono micro white">SOURCE-BOUND</text>
    </g>
    <path d="M283 423H300V413L315 447L300 481V471H283Z" fill="#2855f3" aria-hidden="true"/>

    <g id="tir-parse" role="group" aria-labelledby="tir-parse-title">
      <title id="tir-parse-title">Parse and normalize</title>
      <rect x="315" y="328" width="207" height="239" rx="13" fill="#cfe7f7" stroke="#17345f" stroke-width="2"/>
      <text x="335" y="357" class="mono micro cobalt">02 · PARSE</text>
      <text x="335" y="384" class="sans stage-title ink">Parse + normalize</text>
      <text x="335" y="416" class="sans copy body">Role title</text>
      <text x="335" y="439" class="sans copy body">Named skill</text>
      <text x="335" y="462" class="sans copy body">Employer + scale</text>
      <text x="335" y="485" class="sans copy body">Resolvable link</text>
      <rect x="335" y="512" width="166" height="34" rx="17" fill="#fffdf8" stroke="#17345f" stroke-width="1.5"/>
      <text x="418" y="533" text-anchor="middle" class="mono micro ink">PROVENANCE HELD</text>
    </g>
    <path d="M522 423H539V413L554 447L539 481V471H522Z" fill="#2855f3" aria-hidden="true"/>

    <g id="tir-project" role="group" aria-labelledby="tir-project-title">
      <title id="tir-project-title">Skills projection</title>
      <rect x="554" y="328" width="207" height="239" rx="13" fill="#e7efff" stroke="#17345f" stroke-width="2"/>
      <text x="574" y="357" class="mono micro cobalt">03 · PROJECT</text>
      <text x="574" y="384" class="sans stage-title ink">Skills projection</text>
      <text x="574" y="416" class="sans copy body">Stated edge</text>
      <text x="574" y="439" class="sans copy body">Normalized edge</text>
      <text x="574" y="462" class="sans copy body">Inferred adjacency</text>
      <text x="574" y="485" class="sans copy body">Unresolved relation</text>
      <rect x="574" y="512" width="166" height="34" rx="17" fill="#fffdf8" stroke="#17345f" stroke-width="1.5"/>
      <text x="657" y="533" text-anchor="middle" class="mono micro ink">STANDING SHOWN</text>
    </g>
    <path d="M761 423H778V413L793 447L778 481V471H761Z" fill="#2855f3" aria-hidden="true"/>

    <g id="tir-retrieve" role="group" aria-labelledby="tir-retrieve-title">
      <title id="tir-retrieve-title">Retrieval</title>
      <rect x="793" y="328" width="207" height="239" rx="13" fill="#f2ff67" stroke="#17345f" stroke-width="2"/>
      <text x="813" y="357" class="mono micro cobalt">04 · RETRIEVE</text>
      <text x="813" y="384" class="sans stage-title ink">Query + retrieval</text>
      <text x="813" y="416" class="sans copy body">Boolean or natural language</text>
      <text x="813" y="439" class="sans copy body">Exact + adjacent match</text>
      <text x="813" y="462" class="sans copy body">Artifact reachability</text>
      <text x="813" y="485" class="sans copy body">Decision-set entry</text>
      <rect x="813" y="512" width="166" height="34" rx="17" fill="#17345f"/>
      <text x="896" y="533" text-anchor="middle" class="mono micro white">AUDIT THE QUERY</text>
    </g>
    <path d="M1000 423H1017V413L1032 447L1017 481V471H1000Z" fill="#2855f3" aria-hidden="true"/>

    <g id="tir-rubric" role="group" aria-labelledby="tir-rubric-title">
      <title id="tir-rubric-title">Ranking and rubric routing</title>
      <rect x="1032" y="328" width="207" height="239" rx="13" fill="#fff5de" stroke="#17345f" stroke-width="2"/>
      <text x="1052" y="357" class="mono micro cobalt">05 · ROUTE</text>
      <text x="1052" y="384" class="sans stage-title ink">Rank + rubric</text>
      <text x="1052" y="416" class="sans copy body">Ordered retrieval set</text>
      <text x="1052" y="439" class="sans copy body">Rubric-as-prompt</text>
      <text x="1052" y="462" class="sans copy body">Reason + source visible</text>
      <text x="1052" y="485" class="sans copy body">Escalation owner named</text>
      <rect x="1052" y="512" width="166" height="34" rx="17" fill="#fffdf8" stroke="#17345f" stroke-width="1.5"/>
      <text x="1135" y="533" text-anchor="middle" class="mono micro ink">RUBRIC VISIBLE</text>
    </g>
    <path d="M1239 423H1256V413L1271 447L1256 481V471H1239Z" fill="#2855f3" aria-hidden="true"/>

    <g id="tir-human" role="group" aria-labelledby="tir-human-title">
      <title id="tir-human-title">Named human review</title>
      <rect x="1271" y="328" width="243" height="239" rx="13" fill="#ffd3d0" stroke="#17345f" stroke-width="2"/>
      <text x="1291" y="357" class="mono micro cobalt">06 · REVIEW</text>
      <text x="1291" y="384" class="sans stage-title ink">Named human review</text>
      <text x="1291" y="416" class="sans copy body">Recruiter inspects source</text>
      <text x="1291" y="439" class="sans copy body">Hiring manager weighs context</text>
      <text x="1291" y="462" class="sans copy body">Candidate can correct record</text>
      <text x="1291" y="485" class="sans copy body">System steward reviews audit</text>
      <rect x="1291" y="512" width="202" height="34" rx="17" fill="#fa7065"/>
      <text x="1392" y="533" text-anchor="middle" class="mono micro ink">HUMAN JUDGMENT</text>
    </g>

    <g id="tir-bias-boundary" role="group" aria-labelledby="tir-bias-title">
      <title id="tir-bias-title">Research and enforcement evidence attached to retrieval and ordering</title>
      <path d="M892 567V582H882L897 600L912 582H902V567Z" fill="#fa7065" aria-hidden="true"/>
      <rect x="708" y="600" width="486" height="124" rx="12" fill="#ffd3d0" stroke="#17345f" stroke-width="2"/>
      <text x="730" y="626" class="mono micro ink">MECHANISM-BOUND BIAS EVIDENCE</text>
      <text x="730" y="651" class="sans small ink">UW research documents race, gender, and intersectional</text>
      <text x="730" y="671" class="sans small ink">harm in resume-screening recommendations. EEOC enforcement</text>
      <text x="730" y="691" class="sans small ink">documents age discrimination in automated applicant screening.</text>
      <text x="730" y="711" class="mono micro cobalt">TEST RETRIEVAL + ORDERING ALONGSIDE PARSING ACCURACY</text>
    </g>

    <g id="tir-oversight" role="group" aria-labelledby="tir-oversight-title">
      <title id="tir-oversight-title">Official oversight attached where the mechanism is in scope</title>
      <path d="M1150 567V582H1140L1155 600L1170 582H1160V567Z" fill="#2855f3" aria-hidden="true"/>
      <rect x="1208" y="600" width="306" height="124" rx="12" fill="#e7efff" stroke="#17345f" stroke-width="2"/>
      <text x="1230" y="626" class="mono micro cobalt">APPLICABILITY-BOUND OVERSIGHT</text>
      <text x="1230" y="651" class="sans small ink">NYC · covered AEDT bias audit + notice</text>
      <text x="1230" y="674" class="sans small ink">EU · high-risk employment AI + human oversight</text>
      <text x="1230" y="697" class="sans small ink">Apply where deployment and jurisdiction place</text>
      <text x="1230" y="715" class="sans small ink">the mechanism in scope.</text>
    </g>

    <rect x="76" y="600" width="612" height="124" rx="12" fill="#d9efea" stroke="#17345f" stroke-width="2"/>
    <text x="98" y="626" class="mono micro cobalt">PROJECTED-EDGE CONTRACT</text>
    <text x="98" y="651" class="sans small ink">Source field · stated/inferred standing · ontology relation · artifact URL</text>
    <text x="98" y="674" class="sans small ink">Reader effect · review owner · correction state · audit relevance</text>
    <rect x="98" y="693" width="568" height="19" rx="9.5" fill="#17345f"/>
    <text x="382" y="707" text-anchor="middle" class="mono micro white">EVERY TRANSFORMATION REMAINS INSPECTABLE</text>
  </g>

  <g id="tir-investment" role="group" aria-labelledby="tir-investment-title">
    <title id="tir-investment-title">Changed work and investment required to operate the field</title>
    <rect x="62" y="788" width="1484" height="184" rx="18" fill="#17345f"/>
    <rect x="54" y="780" width="1484" height="184" rx="18" fill="#e7efff" stroke="#17345f" stroke-width="2"/>
    <text x="78" y="811" class="mono eyebrow ink">CHANGED WORK + INVESTMENT</text>

    <rect x="76" y="833" width="270" height="105" rx="11" fill="#fffdf8" stroke="#17345f" stroke-width="1.5"/>
    <text x="94" y="859" class="mono micro cobalt">AUTHOR + CONTENT DESIGN</text>
    <text x="94" y="884" class="sans small body">Current artifacts, precise claims,</text>
    <text x="94" y="903" class="sans small body">stable URLs, visible depth boundary.</text>

    <rect x="365" y="833" width="270" height="105" rx="11" fill="#fffdf8" stroke="#17345f" stroke-width="1.5"/>
    <text x="383" y="859" class="mono micro cobalt">TALENT OPERATIONS</text>
    <text x="383" y="884" class="sans small body">Query stewardship, rubric ownership,</text>
    <text x="383" y="903" class="sans small body">escalation and correction service.</text>

    <rect x="654" y="833" width="270" height="105" rx="11" fill="#fffdf8" stroke="#17345f" stroke-width="1.5"/>
    <text x="672" y="859" class="mono micro cobalt">ENGINEERING + DATA</text>
    <text x="672" y="884" class="sans small body">Parser quality, provenance, ontology</text>
    <text x="672" y="903" class="sans small body">versioning, logs, rollback, observability.</text>

    <rect x="943" y="833" width="270" height="105" rx="11" fill="#fffdf8" stroke="#17345f" stroke-width="1.5"/>
    <text x="961" y="859" class="mono micro cobalt">NAMED HUMAN REVIEW</text>
    <text x="961" y="884" class="sans small body">Contextual judgment, exception handling,</text>
    <text x="961" y="903" class="sans small body">record correction, decision accountability.</text>

    <rect x="1232" y="833" width="282" height="105" rx="11" fill="#fffdf8" stroke="#17345f" stroke-width="1.5"/>
    <text x="1250" y="859" class="mono micro cobalt">LEGAL + EEO + STEWARDSHIP</text>
    <text x="1250" y="884" class="sans small body">Applicability, notices, audit design,</text>
    <text x="1250" y="903" class="sans small body">oversight, contestability, remediation.</text>
  </g>

  <g id="tir-boundary" role="group" aria-labelledby="tir-boundary-title">
    <title id="tir-boundary-title">Evidence and authority boundary</title>
    <rect x="62" y="1006" width="1484" height="62" rx="14" fill="#17345f"/>
    <rect x="54" y="998" width="1484" height="62" rx="14" fill="#fff5de" stroke="#17345f" stroke-width="2"/>
    <rect x="54" y="998" width="14" height="62" rx="7" fill="#fa7065"/>
    <text x="88" y="1023" class="mono micro ink">EVIDENCE + AUTHORITY BOUNDARY</text>
    <text x="88" y="1047" class="sans small body">Vendor capability claims remain self-described. Legibility, fairness, fit, and capability require separate evidence.</text>
    <rect x="1175" y="1014" width="339" height="31" rx="15.5" fill="#17345f"/>
    <text x="1344.5" y="1034" text-anchor="middle" class="mono micro white">EMPLOYMENT JUDGMENT STAYS WITH NAMED PEOPLE</text>
  </g>
</svg>
