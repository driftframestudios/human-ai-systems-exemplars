<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1180" role="img" aria-labelledby="influence-title influence-desc">
  <title id="influence-title">Who To Believe influence and household-transition map</title>
  <desc id="influence-desc">A participation-and-influence diagram shows three participation tiers, a directed graph of household changes and shared-address relationships, focused human review, protections for marriage and roommate patterns, and the work and investment created by selective review.</desc>
  <defs>
    <clipPath id="influence-frame-clip">
      <rect x="18" y="18" width="1564" height="1144" rx="28"/>
    </clipPath>
    <pattern id="influence-speckle" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="6" cy="8" r="1" fill="#8aaee9" opacity=".18"/>
      <circle cx="23" cy="20" r=".8" fill="#8aaee9" opacity=".13"/>
    </pattern>
    <style>
      .frame{fill:none;stroke:#215fbb;stroke-width:3}.field{fill:#f4f7fd}.grain{fill:url(#influence-speckle)}
      .paper{fill:#fffdf7;stroke:#8aaee9;stroke-width:1.6}.paper-blue{fill:#f4f8ff;stroke:#8aaee9;stroke-width:1.6}
      .cobalt{fill:#215fbb;stroke:#16345e;stroke-width:1.8}.cobalt-soft{fill:#dbe9ff;stroke:#215fbb;stroke-width:2}
      .sea{fill:#dbf0f0;stroke:#263f42;stroke-width:1.7}.sea-soft{fill:#f1f9f9;stroke:#afc8c8;stroke-width:1.4}
      .warm{fill:#fff0cf;stroke:#765a20;stroke-width:1.8}.rose{fill:#f5d6cf;stroke:#9f493e;stroke-width:1.7}
      .rail{fill:#16345e}.arrow{fill:#215fbb}.arrow-soft{fill:#8aaee9}.arrow-sea{fill:#4f7f82}
      .edge{fill:none;stroke:#215fbb;stroke-width:3}.edge-soft{fill:none;stroke:#8aaee9;stroke-width:2.2}
      .eyebrow{font:700 15px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:1.6px;fill:#4c678d}
      .title{font:760 32px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#16345e}
      .subtitle{font:500 17px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#4c678d}
      .section{font:760 20px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#16345e}
      .card-title{font:760 20px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#16345e}
      .body{font:500 16px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#263f42}
      .small{font:500 14px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#4c678d}
      .micro{font:700 12px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.7px;fill:#4c678d}
      .on-cobalt{fill:#fffdf7}.on-cobalt-muted{fill:#dbe9ff}
      .number{font:780 25px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#16345e}
      .node-label{font:700 14px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#16345e;text-anchor:middle}
      .node-meta{font:500 12px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#4c678d;text-anchor:middle}
      .route-title{font:760 17px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#173f42}
      .route-body{font:500 14px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#263f42}
    </style>
  </defs>

  <g clip-path="url(#influence-frame-clip)">
    <rect class="field" x="18" y="18" width="1564" height="1144"/>
    <rect class="grain" x="18" y="18" width="1564" height="1144"/>
  </g>
  <rect class="frame" x="18" y="18" width="1564" height="1144" rx="28"/>

  <text class="eyebrow" x="50" y="62">WHO TO BELIEVE · INFLUENCE + HOUSEHOLD INTEGRITY</text>
  <text class="title" x="50" y="101">Reweight the voice portfolio; focus human judgment where patterns stay ambiguous</text>
  <text class="subtitle" x="50" y="132">Relationship, campaign fit, and transition context move together: influence grows more specific while roster review grows more selective.</text>

  <text class="eyebrow" x="50" y="170">THREE PARTICIPATION TIERS · THREE TRANSACTION MODELS</text>

  <g aria-label="Partner voice tier">
    <rect class="cobalt" x="50" y="188" width="472" height="174" rx="18"/>
    <text class="micro on-cobalt-muted" x="72" y="218">TIER 01 · PARTNER VOICE</text>
    <text class="card-title on-cobalt" x="72" y="251">Human-to-human relationship</text>
    <text class="body on-cobalt" x="72" y="284">
      <tspan x="72">Direct conversation, campaign fit, and</tspan>
      <tspan x="72" dy="23">a negotiated product relationship.</tspan>
    </text>
    <rect x="72" y="326" width="268" height="24" rx="12" fill="#16345e" opacity=".82"/>
    <text class="micro on-cobalt" x="86" y="343">high context · deliberately scarce</text>
  </g>

  <g aria-label="Community voice tier">
    <rect class="cobalt-soft" x="544" y="188" width="472" height="174" rx="18"/>
    <text class="micro" x="566" y="218">TIER 02 · COMMUNITY VOICE</text>
    <text class="card-title" x="566" y="251">Authentic mid-range influence</text>
    <text class="body" x="566" y="284">
      <tspan x="566">Product exchange, mobile field work,</tspan>
      <tspan x="566" dy="23">and community-relevant participation.</tspan>
    </text>
    <rect x="566" y="326" width="301" height="24" rx="12" fill="#edf4ff" stroke="#8aaee9"/>
    <text class="micro" x="580" y="343">strategic audience · reachable in context</text>
  </g>

  <g aria-label="Participant voice tier">
    <rect class="paper" x="1038" y="188" width="512" height="174" rx="18"/>
    <text class="micro" x="1060" y="218">TIER 03 · PARTICIPANT VOICE</text>
    <text class="card-title" x="1060" y="251">Broad survey and review pool</text>
    <text class="body" x="1060" y="284">
      <tspan x="1060">Campaign-fit qualification, surveys,</tspan>
      <tspan x="1060" dy="23">reviews, and repeat participation.</tspan>
    </text>
    <rect x="1060" y="326" width="302" height="24" rx="12" fill="#fff0cf" stroke="#c7a96a"/>
    <text class="micro" x="1074" y="343">broad reach · fit-sensitive weighting</text>
  </g>

  <!-- Tier connectors converge into one explicit weighting rail. Arrowheads are part of each filled shape. -->
  <path class="arrow" d="M280 362 H292 V380 H338 V374 L354 384 L338 394 V388 H280 Z"/>
  <path class="arrow" d="M774 362 H786 V380 H832 V374 L848 384 L832 394 V388 H774 Z"/>
  <path class="arrow" d="M1288 362 H1300 V380 H1346 V374 L1362 384 L1346 394 V388 H1288 Z"/>
  <rect class="rail" x="354" y="376" width="992" height="16" rx="8"/>
  <text class="small" x="546" y="415">Influence is weighted by relationship + campaign fit; household integrity shapes eligibility and review.</text>

  <text class="eyebrow" x="50" y="456">DIRECTED HOUSEHOLD GRAPH · THE GRAPH NARROWS THE REVIEW SCOPE</text>

  <g aria-label="Household-transition graph">
    <rect class="paper-blue" x="50" y="474" width="950" height="418" rx="20"/>
    <text class="section" x="74" y="510">Transition history and shared-address context</text>
    <text class="small" x="74" y="535">Nodes hold declared states. Directed edges preserve what changed, when, and within which campaign context.</text>

    <text class="micro" x="74" y="578">SEQUENCE PATTERN · ONE ACCOUNT ACROSS THREE QUALIFICATIONS</text>

    <g aria-label="Household size five in campaign alpha">
      <circle class="cobalt-soft" cx="140" cy="637" r="52"/>
      <text class="node-label" x="140" y="629">HOUSEHOLD 5</text>
      <text class="node-meta" x="140" y="651">campaign α</text>
    </g>
    <path class="arrow" d="M192 631 H242 V623 L260 637 L242 651 V643 H192 Z"/>
    <g aria-label="Household size two in campaign beta">
      <circle class="warm" cx="320" cy="637" r="52"/>
      <text class="node-label" x="320" y="629">HOUSEHOLD 2</text>
      <text class="node-meta" x="320" y="651">campaign β</text>
    </g>
    <path class="arrow" d="M372 631 H422 V623 L440 637 L422 651 V643 H372 Z"/>
    <g aria-label="Household size five in campaign gamma">
      <circle class="cobalt-soft" cx="500" cy="637" r="52"/>
      <text class="node-label" x="500" y="629">HOUSEHOLD 5</text>
      <text class="node-meta" x="500" y="651">campaign γ</text>
    </g>

    <text class="micro" x="74" y="730">RELATIONSHIP CONTEXT · ONE ADDRESS CAN DESCRIBE DIFFERENT LEGITIMATE LIVES</text>
    <rect class="sea" x="78" y="754" width="162" height="76" rx="16"/>
    <text class="node-label" x="159" y="783">ACCOUNT U42</text>
    <text class="node-meta" x="159" y="805">declared resident</text>
    <rect class="sea" x="278" y="754" width="162" height="76" rx="16"/>
    <text class="node-label" x="359" y="783">ACCOUNT U67</text>
    <text class="node-meta" x="359" y="805">roommate pattern</text>
    <rect class="sea" x="478" y="754" width="162" height="76" rx="16"/>
    <text class="node-label" x="559" y="783">ACCOUNT U91</text>
    <text class="node-meta" x="559" y="805">new partner pattern</text>
    <path class="arrow-sea" d="M240 786 H278 V780 L294 792 L278 804 V798 H240 Z"/>
    <path class="arrow-sea" d="M440 786 H478 V780 L494 792 L478 804 V798 H440 Z"/>

    <path class="arrow" d="M552 631 H670 V622 L690 637 L670 652 V643 H552 Z"/>
    <path class="arrow-sea" d="M640 786 H670 V780 H690 V772 L710 792 L690 812 V804 H670 V798 H640 Z"/>
    <rect class="cobalt" x="710" y="590" width="258" height="244" rx="20"/>
    <text class="micro on-cobalt-muted" x="734" y="623">HOUSEHOLD DISCRIMINATOR</text>
    <text class="card-title on-cobalt" x="734" y="656">Pattern + context</text>
    <text class="body on-cobalt" x="734" y="692">
      <tspan x="734">Sequence, campaign value,</tspan>
      <tspan x="734" dy="23">shared-address context,</tspan>
      <tspan x="734" dy="23">and prior review outcomes.</tspan>
    </text>
    <rect x="734" y="778" width="204" height="34" rx="17" fill="#16345e"/>
    <text class="micro on-cobalt" x="752" y="800">reason codes travel forward</text>
  </g>

  <g aria-label="Focused review and cohort protection">
    <rect class="paper" x="1030" y="474" width="520" height="418" rx="20"/>
    <text class="section" x="1054" y="510">Reasoned routing</text>
    <text class="small" x="1054" y="535">The model prioritizes cases; a person resolves ambiguous household meaning.</text>

    <path class="arrow" d="M1000 625 H1022 V617 L1040 631 L1022 645 V637 H1000 Z"/>
    <rect class="cobalt-soft" x="1054" y="564" width="470" height="104" rx="16"/>
    <text class="micro" x="1074" y="591">FOCUSED HUMAN REVIEW</text>
    <text class="route-title" x="1074" y="620">Inspect high-value, ambiguous transitions</text>
    <text class="route-body" x="1074" y="645">Reasons, comparable lawful context, timing, and status stay visible.</text>

    <path class="arrow-sea" d="M1282 668 V688 H1274 L1288 706 L1302 688 H1294 V668 Z"/>
    <rect class="sea" x="1054" y="706" width="226" height="130" rx="16"/>
    <text class="micro" x="1074" y="733">COHORT PROTECTION</text>
    <text class="route-title" x="1074" y="762">Marriage transitions</text>
    <text class="route-body" x="1074" y="787">
      <tspan x="1074">A newly combined household</tspan>
      <tspan x="1074" dy="20">receives contextual review.</tspan>
    </text>
    <rect class="sea" x="1298" y="706" width="226" height="130" rx="16"/>
    <text class="micro" x="1318" y="733">COHORT PROTECTION</text>
    <text class="route-title" x="1318" y="762">Roommate households</text>
    <text class="route-body" x="1318" y="787">
      <tspan x="1318">Shared addresses retain room</tspan>
      <tspan x="1318" dy="20">for legitimate co-living.</tspan>
    </text>
    <rect x="1054" y="850" width="470" height="24" rx="12" fill="#edf4ff" stroke="#8aaee9"/>
    <text class="micro" x="1071" y="867">participant status + review timing + accessible appeal route</text>
  </g>

  <text class="eyebrow" x="50" y="930">CHANGED WORK + INVESTMENT · SELECTIVE REVIEW BECOMES AN OPERATING CAPABILITY</text>

  <g aria-label="Changed work">
    <rect class="sea-soft" x="50" y="948" width="735" height="186" rx="20"/>
    <text class="section" x="74" y="982">Changed work</text>
    <rect class="cobalt-soft" x="74" y="1002" width="42" height="42" rx="12"/>
    <text class="number" x="86" y="1032">1</text>
    <text class="body" x="132" y="1021"><tspan x="132">Graph scoring narrows a campaign-scale population</tspan><tspan x="132" dy="22">to a focused queue of consequential ambiguity.</tspan></text>
    <rect class="cobalt-soft" x="74" y="1062" width="42" height="42" rx="12"/>
    <text class="number" x="86" y="1092">2</text>
    <text class="body" x="132" y="1081"><tspan x="132">Reviewers interpret household meaning; product, trust,</tspan><tspan x="132" dy="22">and analytics tune cohort effects together.</tspan></text>
  </g>

  <g aria-label="Investment logic">
    <rect class="paper" x="805" y="948" width="745" height="186" rx="20"/>
    <text class="section" x="829" y="982">Investment logic at remembered scale</text>
    <text class="number" x="829" y="1026">≈250 reviewers · ≈2 hours/case</text>
    <text class="body" x="829" y="1054">Scenario range under remembered scale: <tspan font-weight="760" fill="#16345e">$1.3M–$2.1M</tspan></text>
    <text class="body" x="829" y="1083"><tspan x="829">The recalled budget case compared this layer with materially larger</tspan><tspan x="829" dy="22">campaign value at risk across multi-million-participant programs.</tspan></text>
    <rect class="warm" x="1296" y="1001" width="226" height="103" rx="16"/>
    <text class="micro" x="1316" y="1027">WHAT THE SPEND BOUGHT</text>
    <text class="route-title" x="1316" y="1056">Selective judgment</text>
    <text class="route-body" x="1316" y="1080">at campaign scale</text>
  </g>
</svg>
