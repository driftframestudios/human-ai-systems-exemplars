<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="disagreement-title disagreement-desc">
  <title id="disagreement-title">Disagreement entered through a meeting, a metric, and a query result</title>
  <desc id="disagreement-desc">Three equal comparison panels show where disagreement became visible in Humatics, Who To Believe, and FMI clinical-trial coordination. Each panel connects the visible surface to the operating condition, the decision-changing move, the affected populations, and the investment required to sustain the changed work.</desc>
  <defs>
    <pattern id="disagreement-grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#2855f3" stroke-opacity=".075"/></pattern>
    <style>
      .field{fill:#fffaf2}.panel{fill:#fffdf8}.cream{fill:#fff5de}.powder{fill:#cfe7f7}.sea{fill:#d9efea}.blush{fill:#ffd3d0}.pale{fill:#e7efff}.acid{fill:#f2ff67}.coral{fill:#fa7065}.cobalt{fill:#2855f3}.deep{fill:#153fbe}.ink{fill:#17345f}.shadow{fill:#17345f}.outline{stroke:#17345f;stroke-width:2;fill:none}.soft{stroke:#17345f;stroke-width:1.4}.hair{stroke:#17345f;stroke-width:1.4;fill:none}.title{font:700 34px/1.1 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#fffdf8}.subtitle{font:500 16px/1.35 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#dbe5ff}.family{font:750 18px/1.2 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#fffdf8}.surface{font:750 24px/1.2 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#17345f}.strong{font:700 16px/1.25 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#17345f}.body{font:500 13.5px/1.45 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#304a71}.micro{font:750 11px/1.2 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:1.1px;fill:#153fbe}.micro-on{font:750 11px/1.2 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:1.1px;fill:#fffdf8}.chart{font:700 11px/1.2 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#17345f}
    </style>
  </defs>

  <g aria-hidden="true"><rect class="field" x="18" y="18" width="1564" height="1084"/><rect x="18" y="18" width="1564" height="1084" fill="url(#disagreement-grid)"/><rect class="cobalt" x="18" y="18" width="1564" height="142"/><rect x="18" y="18" width="1564" height="142" fill="url(#disagreement-grid)"/></g>
  <rect class="outline" x="18" y="18" width="1564" height="1084" rx="28"/>
  <g role="group" aria-labelledby="disagreement-heading"><title id="disagreement-heading">Disagreement-surface heading</title><text class="micro-on" x="54" y="53">THREE OPERATING SURFACES · ONE ENTERPRISE QUESTION</text><text class="title" x="54" y="98">Disagreement entered through a meeting, a metric, and a query result</text><text class="subtitle" x="54" y="129">Each surface changed the decision only when shared objects, decision owners, affected populations, and operating investment moved together.</text></g>

  <g role="group" aria-labelledby="meeting-panel-title">
    <title id="meeting-panel-title">Humatics meeting disagreement surface</title>
    <rect class="shadow" x="62" y="222" width="468" height="742" rx="18"/><rect class="cream soft" x="54" y="214" width="468" height="742" rx="18"/><rect class="deep" x="56" y="216" width="464" height="52" rx="16"/><text class="family" x="76" y="249">Humatics · meeting</text>
    <text class="micro" x="78" y="304">WHERE TROUBLE APPEARED</text><text class="surface" x="78" y="338">An executive product review</text>
    <g aria-hidden="true">
      <rect class="panel soft" x="78" y="360" width="188" height="112" rx="10"/><rect class="powder soft" x="96" y="380" width="152" height="54" rx="7"/><text class="chart" x="110" y="403">POLISHED SCREENS</text><text class="chart" x="110" y="422">HARDWARE + MAPS</text><path class="deep" d="M266 405h46v-8l20 15-20 15v-8h-46z"/>
      <path class="acid soft" d="M342 360h142v82h-48l-18 22v-22h-76z"/><text class="chart" x="356" y="386">HOW DO SITES</text><text class="chart" x="356" y="404">AND INSTALLER</text><text class="chart" x="356" y="422">VIEWS FIT?</text>
    </g>
    <rect class="panel soft" x="78" y="494" width="420" height="126" rx="10"/><text class="micro" x="98" y="520">WHAT THE SURFACE REVEALED</text><text class="body" x="98" y="550"><tspan x="98">The product story could show screens and hardware</tspan><tspan x="98" dy="20">without explaining site hierarchy, installer views,</tspan><tspan x="98" dy="20">or responsibility handoff as one operating model.</tspan></text>
    <rect class="sea soft" x="78" y="638" width="420" height="126" rx="10"/><text class="micro" x="98" y="664">DECISION-CHANGING MOVE</text><text class="body" x="98" y="694"><tspan x="98">The product manager’s question met PRD concern</tspan><tspan x="98" dy="20">language and PM-mediated field inquiry; five postures</tspan><tspan x="98" dy="20">became entrances into one site hierarchy.</tspan></text>
    <rect class="blush soft" x="78" y="782" width="420" height="154" rx="10"/><text class="micro" x="98" y="808">POPULATION CONSEQUENCE + INVESTMENT</text><text class="body" x="98" y="838"><tspan x="98">Within two days, field and customer teams gained a</tspan><tspan x="98" dy="20">shared product model. The pivot changed design and</tspan><tspan x="98" dy="20">engineering work; field truth, access, recovery, and</tspan><tspan x="98" dy="20">handoff stewardship continued.</tspan></text>
  </g>

  <g role="group" aria-labelledby="metric-panel-title">
    <title id="metric-panel-title">Who To Believe metric disagreement surface</title>
    <rect class="shadow" x="574" y="222" width="468" height="742" rx="18"/><rect class="pale soft" x="566" y="214" width="468" height="742" rx="18"/><rect class="cobalt" x="568" y="216" width="464" height="52" rx="16"/><text class="family" x="588" y="249">Who To Believe · metric</text>
    <text class="micro" x="590" y="304">WHERE TROUBLE APPEARED</text><text class="surface" x="590" y="338">A favorable number with two meanings</text>
    <g aria-hidden="true">
      <rect class="panel soft" x="590" y="360" width="420" height="112" rx="10"/><line class="hair" x1="620" y1="444" x2="980" y2="444"/><rect class="cobalt" x="646" y="386" width="54" height="58"/><rect class="sea soft" x="760" y="406" width="54" height="38"/><rect class="coral" x="874" y="376" width="54" height="68"/><text class="chart" x="641" y="462">VOLUME</text><text class="chart" x="766" y="462">FIT</text><text class="chart" x="866" y="462">REOPENS</text>
    </g>
    <rect class="panel soft" x="590" y="494" width="420" height="126" rx="10"/><text class="micro" x="610" y="520">WHAT THE SURFACE REVEALED</text><text class="body" x="610" y="550"><tspan x="610">The source account reads strong email reopening</tspan><tspan x="610" dy="20">partly as recovery through a working route; the</tspan><tspan x="610" dy="20">exact navigation mechanism remains open.</tspan></text>
    <rect class="sea soft" x="590" y="638" width="420" height="126" rx="10"/><text class="micro" x="610" y="664">DECISION-CHANGING MOVE</text><text class="body" x="610" y="694"><tspan x="610">Separate participation tiers; use transition history</tspan><tspan x="610" dy="20">for qualified review; read channel metrics beside</tspan><tspan x="610" dy="20">runtime, support, and recovery behavior.</tspan></text>
    <rect class="blush soft" x="590" y="782" width="420" height="154" rx="10"/><text class="micro" x="610" y="808">POPULATION CONSEQUENCE + INVESTMENT</text><text class="body" x="610" y="838"><tspan x="610">Participants receive contextual judgment; reviewers</tspan><tspan x="610" dy="20">and executives gain a truer allocation of attention.</tspan><tspan x="610" dy="20">Direct relationships, review operations, privacy,</tspan><tspan x="610" dy="20">safety, and cross-signal instrumentation continue.</tspan></text>
  </g>

  <g role="group" aria-labelledby="query-panel-title">
    <title id="query-panel-title">FMI query-result disagreement surface</title>
    <rect class="shadow" x="1086" y="222" width="468" height="742" rx="18"/><rect class="sea soft" x="1078" y="214" width="468" height="742" rx="18"/><rect class="deep" x="1080" y="216" width="464" height="52" rx="16"/><text class="family" x="1100" y="249">FMI · query result</text>
    <text class="micro" x="1102" y="304">WHERE TROUBLE APPEARED</text><text class="surface" x="1102" y="338">Intent exceeded the stored shape</text>
    <g aria-hidden="true">
      <rect class="panel soft" x="1102" y="360" width="420" height="112" rx="10"/><text class="chart" x="1122" y="389">site_location</text><text class="chart" x="1122" y="413">location_site</text><text class="chart" x="1122" y="437">site_eval_location</text><path class="deep" d="M1258 398h46v-8l20 15-20 15v-8h-46z"/><rect class="acid soft" x="1334" y="378" width="164" height="70" rx="8"/><text class="chart" x="1352" y="405">FGFR AND cohort</text><text class="chart" x="1352" y="426">OR nested rule</text>
    </g>
    <rect class="panel soft" x="1102" y="494" width="420" height="126" rx="10"/><text class="micro" x="1122" y="520">WHAT THE SURFACE REVEALED</text><text class="body" x="1122" y="550"><tspan x="1122">Scientific intent crossed partner fields, folder</tspan><tspan x="1122" dy="20">strings, selector state, and cohort queries that the</tspan><tspan x="1122" dy="20">existing schema could not hold together.</tspan></text>
    <rect class="cream soft" x="1102" y="638" width="420" height="126" rx="10"/><text class="micro" x="1122" y="664">DECISION-CHANGING MOVE</text><text class="body" x="1122" y="694"><tspan x="1122">Separate fields; encode Boolean nesting and partner</tspan><tspan x="1122" dy="20">gates; compare the populated initial state with</tspan><tspan x="1122" dy="20">qualified final edits.</tspan></text>
    <rect class="blush soft" x="1102" y="782" width="420" height="154" rx="10"/><text class="micro" x="1122" y="808">POPULATION CONSEQUENCE + INVESTMENT</text><text class="body" x="1122" y="838"><tspan x="1122">Routine mapping can move upstream while Data</tspan><tspan x="1122" dy="20">Managers and scientific teams retain exception</tspan><tspan x="1122" dy="20">judgment. Vocabulary, partner schema, provenance,</tspan><tspan x="1122" dy="20">and regulated change control continue.</tspan></text>
  </g>

  <g role="group" aria-labelledby="shared-question-title"><title id="shared-question-title">Shared enterprise question</title><rect class="acid soft" x="174" y="986" width="1252" height="72" rx="12"/><text class="micro" x="204" y="1015">THE SHARED ENTERPRISE QUESTION</text><text class="strong" x="204" y="1043">Which account of the shared object can responsibly carry the next decision?</text></g>
</svg>
