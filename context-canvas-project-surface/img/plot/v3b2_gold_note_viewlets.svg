<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1060" width="1600" height="1060" role="img" aria-labelledby="gold-title gold-desc">
  <title id="gold-title">Gold-note viewlets preserve the route from signal to judgment</title>
  <desc id="gold-desc">A review-context diagram contrasts a detached score with four linked gold-note viewlets: signal and provenance, candidate explanations, accountable decision and appeal, and quality learning. Distinct shapes, labels, and patterns supplement color. A service route connects evidence, the review note, human judgment, participant status, and policy revision.</desc>
  <defs>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse"><path d="M34 0H0V34" fill="none" stroke="#7898c5" stroke-width="1" opacity=".18"/></pattern>
    <pattern id="candidate-stripe" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="12" height="12" fill="#fff3bf"/><rect width="3" height="12" fill="#e6c65f"/></pattern>
    <pattern id="decision-dot" width="16" height="16" patternUnits="userSpaceOnUse"><rect width="16" height="16" fill="#d9f2ed"/><circle cx="8" cy="8" r="2" fill="#2e746d"/></pattern>
    <style>
      .field{fill:#101b2b}.grid{fill:url(#grid)}.frame{fill:none;stroke:#799dd0;stroke-width:3}.paper{fill:#fff8e8;stroke:#193a62;stroke-width:2}.paper-blue{fill:#dbeaff;stroke:#193a62;stroke-width:2}.paper-sea{fill:#d9f2ed;stroke:#193a62;stroke-width:2}.gold-note{fill:#fff8e8;stroke:#edc657;stroke-width:5}.gold-soft{fill:url(#candidate-stripe);stroke:#193a62;stroke-width:2}.decision{fill:url(#decision-dot);stroke:#193a62;stroke-width:2}.edge{fill:#7ba0d5}.edge-hot{fill:#6adfd0}
      .eyebrow{font:800 15px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:1.5px;fill:#6adfd0}.title{font:780 34px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#fff8e8}.subtitle{font:500 17px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#b9cce5}.section{font:760 21px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#17345f}.body{font:500 15px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#263f58}.micro{font:800 12px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.7px;fill:#4b678b}.micro-night{font:800 12px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.7px;fill:#adc5e5}.score{font:840 76px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#17345f;text-anchor:middle}.number{font:800 22px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#17345f;text-anchor:middle}.center{text-anchor:middle}
    </style>
  </defs>

  <rect class="field" x="18" y="18" width="1564" height="1024" rx="28"/><rect class="grid" x="18" y="18" width="1564" height="1024" rx="28"/><rect class="frame" x="18" y="18" width="1564" height="1024" rx="28"/>
  <text class="eyebrow" x="52" y="64">GOLD-NOTE VIEWLETS · EVIDENCE + ALTERNATIVES + AUTHORITY + RECOVERY</text>
  <text class="title" x="52" y="104">A compact note can make a trust signal reviewable</text>
  <text class="subtitle" x="52" y="134">The note carries what a score compresses: source, candidate explanations, reasoned standing, affected population, appeal, and the evidence needed to revise.</text>

  <g role="group" aria-labelledby="detached-score-title">
    <title id="detached-score-title">Detached score anti-pattern and its structural risk</title>
    <rect class="paper-blue" x="52" y="184" width="360" height="365" rx="20"/><text class="micro" x="78" y="214">DETACHED SCORE · COMPRESSED SURFACE</text><text class="score" x="232" y="327">83</text><rect x="132" y="350" width="200" height="45" rx="22" fill="#ff8874" stroke="#77352e" stroke-width="2"/><text class="section center" x="232" y="380">HOLD</text><path d="M232 420l32 32-32 32-32-32z" fill="#fff8e8" stroke="#17345f" stroke-width="3"/><text class="section center" x="232" y="461">?</text><text class="body center" x="232" y="508">Which evidence? Which policy?</text><text class="body center" x="232" y="532">Which alternatives? Which appeal?</text>
    <rect class="paper" x="52" y="570" width="360" height="120" rx="16"/><text class="micro" x="76" y="600">STRUCTURAL RISK</text><text class="body" x="76" y="630"><tspan x="76">Trust can substitute for visible</tspan><tspan x="76" dy="22">information scent when the fluent</tspan><tspan x="76" dy="22">or authoritative surface hides routes.</tspan></text>
  </g>
  <path class="edge-hot" aria-hidden="true" d="M412 361H461V351L482 366 461 381V371H412Z"/>

  <g role="group" aria-labelledby="gold-viewlets-title">
    <title id="gold-viewlets-title">Four linked gold-note viewlets preserve provenance, alternatives, accountable decision, and quality learning</title>
    <rect class="gold-note" x="482" y="184" width="506" height="168" rx="18"/><circle cx="519" cy="222" r="22" fill="#315ed1" stroke="#17345f" stroke-width="2"/><text x="519" y="230" font-family="system-ui,sans-serif" font-size="22" font-weight="800" fill="#fff" text-anchor="middle">1</text><text class="micro" x="554" y="214">SIGNAL + PROVENANCE · SOURCE-EARNED</text><text class="section" x="510" y="266">Rapid campaign-fit reversals</text><text class="body" x="510" y="296"><tspan x="510">Evidence IDs: EVT-1042 · EVT-1188 · feature window: 30 days</tspan><tspan x="510" dy="22">Policy v3.2 · source class: minimized transition record</tspan><tspan x="510" dy="22">Denominator visible</tspan></text>
    <rect class="gold-note" x="482" y="374" width="506" height="234" rx="18"/><path d="M519 392l23 23-23 23-23-23z" fill="#e0bc4e" stroke="#17345f" stroke-width="2"/><text class="micro" x="554" y="413">CANDIDATE EXPLANATIONS · BEFORE COMMITMENT</text><text class="section" x="510" y="465">The signal admits several stories</text><rect class="gold-soft" x="510" y="486" width="450" height="31" rx="8"/><text class="body" x="524" y="507">A · campaign-shaped profile editing · uncalibrated prior 0.42</text><rect class="paper-sea" x="510" y="525" width="450" height="31" rx="8"/><text class="body" x="524" y="546">B · legitimate household transition · uncalibrated prior 0.38</text><rect class="paper-blue" x="510" y="564" width="450" height="31" rx="8"/><text class="body" x="524" y="585">C · instrument or data defect · uncalibrated prior 0.20</text>
    <rect class="gold-note" x="1014" y="184" width="514" height="206" rx="18"/><path d="M1050 204h44v44h-44z" fill="url(#decision-dot)" stroke="#17345f" stroke-width="2"/><text class="micro" x="1110" y="222">ACCOUNTABLE DECISION · STANDING VISIBLE</text><text class="section" x="1042" y="282">Route to contextual review</text><text class="body" x="1042" y="312"><tspan x="1042">Reviewer: trust operations · state: review scheduled</tspan><tspan x="1042" dy="22">Reasons: rapid reversal + campaign value band</tspan><tspan x="1042" dy="22">Participant: understandable status + independent appeal route</tspan></text>
    <rect class="gold-note" x="1014" y="414" width="514" height="194" rx="18"/><path d="M1071 433l28 16v32l-28 16-28-16v-32z" fill="#ff9b88" stroke="#17345f" stroke-width="2"/><text class="micro" x="1110" y="452">QUALITY LEARNING · FALSIFIER ATTACHED</text><text class="section" x="1042" y="524">Measure the decision, not the aura</text><text class="body" x="1042" y="554"><tspan x="1042">Slice: new household + shared address · denominator required</tspan><tspan x="1042" dy="22">Counter-signal: appeal overturn + reviewer disagreement</tspan><tspan x="1042" dy="22">Falsifier: source defect explains the reversals</tspan></text>
  </g>

  <g role="group" aria-labelledby="service-route-title">
    <title id="service-route-title">Service route through evidence, a context packet, review, participant status, and revision</title>
    <rect class="paper" x="482" y="658" width="1046" height="176" rx="20"/><text class="micro" x="510" y="689">SERVICE ROUTE · THE NOTE TRAVELS WITH THE WORK</text>
    <circle cx="574" cy="753" r="38" fill="#dbeaff" stroke="#17345f" stroke-width="2"/><text class="number" x="574" y="760">E</text><text class="micro center" x="574" y="815">EVIDENCE</text><path class="edge" aria-hidden="true" d="M612 748H686V740L703 753 686 766V758H612Z"/>
    <rect x="711" y="715" width="170" height="76" rx="14" fill="#fff3bf" stroke="#17345f" stroke-width="2"/><text class="section center" x="796" y="748">Gold note</text><text class="body center" x="796" y="773">context packet</text><path class="edge" aria-hidden="true" d="M881 748H955V740L972 753 955 766V758H881Z"/>
    <circle cx="1018" cy="753" r="38" fill="#d9f2ed" stroke="#17345f" stroke-width="2"/><text class="number" x="1018" y="760">R</text><text class="micro center" x="1018" y="815">REVIEW</text><path class="edge" aria-hidden="true" d="M1056 748H1130V740L1147 753 1130 766V758H1056Z"/>
    <rect x="1155" y="715" width="170" height="76" rx="14" fill="#dbeaff" stroke="#17345f" stroke-width="2"/><text class="section center" x="1240" y="748">Status</text><text class="body center" x="1240" y="773">reason + appeal</text><path class="edge" aria-hidden="true" d="M1325 748H1398V740L1415 753 1398 766V758H1325Z"/>
    <path d="M1461 715l39 38-39 38-39-38z" fill="#ff9b88" stroke="#17345f" stroke-width="2"/><text class="number" x="1461" y="760">Δ</text><text class="micro center" x="1461" y="815">REVISION</text>
  </g>

  <g role="group" aria-labelledby="research-boundary-title">
    <title id="research-boundary-title">Research correspondence and production-use boundary</title>
    <rect class="paper-blue" x="52" y="718" width="360" height="236" rx="18"/><text class="micro" x="78" y="749">INTERPRETIVE CORRESPONDENCE</text><text class="section" x="78" y="786">Make the candidate set visible.</text><text class="body" x="78" y="814"><tspan x="78">Ragavan &amp; Alipour (2024) describe</tspan><tspan x="78" dy="21">sparse information scent and trust as a</tspan><tspan x="78" dy="21">navigation substitute in LLM chat.</tspan><tspan x="78" dy="28">Verbalized Sampling supplies a practical</tspan><tspan x="78" dy="21">repair: name the outcome, enumerate</tspan><tspan x="78" dy="21">candidates, assumptions, and falsifiers,</tspan><tspan x="78" dy="21">then recommend.</tspan></text>
    <rect class="paper-sea" x="482" y="858" width="1046" height="96" rx="16"/><text class="micro" x="510" y="888">BOUNDARY</text><text class="body" x="510" y="917"><tspan x="510">The probabilities above are uncalibrated planning priors, not empirical model outputs. A production statistical method requires calibration,</tspan><tspan x="510" dy="22">train/serve parity, drift review, lawful population slices, privacy and safety review, workload fit, and an accountable decision contract.</tspan></text>
  </g>

  <g role="group" aria-labelledby="gold-legend-title">
    <title id="gold-legend-title">Visual legend pairing color with shape and text</title>
    <rect class="paper" x="52" y="978" width="1476" height="42" rx="12"/><circle cx="82" cy="999" r="10" fill="#315ed1"/><text class="micro" x="101" y="1004">SOURCE / SIGNAL</text><path d="M272 989l10 10-10 10-10-10z" fill="#e0bc4e" stroke="#17345f"/><text class="micro" x="293" y="1004">CANDIDATE SET</text><rect x="474" y="989" width="20" height="20" fill="url(#decision-dot)" stroke="#17345f"/><text class="micro" x="507" y="1004">ACCOUNTABLE DECISION</text><path d="M755 987l12 7v14l-12 7-12-7v-14z" fill="#ff9b88" stroke="#17345f"/><text class="micro" x="781" y="1004">QUALITY / REVISION</text><text class="micro" x="1060" y="1004">GOLD BORDER = CONTEXT PACKET · SHAPE + TEXT REINFORCE COLOR</text>
  </g>
</svg>
