<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 900" width="1500" height="900" role="img" aria-labelledby="forest-compare-title forest-compare-desc" data-role="forest-method-comparison" data-category="method" data-current-state="comparison-visible" data-state-model="stream-updated|batch-compared|look-here|human-review|recorded" data-anomaly-cue="look-here" data-source-family="ai-legible-viewlet-svg-library-v1" data-provenance="adapted-from-author-provided-viewlet-atlas">
  <title id="forest-compare-title">Random Cut Forest and Isolation Forest surface different interaction questions</title>
  <desc id="forest-compare-desc">A side-by-side method comparison maps Random Cut Forest for a changing event stream against Isolation Forest for a batch feature matrix. The streaming method asks whether a new arrival changed the forest; the batch method asks whether a sparse combination was isolated quickly. Both routes lead through a written Anomaly, Look Here state to contextual interpretation, human review, and an auditable next step. Slow emphasis moves across the comparison while every element remains visible.</desc>
  <metadata type="application/json"><![CDATA[
    {
      "artifact_id": "random-cut-isolation-forest-comparison-v2",
      "methods": ["Random Cut Forest", "Isolation Forest"],
      "source_family": "ai-legible-viewlet-svg-library-v1",
      "source_viewlets": ["viewlet-component-heatmap-v1", "viewlet-anomaly-kindness-lens-v1", "viewlet-human-ai-v1", "viewlet-audit-trail-v1"],
      "state_model": ["stream-updated", "batch-compared", "look-here", "human-review", "recorded"],
      "anomaly_cue": "look-here",
      "provenance": "Canonical viewlet geometry and semantics adapted from the author-provided AI-Legible Viewlet SVG Atlas."
    }
  ]]></metadata>
  <style>
    :root {
      --ink:#10233f; --cobalt:#2855f3; --deep:#153fbe; --paper:#fffdf8;
      --pale:#e7efff; --sea:#d9efea; --tiffany:#73e0d1; --acid:#f2ff67;
      --blush:#ffdbe3; --muted:#49627f; --grid:#cbdaf1;
    }
    text { font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill:var(--ink); }
    .mono { font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace; letter-spacing:.075em; }
    .background { fill:#f7fbff; }
    .shadow { fill:var(--ink); }
    .header { fill:var(--deep); stroke:var(--ink); stroke-width:3; }
    .header-text { fill:#fff; }
    .surface { fill:var(--paper); stroke:var(--ink); stroke-width:2.5; }
    .panel-left { fill:var(--pale); stroke:var(--ink); stroke-width:2; }
    .panel-right { fill:var(--sea); stroke:var(--ink); stroke-width:2; }
    .card,.window { fill:#fff; stroke:var(--ink); stroke-width:2; }
    .window { stroke:var(--cobalt); }
    .window-line,.ui-line { stroke:var(--cobalt); fill:none; stroke-width:2; vector-effect:non-scaling-stroke; }
    .quiet-line { stroke:var(--grid); fill:none; stroke-width:2; vector-effect:non-scaling-stroke; }
    .stream-line { stroke:var(--deep); fill:none; stroke-width:4.5; stroke-linecap:round; stroke-linejoin:round; }
    .cut { stroke:var(--muted); stroke-width:3; stroke-dasharray:9 7; opacity:.7; }
    .cut-strong { stroke:var(--cobalt); stroke-width:4; stroke-dasharray:9 7; }
    .point { fill:var(--sea); stroke:var(--deep); stroke-width:2; }
    .sparse-point { fill:var(--acid); stroke:var(--ink); stroke-width:3; }
    .look-ring { fill:none; stroke:var(--cobalt); stroke-width:4; opacity:.42; transform-box:fill-box; transform-origin:center; animation:look-ring 14s ease-in-out infinite; }
    .arrow { fill:var(--cobalt); }
    .state-chip { fill:var(--acid); stroke:var(--ink); stroke-width:2; }
    .quiet-chip { fill:#fff; stroke:var(--ink); stroke-width:2; }
    .title { font-size:35px; font-weight:900; }
    .subtitle { font-size:17px; font-weight:650; }
    .kicker { font-size:13px; font-weight:850; }
    .section-title { font-size:23px; font-weight:900; }
    .body { font-size:16px; font-weight:650; }
    .small { font-size:14px; font-weight:700; }
    .micro { font-size:11px; font-weight:850; }
    .compare-stage,.route-stage { opacity:.86; animation-duration:14s; animation-timing-function:ease-in-out; animation-iteration-count:infinite; }
    .compare-stage--stream,.route-stage--1 { animation-name:attention-one; }
    .compare-stage--batch,.route-stage--2 { animation-name:attention-two; }
    .route-stage--3 { animation-name:attention-three; }
    .route-stage--4 { animation-name:attention-four; }
    @keyframes attention-one { 0%,100%{opacity:.86} 5%,23%{opacity:1} 29%{opacity:.86} }
    @keyframes attention-two { 0%,26%,100%{opacity:.86} 33%,49%{opacity:1} 55%{opacity:.86} }
    @keyframes attention-three { 0%,52%,100%{opacity:.86} 59%,74%{opacity:1} 80%{opacity:.86} }
    @keyframes attention-four { 0%,77%,100%{opacity:.86} 84%,96%{opacity:1} }
    @keyframes look-ring { 0%,26%,58%,100%{opacity:.34;transform:scale(1)} 36%,50%{opacity:.88;transform:scale(1.14)} }
    @media (prefers-reduced-motion:reduce) {
      .compare-stage,.route-stage,.look-ring { animation:none !important; }
      .compare-stage,.route-stage { opacity:1; }
      .look-ring { opacity:.7; transform:none !important; }
    }
    @media (forced-colors:active) {
      .background,.surface,.panel-left,.panel-right,.card,.window,.quiet-chip { fill:Canvas; stroke:CanvasText; }
      .header { fill:Highlight; stroke:CanvasText; }
      .header-text { fill:HighlightText !important; }
      text { fill:CanvasText !important; }
      .window-line,.ui-line,.quiet-line,.stream-line,.cut,.cut-strong,.look-ring { stroke:CanvasText; }
      .point,.sparse-point,.state-chip { fill:Highlight; stroke:CanvasText; }
      .arrow,.shadow { fill:CanvasText; }
    }
  </style>

