<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040" role="img" aria-labelledby="spatial-title spatial-desc">
  <title id="spatial-title">From recurring coordination job to collaborative spatial memory</title>
  <desc id="spatial-desc">A recurring coordination job leads through capture planning and authority, an immutable source, a task-fitted representation, fitness evidence, and role review. Five representation branches distinguish metric geometry, photorealistic revisit, editable scene assets, annotated previews, and registered change evidence. Review and correction return to the next coordination decision.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#2855f3" stroke-opacity=".055"/></pattern>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#2855f3"/></marker>
    <marker id="return" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#fa7065"/></marker>
  </defs>
  <style>
    .field{fill:#fffaf2}.grid{fill:url(#grid)}.frame{fill:none;stroke:#17345f;stroke-width:2}.header{fill:#2855f3}
    .panel{fill:#fffdf8;stroke:#17345f;stroke-width:2}.shadow{fill:#17345f}.powder{fill:#cfe7f7}.sea{fill:#d9efea}.cream{fill:#fff5de}.pale{fill:#e7efff}.blush{fill:#ffd3d0}.acid{fill:#f2ff67}.cobalt{fill:#2855f3}
    .title{fill:#fffdf8;font:750 37px system-ui,sans-serif}.subtitle{fill:#e7efff;font:500 16px system-ui,sans-serif}.eyebrow-on{fill:#f2ff67;font:750 12px ui-monospace,monospace;letter-spacing:1.4px}.eyebrow{fill:#5d6f8b;font:750 12px ui-monospace,monospace;letter-spacing:1.1px}
    .section{fill:#17345f;font:750 20px system-ui,sans-serif}.card-title{fill:#17345f;font:750 16px system-ui,sans-serif}.body{fill:#304a71;font:500 13.5px system-ui,sans-serif}.strong{fill:#17345f;font:700 13.5px system-ui,sans-serif}.mono{fill:#304a71;font:650 11.5px ui-monospace,monospace}.mono-on{fill:#fffdf8;font:700 11.5px ui-monospace,monospace;letter-spacing:.4px}
    .flow{fill:none;stroke:#2855f3;stroke-width:5;marker-end:url(#arrow)}.return-flow{fill:none;stroke:#fa7065;stroke-width:4;stroke-dasharray:11 9;marker-end:url(#return)}.branch{fill:none;stroke:#7893bc;stroke-width:2.5}
  </style>
  <rect class="field" width="1600" height="1040"/><rect class="grid" x="20" y="20" width="1560" height="1000" rx="28"/><rect class="frame" x="20" y="20" width="1560" height="1000" rx="28"/>
  <g role="group" aria-labelledby="heading"><title id="heading">Diagram heading</title><path class="header" d="M20 48a28 28 0 0 1 28-28h1504a28 28 0 0 1 28 28v124H20Z"/><text class="eyebrow-on" x="54" y="60">SPATIAL CAPTURE · REPRESENTATION · REVIEW</text><text class="title" x="54" y="108">The coordination job chooses the representation</text><text class="subtitle" x="54" y="141">Source, transformation, fitness evidence, rights, and correction stay reachable from every view.</text></g>
  <g role="group" aria-labelledby="job"><title id="job">Recurring coordination job</title><rect class="shadow" x="64" y="224" width="220" height="230" rx="18"/><rect class="panel cream" x="54" y="214" width="220" height="230" rx="18"/><text class="eyebrow" x="78" y="248">01 · START WITH WORK</text><text class="section" x="78" y="286">Recurring</text><text class="section" x="78" y="312">coordination job</text><text class="body" x="78" y="350">Which decision repeats?</text><text class="body" x="78" y="374">What ambiguity, travel,</text><text class="body" x="78" y="398">rework, or delay does</text><text class="body" x="78" y="422">the present proxy carry?</text></g>
  <path class="flow" d="M294 329H348" aria-hidden="true"/>
  <g role="group" aria-labelledby="authority"><title id="authority">Capture planning and authority</title><rect class="shadow" x="374" y="224" width="220" height="230" rx="18"/><rect class="panel sea" x="364" y="214" width="220" height="230" rx="18"/><text class="eyebrow" x="388" y="248">02 · PLAN + AUTHORIZE</text><text class="section" x="388" y="286">Capture plan</text><text class="section" x="388" y="312">and authority</text><text class="body" x="388" y="350">Role · place · purpose</text><text class="body" x="388" y="374">Restricted zones · rights</text><text class="body" x="388" y="398">Device · coverage target</text><text class="body" x="388" y="422">Retention · return</text></g>
  <path class="flow" d="M604 329H658" aria-hidden="true"/>
  <g role="group" aria-labelledby="source"><title id="source">Immutable source bundle</title><rect class="shadow" x="684" y="224" width="220" height="230" rx="18"/><rect class="panel pale" x="674" y="214" width="220" height="230" rx="18"/><text class="eyebrow" x="698" y="248">03 · PRESERVE SOURCE</text><text class="section" x="698" y="286">Immutable</text><text class="section" x="698" y="312">source bundle</text><text class="body" x="698" y="350">Frames · depth · pose</text><text class="body" x="698" y="374">Calibration · time</text><text class="body" x="698" y="398">Device + method version</text><text class="body" x="698" y="422">Resumable transfer identity</text></g>
  <path class="flow" d="M914 329H968" aria-hidden="true"/>
  <g role="group" aria-labelledby="representation"><title id="representation">Task-fitted representation</title><rect class="shadow" x="994" y="224" width="220" height="230" rx="18"/><rect class="panel acid" x="984" y="214" width="220" height="230" rx="18"/><text class="eyebrow" x="1008" y="248">04 · SELECT A VIEW</text><text class="section" x="1008" y="286">Task-fitted</text><text class="section" x="1008" y="312">representation</text><text class="body" x="1008" y="350">Name what it preserves</text><text class="body" x="1008" y="374">Name what it leaves open</text><text class="body" x="1008" y="398">Name the receiving role</text><text class="body" x="1008" y="422">and consuming-tool profile</text></g>
  <path class="flow" d="M1224 329H1278" aria-hidden="true"/>
  <g role="group" aria-labelledby="review"><title id="review">Fitness evidence and role review</title><rect class="shadow" x="1304" y="224" width="242" height="230" rx="18"/><rect class="panel blush" x="1294" y="214" width="242" height="230" rx="18"/><text class="eyebrow" x="1318" y="248">05 · REVIEW + CORRECT</text><text class="section" x="1318" y="286">Fitness evidence</text><text class="section" x="1318" y="312">and role review</text><text class="body" x="1318" y="350">Claim · conditions · tolerance</text><text class="body" x="1318" y="374">Reviewer · authority · rationale</text><text class="body" x="1318" y="398">Correction · new version</text><text class="body" x="1318" y="422">Reuse or renewed inquiry</text></g>
  <g role="group" aria-labelledby="branches"><title id="branches">Five representation families</title><text class="eyebrow" x="54" y="512">REPRESENTATION FAMILIES · SELECT THE SMALLEST VIEW THAT FITS THE DECISION</text><path class="branch" d="M1094 454V500H190V546M1094 500H1416V546M492 500V546M794 500V546M1094 500V546" aria-hidden="true"/>
    <rect class="panel powder" x="54" y="546" width="268" height="172" rx="14"/><text class="eyebrow" x="76" y="578">MEASURE</text><text class="card-title" x="76" y="610">Metric geometry</text><text class="body" x="76" y="640">Units, reference method,</text><text class="body" x="76" y="662">tolerance, and repeatability.</text>
    <rect class="panel sea" x="340" y="546" width="268" height="172" rx="14"/><text class="eyebrow" x="362" y="578">REVISIT</text><text class="card-title" x="362" y="610">Photorealistic view</text><text class="body" x="362" y="640">Coverage, viewpoint, blind</text><text class="body" x="362" y="662">spots, review, and latency.</text>
    <rect class="panel cream" x="626" y="546" width="268" height="172" rx="14"/><text class="eyebrow" x="648" y="578">EDIT</text><text class="card-title" x="648" y="610">Scene asset</text><text class="body" x="648" y="640">Hierarchy, materials, variants,</text><text class="body" x="648" y="662">interchange, and tool tests.</text>
    <rect class="panel pale" x="912" y="546" width="268" height="172" rx="14"/><text class="eyebrow" x="934" y="578">HAND OFF</text><text class="card-title" x="934" y="610">Annotated preview</text><text class="body" x="934" y="640">Fast access, annotation,</text><text class="body" x="934" y="662">destination, and correction.</text>
    <rect class="panel blush" x="1198" y="546" width="338" height="172" rx="14"/><text class="eyebrow" x="1220" y="578">COMPARE</text><text class="card-title" x="1220" y="610">Registered change evidence</text><text class="body" x="1220" y="640">Alignment, time, provenance,</text><text class="body" x="1220" y="662">change review, and supersession.</text>
  </g>
  <g role="group" aria-labelledby="memory"><title id="memory">Collaborative memory</title><rect class="cobalt" x="54" y="764" width="1482" height="106" rx="16"/><text class="mono-on" x="80" y="798">COLLABORATIVE MEMORY</text><text class="title" x="80" y="835" style="font-size:24px">Source, transformation, fitness, rights, review, and correction remain reachable from the representation.</text><path class="return-flow" d="M1410 888C1290 976 310 976 176 892" aria-hidden="true"/><text class="eyebrow" x="586" y="946">REUSE OR RENEWED INQUIRY RETURNS TO THE RECURRING JOB</text></g>
  <rect class="panel" x="54" y="970" width="1482" height="30" rx="8"/><text class="mono" x="72" y="990">REFERENCE ARCHITECTURE · local device, scene, rights, toolchain, and task evidence establish production fitness</text>
</svg>
