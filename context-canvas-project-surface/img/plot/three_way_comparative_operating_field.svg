<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="comparative-title comparative-desc">
  <title id="comparative-title">Three systems make shared objects actionable through different agreements</title>
  <desc id="comparative-desc">A three-column operating comparison keeps Humatics, Who To Believe, and FMI clinical-trial coordination in their own vocabularies. Five aligned axes compare the shared object and naming authority, the disagreement surface, the decision and changed work, the people and sustained investment, and the return motion.</desc>
  <defs>
    <pattern id="comparative-grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#2855f3" stroke-opacity=".075" stroke-width="1"/>
    </pattern>
    <style>
      .field{fill:#fffaf2}.panel{fill:#fffdf8}.cream{fill:#fff5de}.powder{fill:#cfe7f7}.sea{fill:#d9efea}.blush{fill:#ffd3d0}.pale{fill:#e7efff}.acid{fill:#f2ff67}.cobalt{fill:#2855f3}.deep{fill:#153fbe}.ink-fill{fill:#17345f}.shadow{fill:#17345f}.outline{stroke:#17345f;stroke-width:2;fill:none}.soft-outline{stroke:#17345f;stroke-width:1.35}.hairline{stroke:#7890b2;stroke-width:1}.title{font:700 34px/1.1 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#fffdf8}.subtitle{font:500 16px/1.35 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#dbe5ff}.family{font:750 18px/1.2 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#fffdf8}.axis-title{font:750 15px/1.2 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#17345f}.body{font:500 13.5px/1.42 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#304a71}.strong{font:700 16px/1.2 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#17345f}.micro{font:750 11px/1.2 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:1.15px;fill:#153fbe}.micro-on{font:750 11px/1.2 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:1.15px;fill:#fffdf8}.return-label{font:750 12px/1.2 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.6px;fill:#17345f}
    </style>
  </defs>

  <g aria-hidden="true">
    <rect class="field" x="18" y="18" width="1564" height="1084"/>
    <rect x="18" y="18" width="1564" height="1084" fill="url(#comparative-grid)"/>
    <rect class="cobalt" x="18" y="18" width="1564" height="142"/>
    <rect x="18" y="18" width="1564" height="142" fill="url(#comparative-grid)" opacity=".9"/>
  </g>
  <rect class="outline" x="18" y="18" width="1564" height="1084" rx="28"/>

  <g role="group" aria-labelledby="comparative-heading">
    <title id="comparative-heading">Comparative five-axis reading</title>
    <text class="micro-on" x="54" y="53">THREE-WAY COMPARATIVE · SHARED OBJECTS AND DECISION OWNERSHIP</text>
    <text class="title" x="54" y="98">Three systems make shared objects actionable through different agreements</text>
    <text class="subtitle" x="54" y="129">Equal axes preserve each case’s vocabulary, operating cost, affected populations, and return motion.</text>
  </g>

  <g role="group" aria-labelledby="humatics-comparison-title">
    <title id="humatics-comparison-title">Humatics comparative column</title>
    <rect class="shadow" x="62" y="222" width="468" height="820" rx="18"/>
    <rect class="cream soft-outline" x="54" y="214" width="468" height="820" rx="18"/>
    <rect class="deep" x="56" y="216" width="464" height="52" rx="16"/>
    <text class="family" x="76" y="249">Humatics · industrial microlocation</text>

    <rect class="panel soft-outline" x="72" y="286" width="432" height="136" rx="11"/>
    <text class="micro" x="92" y="311">01 · SHARED OBJECT + NAMING</text>
    <text class="strong" x="92" y="340">The site operating model</text>
    <text class="body" x="92" y="365"><tspan x="92">Product, field, design, and customer teams</tspan><tspan x="92" dy="20">named client · site · installation · beacon · zone</tspan><tspan x="92" dy="20">from the work each population carried.</tspan></text>

    <rect class="powder soft-outline" x="72" y="434" width="432" height="136" rx="11"/>
    <text class="micro" x="92" y="459">02 · DISAGREEMENT SURFACE</text>
    <text class="strong" x="92" y="488">Meeting</text>
    <text class="body" x="92" y="513"><tspan x="92">The first presentation could not explain how sites,</tspan><tspan x="92" dy="20">Field Installation Engineer views, and handoff</tspan><tspan x="92" dy="20">fit together as one product.</tspan></text>

    <rect class="sea soft-outline" x="72" y="582" width="432" height="136" rx="11"/>
    <text class="micro" x="92" y="607">03 · DECISION + CHANGED WORK</text>
    <text class="body" x="92" y="637"><tspan x="92">The product manager’s question met the PRD concern</tspan><tspan x="92" dy="20">map and field constraints. Five working postures</tspan><tspan x="92" dy="20">became entrances into one shared site hierarchy.</tspan></text>

    <rect class="blush soft-outline" x="72" y="730" width="432" height="136" rx="11"/>
    <text class="micro" x="92" y="755">04 · COST TO PEOPLE + INVESTMENT</text>
    <text class="body" x="92" y="785"><tspan x="92">~20-person agency context; failed first presentation;</tspan><tspan x="92" dy="20">two-day reframing + PM-mediated field inquiry;</tspan><tspan x="92" dy="20">continuing cross-functional stewardship.</tspan></text>

    <rect class="acid soft-outline" x="72" y="878" width="432" height="136" rx="11"/>
    <text class="micro" x="92" y="903">05 · RETURN MOTION</text>
    <text class="return-label" x="92" y="932">QUESTION</text>
    <path class="deep" aria-hidden="true" d="M166 922h36v-7l18 13-18 13v-7h-36z"/>
    <text class="return-label" x="232" y="932">OPERATING MODEL</text>
    <text class="body" x="92" y="961"><tspan x="92">Within two days, the site-and-field question</tspan><tspan x="92" dy="20">returned as an inspectable architecture.</tspan></text>
  </g>

  <g role="group" aria-labelledby="wtb-comparison-title">
    <title id="wtb-comparison-title">Who To Believe comparative column</title>
    <rect class="shadow" x="574" y="222" width="468" height="820" rx="18"/>
    <rect class="pale soft-outline" x="566" y="214" width="468" height="820" rx="18"/>
    <rect class="cobalt" x="568" y="216" width="464" height="52" rx="16"/>
    <text class="family" x="588" y="249">Who To Believe · reviews platform</text>

    <rect class="panel soft-outline" x="584" y="286" width="432" height="136" rx="11"/>
    <text class="micro" x="604" y="311">01 · SHARED OBJECT + NAMING</text>
    <text class="strong" x="604" y="340">A contribution in campaign context</text>
    <text class="body" x="604" y="365"><tspan x="604">Participants supplied lived context; clients defined</tspan><tspan x="604" dy="20">campaign fit; qualified reviewers owned consequential</tspan><tspan x="604" dy="20">disposition.</tspan></text>

    <rect class="powder soft-outline" x="584" y="434" width="432" height="136" rx="11"/>
    <text class="micro" x="604" y="459">02 · DISAGREEMENT SURFACE</text>
    <text class="strong" x="604" y="488">Metric</text>
    <text class="body" x="604" y="513"><tspan x="604">Response volume and channel activity could represent</tspan><tspan x="604" dy="20">useful influence, roster misfit, or recovery from a</tspan><tspan x="604" dy="20">broken product route.</tspan></text>

    <rect class="sea soft-outline" x="584" y="582" width="432" height="136" rx="11"/>
    <text class="micro" x="604" y="607">03 · DECISION + CHANGED WORK</text>
    <text class="body" x="604" y="637"><tspan x="604">Three voice tiers and transition history focused</tspan><tspan x="604" dy="20">qualified review where context changed the decision.</tspan><tspan x="604" dy="20">Broad suspicion became reasoned attention.</tspan></text>

    <rect class="blush soft-outline" x="584" y="730" width="432" height="136" rx="11"/>
    <text class="micro" x="604" y="755">04 · COST TO PEOPLE + INVESTMENT</text>
    <text class="body" x="604" y="785"><tspan x="604">~250 reviewers; ~2 additional hours per case;</tspan><tspan x="604" dy="20">reconstructed $1.3–2.1M under remembered scale;</tspan><tspan x="604" dy="20">modernization, safety, migration, delayed features.</tspan></text>

    <rect class="acid soft-outline" x="584" y="878" width="432" height="136" rx="11"/>
    <text class="micro" x="604" y="903">05 · RETURN MOTION</text>
    <text class="return-label" x="604" y="932">COMPROMISE</text>
    <path class="deep" aria-hidden="true" d="M698 922h36v-7l18 13-18 13v-7h-36z"/>
    <text class="return-label" x="764" y="932">INTERFACE SYMPTOM</text>
    <text class="body" x="604" y="961"><tspan x="604">The navigation symptom returned more than a year</tspan><tspan x="604" dy="20">after acquisition; two accounts preserve different</tspan><tspan x="604" dy="20">paths and leave the exact trigger open.</tspan></text>
  </g>

  <g role="group" aria-labelledby="fmi-comparison-title">
    <title id="fmi-comparison-title">FMI clinical-trial coordination comparative column</title>
    <rect class="shadow" x="1086" y="222" width="468" height="820" rx="18"/>
    <rect class="sea soft-outline" x="1078" y="214" width="468" height="820" rx="18"/>
    <rect class="deep" x="1080" y="216" width="464" height="52" rx="16"/>
    <text class="family" x="1100" y="249">FMI · clinical-trial coordination</text>

    <rect class="panel soft-outline" x="1096" y="286" width="432" height="136" rx="11"/>
    <text class="micro" x="1116" y="311">01 · SHARED OBJECT + NAMING</text>
    <text class="strong" x="1116" y="340">The partner-study rule grammar</text>
    <text class="body" x="1116" y="365"><tspan x="1116">Partners brought fields; Data Managers mapped work;</tspan><tspan x="1116" dy="20">genomics, engineering, and quality constrained how</tspan><tspan x="1116" dy="20">the grammar could be used.</tspan></text>

    <rect class="powder soft-outline" x="1096" y="434" width="432" height="136" rx="11"/>
    <text class="micro" x="1116" y="459">02 · DISAGREEMENT SURFACE</text>
    <text class="strong" x="1116" y="488">Query result</text>
    <text class="body" x="1116" y="513"><tspan x="1116">Partner intent crossed field variants, cohort rules,</tspan><tspan x="1116" dy="20">and scientific queries the existing schema could not</tspan><tspan x="1116" dy="20">hold together.</tspan></text>

    <rect class="cream soft-outline" x="1096" y="582" width="432" height="136" rx="11"/>
    <text class="micro" x="1116" y="607">03 · DECISION + CHANGED WORK</text>
    <text class="body" x="1116" y="637"><tspan x="1116">Alignment separated time, objects, and rules; Boolean</tspan><tspan x="1116" dy="20">cards made transformation explicit. Tacit selector work</tspan><tspan x="1116" dy="20">became inspectable setup and qualified review.</tspan></text>

    <rect class="blush soft-outline" x="1096" y="730" width="432" height="136" rx="11"/>
    <text class="micro" x="1116" y="755">04 · COST TO PEOPLE + INVESTMENT</text>
    <text class="body" x="1116" y="785"><tspan x="1116">Data Managers carried full-time shape-matching;</tspan><tspan x="1116" dy="20">directors spent &gt;1 hour on three worksheet blanks;</tspan><tspan x="1116" dy="20">first system built in roughly one quarter.</tspan></text>

    <rect class="acid soft-outline" x="1096" y="878" width="432" height="136" rx="11"/>
    <text class="micro" x="1116" y="903">05 · RETURN MOTION</text>
    <text class="return-label" x="1116" y="932">PHRASE</text>
    <path class="deep" aria-hidden="true" d="M1172 922h36v-7l18 13-18 13v-7h-36z"/>
    <text class="return-label" x="1238" y="932">SUBSTRATE RECOGNITION</text>
    <text class="body" x="1116" y="961"><tspan x="1116">The 2019 snowflake phrase returned in Q2 2023</tspan><tspan x="1116" dy="20">and opened the auto-populate question.</tspan></text>
  </g>

  <text class="micro" x="800" y="1080" text-anchor="middle">EQUAL AXES PRESERVE THREE LOCAL OPERATING GRAMMARS</text>
</svg>
