<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="cycle-title cycle-desc">
  <title id="cycle-title">Cross-platform collaboration turn</title>
  <desc id="cycle-desc">Seven connected moves form a collaboration turn: Orient, Propose, Comment, Resolve, Propagate and verify, Version, then Orient again. The center identifies an append-only decision payload as the durable decision record. A lower matrix distinguishes contextual discussion, the decision payload, page history, and the compact machine-readable threadkeeping directory.</desc>
  <defs><pattern id="cycle-grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#cfe7f7" stroke-opacity=".42"/><circle cx="0" cy="0" r="1.4" fill="#f1b88e" fill-opacity=".26"/></pattern><filter id="cycle-shadow" x="-14%" y="-20%" width="128%" height="150%"><feDropShadow dx="0" dy="7" stdDeviation="6" flood-color="#071a35" flood-opacity=".29"/></filter><style>.sans{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.mono{font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace}.eyebrow{font-size:14px;font-weight:800;letter-spacing:1.8px}.title{font-size:39px;font-weight:820;letter-spacing:-.8px}.lead{font-size:17px;font-weight:620}.lane{font-size:15px;font-weight:850;letter-spacing:1.2px}.kicker{font-size:12px;font-weight:850;letter-spacing:1px}.card{font-size:15px;font-weight:760}.copy{font-size:14px;font-weight:620}.micro{font-size:12px;font-weight:680}.ink{fill:#17345f}.body{fill:#304a71}.white{fill:#fffdf8}.muted{fill:#5d6f8b}</style></defs>
  <rect width="1600" height="1120" fill="#fffaf2"/><rect x="28" y="28" width="1544" height="1064" rx="28" fill="#17345f"/><rect x="20" y="20" width="1544" height="1064" rx="28" fill="#fffdf8" stroke="#17345f" stroke-width="2"/><rect x="21" y="21" width="1542" height="1062" rx="27" fill="url(#cycle-grid)"/>
  <path d="M20 48Q20 20 48 20H1536Q1564 20 1564 48V176H20Z" fill="#2855f3"/><text x="56" y="57" class="mono eyebrow white">CROSS-PLATFORM COLLABORATION CYCLE · TURN PROTOCOL</text><text x="56" y="105" class="sans title white">Make the turn visible when collaborators have different access</text><text x="56" y="141" class="sans lead white">Identity, rationale, dependencies, and acceptance remain legible across differing tool access.</text>
  <rect x="1260" y="48" width="254" height="88" rx="14" fill="#fffdf8" stroke="#17345f" stroke-width="2"/><text x="1282" y="78" class="mono kicker ink">CURRENT CONTRACT</text><text x="1282" y="104" class="sans copy body">Comments contextual;</text><text x="1282" y="124" class="sans copy body">decision payload durable</text>
  <g id="turn" role="group" aria-labelledby="turn-title"><title id="turn-title">Seven-move collaboration turn</title><text x="56" y="220" class="mono lane ink">ONE COMPLETE TURN · ORIENT → VERSION → ORIENT</text>
    <path d="M358 317C470 224 588 200 698 230" fill="none" stroke="#2855f3" stroke-width="7"/><path d="M689 217L722 238L683 244Z" fill="#2855f3"/>
    <path d="M920 236C1054 200 1178 236 1254 314" fill="none" stroke="#2855f3" stroke-width="7"/><path d="M1242 302L1274 332L1234 323Z" fill="#2855f3"/>
    <path d="M1362 434C1378 536 1322 625 1234 658" fill="none" stroke="#2855f3" stroke-width="7"/><path d="M1240 644L1208 670L1248 672Z" fill="#2855f3"/>
    <path d="M1064 692C972 744 858 754 774 728" fill="none" stroke="#2855f3" stroke-width="7"/><path d="M783 716L748 720L778 742Z" fill="#2855f3"/>
    <path d="M594 722C486 752 372 710 322 642" fill="none" stroke="#2855f3" stroke-width="7"/><path d="M336 637L302 618L318 655Z" fill="#2855f3"/>
    <path d="M246 524C202 446 222 367 278 332" fill="none" stroke="#2855f3" stroke-width="7"/><path d="M268 344L302 317L262 318Z" fill="#2855f3"/>
    <g filter="url(#cycle-shadow)">
      <rect x="56" y="278" width="302" height="146" rx="15" fill="#d9efea" stroke="#17345f" stroke-width="2"/><circle cx="84" cy="306" r="15" fill="#17345f"/><text x="84" y="311" text-anchor="middle" class="mono kicker white">1</text><text x="111" y="310" class="sans card ink">Orient</text><text x="82" y="350" class="sans copy body"><tspan x="82">Canonical title + link; stable UUID;</tspan><tspan x="82" dy="22">manifest and threadkeeping state.</tspan></text>
      <rect x="618" y="198" width="302" height="146" rx="15" fill="#cfe7f7" stroke="#17345f" stroke-width="2"/><circle cx="646" cy="226" r="15" fill="#17345f"/><text x="646" y="231" text-anchor="middle" class="mono kicker white">2</text><text x="673" y="230" class="sans card ink">Propose</text><text x="644" y="270" class="sans copy body"><tspan x="644">State the change, affected objects,</tspan><tspan x="644" dy="22">decision owner, and intended return.</tspan></text>
      <rect x="1242" y="288" width="302" height="146" rx="15" fill="#e7efff" stroke="#17345f" stroke-width="2"/><circle cx="1270" cy="316" r="15" fill="#17345f"/><text x="1270" y="321" text-anchor="middle" class="mono kicker white">3</text><text x="1297" y="320" class="sans card ink">Comment</text><text x="1268" y="360" class="sans copy body"><tspan x="1268">Add reasoning, alternatives, and</tspan><tspan x="1268" dy="22">candidate structured payload.</tspan></text>
      <rect x="1120" y="620" width="302" height="146" rx="15" fill="#fff5de" stroke="#17345f" stroke-width="2"/><circle cx="1148" cy="648" r="15" fill="#17345f"/><text x="1148" y="653" text-anchor="middle" class="mono kicker white">4</text><text x="1175" y="652" class="sans card ink">Resolve</text><text x="1146" y="692" class="sans copy body"><tspan x="1146">Append the durable decision payload:</tspan><tspan x="1146" dy="22">decision, rationale, dependencies.</tspan></text>
      <rect x="656" y="684" width="350" height="146" rx="15" fill="#ffd3d0" stroke="#17345f" stroke-width="2"/><circle cx="684" cy="712" r="15" fill="#17345f"/><text x="684" y="717" text-anchor="middle" class="mono kicker white">5</text><text x="711" y="716" class="sans card ink">Propagate + verify</text><text x="682" y="756" class="sans copy body"><tspan x="682">Update dependents in the same cycle;</tspan><tspan x="682" dy="22">run the named acceptance checks.</tspan></text>
      <rect x="206" y="610" width="302" height="146" rx="15" fill="#f2ff67" stroke="#17345f" stroke-width="2"/><circle cx="234" cy="638" r="15" fill="#17345f"/><text x="234" y="643" text-anchor="middle" class="mono kicker white">6</text><text x="261" y="642" class="sans card ink">Version</text><text x="232" y="682" class="sans copy body"><tspan x="232">Apply SemVer and record the verified</tspan><tspan x="232" dy="22">surface, dependencies, and receipt.</tspan></text>
      <rect x="558" y="388" width="472" height="210" rx="22" fill="#17345f" stroke="#fffdf8" stroke-width="3"/><rect x="580" y="410" width="198" height="30" rx="15" fill="#f2ff67"/><text x="679" y="430" text-anchor="middle" class="mono kicker ink">DURABLE DECISION RECORD</text><text x="594" y="476" class="sans card white">Append-only decision payload</text><text x="594" y="512" class="sans copy" fill="#cfe7f7"><tspan x="594">Resolved state · rationale · affected identities</tspan><tspan x="594" dy="22">dependencies · acceptance · next orientation</tspan></text><text x="594" y="568" class="mono micro" fill="#f1b88e">QUIET LEDGER · CURRENT DURABLE PAYLOAD</text>
    </g>
  </g>
  <g id="surfaces" role="group" aria-labelledby="surfaces-title"><title id="surfaces-title">Four collaboration record surfaces</title>
    <rect x="56" y="864" width="1488" height="184" rx="18" fill="#17345f"/><text x="82" y="901" class="mono lane" fill="#f2ff67">SURFACES · EACH HAS A DIFFERENT JOB</text>
    <g class="sans"><rect x="82" y="923" width="338" height="96" rx="12" fill="#d9efea"/><text x="104" y="952" class="card ink">Comment / discussion</text><text x="104" y="978" class="copy body"><tspan x="104">Contextual reasoning and alternatives;</tspan><tspan x="104" dy="20">supports interpretation of the decision.</tspan></text>
    <rect x="440" y="923" width="338" height="96" rx="12" fill="#fff5de"/><text x="462" y="952" class="card ink">Decision payload</text><text x="462" y="978" class="copy body"><tspan x="462">Append-only durable decision semantics,</tspan><tspan x="462" dy="20">rationale, dependencies, and acceptance.</tspan></text>
    <rect x="798" y="923" width="338" height="96" rx="12" fill="#e7efff"/><text x="820" y="952" class="card ink">Page history</text><text x="820" y="978" class="copy body"><tspan x="820">Durable content versions; decision</tspan><tspan x="820" dy="20">meaning travels in the payload.</tspan></text>
    <rect x="1156" y="923" width="360" height="96" rx="12" fill="#ffd3d0"/><text x="1178" y="952" class="card ink">threadkeeping/</text><text x="1178" y="978" class="copy body"><tspan x="1178">Compact machine-readable state for</tspan><tspan x="1178" dy="20">repository handoff and re-entry.</tspan></text></g>
  </g>
</svg>
