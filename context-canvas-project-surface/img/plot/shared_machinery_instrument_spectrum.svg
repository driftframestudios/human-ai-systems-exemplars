<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040" role="img" aria-labelledby="title desc">
  <title id="title">Shared Machinery instrument spectrum</title>
  <desc id="desc">A shared receiving object stays fixed while four masked scenes cycle through an investment frame, source-native reading forms, a work lifecycle, and a recovery route. Reduced-motion and print views hold on the investment frame.</desc>
  <defs>
    <clipPath id="scene-window"><rect x="92" y="244" width="1416" height="590" rx="28"/></clipPath>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#2855f3" stroke-opacity=".08"/></pattern>
  </defs>
  <style>
    .bg{fill:#fffdf7}.ink{fill:#16345e}.cobalt{fill:#2855f3}.sea{fill:#bfe7e4}.powder{fill:#dbe9ff}.rose{fill:#ffd3d0}.lime{fill:#efff66}.cream{fill:#fff0cf}.rule{stroke:#16345e;stroke-width:5}.path{stroke:#2855f3;stroke-width:7;fill:none}.dash{stroke:#16345e;stroke-width:4;stroke-dasharray:14 11}.cap{font:700 25px ui-monospace,monospace;letter-spacing:1.3px}.head{font:700 44px Arial,sans-serif}.body{font:26px Arial,sans-serif}.small{font:22px Arial,sans-serif}.scene{opacity:0;animation:spectrum 16s infinite}.scene-b{animation-delay:4s}.scene-c{animation-delay:8s}.scene-d{animation-delay:12s}@keyframes spectrum{0%,20%{opacity:1}25%,95%{opacity:0}100%{opacity:1}}@media(prefers-reduced-motion:reduce){.scene{animation:none}.scene-a{opacity:1}.scene-b,.scene-c,.scene-d{display:none}}@media print{.scene{animation:none}.scene-a{opacity:1}.scene-b,.scene-c,.scene-d{display:none}}
  </style>
  <rect width="1600" height="1040" class="bg"/><rect width="1600" height="1040" fill="url(#grid)"/>
  <rect x="48" y="46" width="1504" height="154" rx="28" class="cobalt rule"/><text x="92" y="104" class="cap" fill="#fff">SHARED MACHINERY · COMPLETE INSTRUMENT COLLECTION</text><text x="92" y="162" class="head" fill="#fff">One receiving object, several decision shapes</text>
  <g clip-path="url(#scene-window)">
    <g class="scene scene-a"><rect x="92" y="244" width="1416" height="590" class="powder"/><text x="132" y="306" class="cap ink">FRAME THE INVESTMENT</text><g class="rule"><rect x="132" y="354" width="302" height="246" rx="20" class="sea"/><rect x="466" y="354" width="302" height="246" rx="20" class="lime"/><rect x="800" y="354" width="302" height="246" rx="20" class="cream"/><rect x="1134" y="354" width="334" height="246" rx="20" class="rose"/></g><text x="168" y="420" class="head ink">Purpose</text><text x="502" y="420" class="head ink">Objectives</text><text x="836" y="420" class="head ink">Discoverables</text><text x="1170" y="420" class="head ink">Activities</text><path d="M434 510H466M768 510H800M1102 510H1134" class="path"/><text x="132" y="708" class="body ink">Carry the cross-functional ask from intention to inspectable learning and the work that can surface it.</text></g>
    <g class="scene scene-b"><rect x="92" y="244" width="1416" height="590" class="sea"/><text x="132" y="306" class="cap ink">CHOOSE A SOURCE-NATIVE FORM</text><g class="rule"><rect x="132" y="350" width="392" height="330" rx="22" class="bg"/><rect x="604" y="350" width="392" height="330" rx="22" class="cream"/><rect x="1076" y="350" width="392" height="330" rx="22" class="rose"/></g><text x="172" y="410" class="head ink">Compact</text><path d="M172 456H484M172 510H436M172 564H464" class="dash"/><text x="644" y="410" class="head ink">Dual-track</text><path d="M644 456H956M800 456V634" class="dash"/><text x="1116" y="410" class="head ink">Temporal</text><path d="M1116 532H1428" class="path"/><circle cx="1168" cy="532" r="15" class="cobalt"/><circle cx="1272" cy="532" r="15" class="cobalt"/><circle cx="1380" cy="532" r="15" class="cobalt"/><text x="132" y="746" class="body ink">Preserve story, time, comparison, architecture, and close in the smallest form that can carry them.</text></g>
    <g class="scene scene-c"><rect x="92" y="244" width="1416" height="590" class="cream"/><text x="132" y="306" class="cap ink">KEEP WORK RESUMABLE</text><path d="M254 520H1350" class="path"/><path d="M1350 520l-34-22v44z" class="cobalt"/><g class="rule"><circle cx="280" cy="520" r="94" class="sea"/><circle cx="620" cy="520" r="94" class="lime"/><circle cx="960" cy="520" r="94" class="rose"/><circle cx="1300" cy="520" r="94" class="powder"/></g><text x="280" y="512" text-anchor="middle" class="cap ink">GROW</text><text x="280" y="548" text-anchor="middle" class="small ink">stable identity</text><text x="620" y="512" text-anchor="middle" class="cap ink">PLACE</text><text x="620" y="548" text-anchor="middle" class="small ink">named home</text><text x="960" y="512" text-anchor="middle" class="cap ink">REST</text><text x="960" y="548" text-anchor="middle" class="small ink">return trigger</text><text x="1300" y="512" text-anchor="middle" class="cap ink">CARRY</text><text x="1300" y="548" text-anchor="middle" class="small ink">decision payload</text><text x="132" y="742" class="body ink">Stable names, conditions, and receipts let work change state and retain its next useful route.</text></g>
    <g class="scene scene-d"><rect x="92" y="244" width="1416" height="590" class="rose"/><text x="132" y="306" class="cap ink">RECOVER THE FITTING LAYER</text><g class="rule"><rect x="132" y="380" width="286" height="180" rx="22" class="bg"/><rect x="486" y="380" width="286" height="180" rx="22" class="cream"/><rect x="840" y="380" width="286" height="180" rx="22" class="lime"/><rect x="1194" y="380" width="274" height="180" rx="22" class="cobalt"/></g><text x="168" y="434" class="cap ink">STRAIN CUE</text><text x="168" y="484" class="body ink">look here</text><text x="522" y="434" class="cap ink">SOUND POSITION</text><text x="522" y="484" class="body ink">preserve</text><text x="876" y="434" class="cap ink">SMALLEST REPAIR</text><text x="876" y="484" class="body ink">verify</text><text x="1230" y="434" class="cap" fill="#fff">RE-ENTRY</text><text x="1230" y="484" class="body" fill="#fff">carry receipt</text><path d="M418 470H486M772 470H840M1126 470H1194" class="path"/><text x="132" y="714" class="body ink">Name the affected object, keep valid work, repair the strained layer, and return with an accountable reader.</text></g>
  </g>
  <rect x="208" y="876" width="1184" height="116" rx="24" class="ink rule"/><text x="800" y="924" text-anchor="middle" class="cap" fill="#fff">SHARED RECEIVING OBJECT</text><text x="800" y="966" text-anchor="middle" class="body" fill="#fff">A reading, decision, or artifact that remains usable as it travels</text>
</svg>
