<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1120" role="img" aria-labelledby="resolver-title resolver-desc">
  <title id="resolver-title">The Core Architectures Orientation Index resolves a work strain to the smallest adequate architecture</title>
  <desc id="resolver-desc">A central resolver connects a visitor-useful question to seven cognitive-move families and twenty named architectures, then to a bounded next surface, a material decision, and a route back when new evidence changes the frame.</desc>
  <defs>
    <pattern id="resolver-grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#2855f3" stroke-width="1" opacity="0.08"/></pattern>
    <style>
      .sans{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}.mono{font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace}.ink{fill:#17345f}.body{fill:#304a71}.muted{fill:#5d6f8b}.white{fill:#fffdf8}.eyebrow{font-size:13px;font-weight:700;letter-spacing:1.8px}.title{font-size:35px;font-weight:780}.lead{font-size:17px}.family-title{font-size:16px;font-weight:760}.card-copy{font-size:13px}.small{font-size:12px}.chip{font-size:11px;font-weight:700;letter-spacing:.6px}.outline{stroke:#17345f;stroke-width:2}.soft{stroke:#6f85a8;stroke-width:1.3}.shadow{fill:#17345f}.arrow{fill:#2855f3}.route{fill:none;stroke:#2855f3;stroke-width:3}.dash{fill:none;stroke:#5d6f8b;stroke-width:2;stroke-dasharray:8 8}
    </style>
  </defs>
  <rect width="1600" height="1120" rx="28" fill="#fffaf2"/>
  <rect width="1600" height="1120" rx="28" fill="url(#resolver-grid)"/>

  <g role="group" aria-labelledby="resolver-header-title">
    <title id="resolver-header-title">Resolver purpose</title>
    <rect x="32" y="30" width="1536" height="154" rx="20" fill="#2855f3"/>
    <text x="72" y="72" class="mono eyebrow white">CORE ARCHITECTURES · 7 FAMILIES · 20 ARCHITECTURES</text>
    <text x="72" y="120" class="sans title white">Enter through the cognitive move the work needs now.</text>
    <text x="72" y="154" class="sans lead white">The index is a front door: find the smallest adequate surface, make one decision inspectable, and return when evidence changes the frame.</text>
  </g>

  <g role="group" aria-labelledby="resolver-question-title">
    <title id="resolver-question-title">Starting question</title>
    <rect x="56" y="232" width="1488" height="112" rx="17" fill="#fffdf8" class="outline"/>
    <rect x="80" y="256" width="230" height="64" rx="12" fill="#f2ff67" class="soft"/>
    <text x="102" y="282" class="mono chip ink">START WITH THE STRAIN</text>
    <text x="102" y="306" class="sans card-copy ink">What needs to become visible?</text>
    <path d="M334 270H386V252L424 288L386 324V306H334Z" class="arrow" aria-hidden="true"/>
    <text x="454" y="276" class="sans family-title ink">Name the missing cognitive move before choosing a canvas, workshop, prototype, or system form.</text>
    <text x="454" y="309" class="sans card-copy body">Orientation · comparison · topology · elicitation · measurement · behavior protection · recovery</text>
  </g>

  <g role="group" aria-labelledby="resolver-families-title">
    <title id="resolver-families-title">Seven cognitive-move families</title>
    <rect x="64" y="398" width="358" height="186" rx="17" class="shadow"/><rect x="56" y="390" width="358" height="186" rx="17" fill="#fff5de" class="outline"/>
    <text x="80" y="425" class="mono chip ink">01 · ORIENTATION + TRACING</text>
    <text x="80" y="456" class="sans family-title ink">Align the field and follow impact.</text>
    <text x="80" y="490" class="sans card-copy body">PODA · Alignment Worksheet</text><text x="80" y="514" class="sans card-copy body">Impact Map · Context Tree</text>
    <text x="80" y="548" class="mono small muted">ENTRY · WHAT ARE WE ORIENTING?</text>

    <rect x="450" y="398" width="358" height="186" rx="17" class="shadow"/><rect x="442" y="390" width="358" height="186" rx="17" fill="#e7efff" class="outline"/>
    <text x="466" y="425" class="mono chip ink">02 · COMPARISON + THRESHOLD</text>
    <text x="466" y="450" class="sans family-title ink"><tspan x="466">Shape options and</tspan><tspan x="466" dy="21">a responsible edge.</tspan></text>
    <text x="466" y="500" class="sans card-copy body">Strategy Canvas</text><text x="466" y="524" class="sans card-copy body">First Responsible Version Matrix</text>
    <text x="466" y="548" class="mono small muted">ENTRY · WHAT CLEARS THE BAR?</text>

    <rect x="836" y="398" width="358" height="210" rx="17" class="shadow"/><rect x="828" y="390" width="358" height="210" rx="17" fill="#d9efea" class="outline"/>
    <text x="852" y="425" class="mono chip ink">03 · SHARED SURFACES + TOPOLOGY</text>
    <text x="852" y="450" class="sans family-title ink"><tspan x="852">Expose actors, channels,</tspan><tspan x="852" dy="21">and boundaries.</tspan></text>
    <text x="852" y="500" class="sans card-copy body">Shared Surface Priority Map</text><text x="852" y="522" class="sans card-copy body">Service-design · AI Systems Blueprint</text><text x="852" y="544" class="sans card-copy body">Software Architecture Views</text>
    <text x="852" y="578" class="mono small muted">ENTRY · WHERE DOES WORK CONNECT?</text>

    <rect x="1222" y="398" width="330" height="186" rx="17" class="shadow"/><rect x="1214" y="390" width="330" height="186" rx="17" fill="#ffd3d0" class="outline"/>
    <text x="1238" y="425" class="mono chip ink">04 · ELICITATION + SPECIFICATION</text>
    <text x="1238" y="456" class="sans family-title ink">Externalize tacit work.</text>
    <text x="1238" y="490" class="sans card-copy body">Participatory Design Kit</text><text x="1238" y="514" class="sans card-copy body">Specification-by-Example</text>
    <text x="1238" y="548" class="mono small muted">ENTRY · WHAT MUST BE SHARED?</text>

    <rect x="160" y="636" width="390" height="186" rx="17" class="shadow"/><rect x="152" y="628" width="390" height="186" rx="17" fill="#cfe7f7" class="outline"/>
    <text x="176" y="663" class="mono chip ink">05 · MEASUREMENT + JUDGMENT</text>
    <text x="176" y="687" class="sans family-title ink"><tspan x="176">Translate outcomes</tspan><tspan x="176" dy="21">and interpret signals.</tspan></text>
    <text x="176" y="736" class="sans card-copy body">HEART Chart · Plus / Delta</text><text x="176" y="758" class="sans card-copy body">Practitioner Judgment Probes</text>
    <text x="176" y="786" class="mono small muted">ENTRY · WHAT CHANGED, FOR WHOM?</text>

    <rect x="606" y="636" width="390" height="186" rx="17" class="shadow"/><rect x="598" y="628" width="390" height="186" rx="17" fill="#fff5de" class="outline"/>
    <text x="622" y="663" class="mono chip ink">06 · PATTERN FIT + BEHAVIOR PROTECTION</text>
    <text x="622" y="687" class="sans family-title ink"><tspan x="622">Match recurring problems</tspan><tspan x="622" dy="21">to protected behavior.</tspan></text>
    <text x="622" y="736" class="sans card-copy body">Pattern–Problem Surface Matrix · JTBD Treemap</text><text x="622" y="758" class="sans card-copy body">Unit-test-first Design</text>
    <text x="622" y="786" class="mono small muted">ENTRY · WHAT MUST KEEP WORKING?</text>

    <rect x="1052" y="636" width="390" height="186" rx="17" class="shadow"/><rect x="1044" y="628" width="390" height="186" rx="17" fill="#f2ff67" class="outline"/>
    <text x="1068" y="663" class="mono chip ink">07 · RECOVERY ROUTING + REVISION</text>
    <text x="1068" y="694" class="sans family-title ink">Locate strain and re-enter upstream.</text>
    <text x="1068" y="728" class="sans card-copy body">Upstream Revision Loop</text><text x="1068" y="752" class="sans card-copy body">Recovery Routing Atlas</text>
    <text x="1068" y="786" class="mono small muted">ENTRY · WHERE SHOULD WE RETURN?</text>
  </g>

  <g role="group" aria-labelledby="resolver-output-title">
    <title id="resolver-output-title">Resolver output and return</title>
    <rect x="48" y="880" width="1504" height="184" rx="20" fill="#153fbe"/>
    <text x="80" y="920" class="mono eyebrow white">RESOLVER OUTPUT</text>
    <rect x="80" y="944" width="338" height="82" rx="12" fill="#fff5de" class="outline"/>
    <text x="102" y="974" class="mono chip ink">SMALLEST ADEQUATE SURFACE</text>
    <text x="102" y="1003" class="sans card-copy ink">One architecture with a bounded question.</text>
    <path d="M432 962H474V947L506 985L474 1023V1008H432Z" class="arrow" aria-hidden="true"/>
    <rect x="520" y="944" width="338" height="82" rx="12" fill="#cfe7f7" class="outline"/>
    <text x="542" y="974" class="mono chip ink">INSPECTABLE DECISION</text>
    <text x="542" y="1003" class="sans card-copy ink">Actors, inputs, boundary, and next move.</text>
    <path d="M872 962H914V947L946 985L914 1023V1008H872Z" class="arrow" aria-hidden="true"/>
    <rect x="960" y="944" width="338" height="82" rx="12" fill="#d9efea" class="outline"/>
    <text x="982" y="974" class="mono chip ink">CHANGED WORK</text>
    <text x="982" y="1003" class="sans card-copy ink">A clearer handoff, test, threshold, or route.</text>
    <path d="M1312 962H1354V947L1386 985L1354 1023V1008H1312Z" class="arrow" aria-hidden="true"/>
    <rect x="1400" y="944" width="112" height="82" rx="12" fill="#f2ff67" class="outline"/>
    <text x="1456" y="974" text-anchor="middle" class="mono chip ink">RETURN</text>
    <text x="1456" y="1003" text-anchor="middle" class="sans small ink">on evidence</text>
  </g>
</svg>
