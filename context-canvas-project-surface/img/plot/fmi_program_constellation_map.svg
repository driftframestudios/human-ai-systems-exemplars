    <rect class="panel" x="760" y="274" width="382" height="474" rx="17"/>
    <path class="deep-fill" d="M777 274h348a17 17 0 0 1 17 17v76H760v-76a17 17 0 0 1 17-17Z"/>
    <text class="mono-on" x="782" y="304">16 EXECUTABLE NORMAL / FAILURE / RECOVERY CASES</text>
    <text class="section-on" x="782" y="337">Specified outcomes become testable</text>
    <text class="subtitle" x="782" y="358" style="font-size:13px">Normal · failure · recovery · accountable roles</text>

    <rect class="card acid" x="782" y="386" width="338" height="74" rx="11"/>
    <text class="eyebrow" x="800" y="409">CORRECTION + CUSTODY</text>
    <text class="body-strong" x="800" y="433">Original remains visible · current position wins</text>
    <text class="body" x="800" y="451">Stable request identity converges on one effect.</text>

    <rect class="card sea" x="782" y="472" width="338" height="88" rx="11"/>
    <text class="eyebrow" x="800" y="495">VENDOR CONVERGENCE</text>
    <text class="body-strong" x="800" y="519">Sapio relationship readback · Benchling event</text>
    <text class="body-strong" x="800" y="538">reconciliation · LabKey atomic batch parity</text>
    <text class="body" x="800" y="556">Comparable after named-environment exercise.</text>

    <rect class="card blush" x="782" y="572" width="338" height="74" rx="11"/>
    <text class="eyebrow" x="800" y="595">INSTRUMENT INGRESS</text>
    <text class="body-strong" x="800" y="619">Partial artifact enters quarantine</text>
    <text class="body" x="800" y="637">Bytes, digest, and recovery owner stay linked.</text>

    <rect class="card pale" x="782" y="658" width="338" height="66" rx="11"/>
    <text class="eyebrow" x="800" y="681">MIGRATION + RUNTIME</text>
    <text class="body-strong" x="800" y="699">Meaning-preserving move · clean restore</text>
    <text class="body" x="800" y="717">Bounded credential rotation</text>
  </g>

  <path class="arrow-coral" aria-hidden="true" d="M1154 486H1162V472L1184 500L1162 528V514H1154Z"/>

  <g role="group" aria-labelledby="outcomes-title">
