<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="constellation-title constellation-desc">
  <title id="constellation-title">Shared laboratory objects become an executable enterprise contract</title>
  <desc id="constellation-desc">A source-separated constellation connects the historical FMI object grammar of sample, plate, reagent, run or worklist, and sign-off or approval to a separate vendor-neutral LIMS and ELN candidate specification. Candidate spec-v0.3.0 defines service-owned lifecycle, custody, instrument, vendor, migration, and approval boundaries; expresses normal, failure, and recovery expectations; and names the enterprise abilities and sustained ownership those contracts require. Its selected reality is closed in simulation, environment-observed acceptance remains open, and production authorization is environment-specific. A lower rail shows the repository surfaces and the source-backed technology boundaries.</desc>

  <defs>
    <pattern id="constellation-grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#2855f3" stroke-opacity=".055" stroke-width="1"/>
    </pattern>
  </defs>

  <style>
    .field { fill: #fffaf2; }
    .grid { fill: url(#constellation-grid); }
    .frame { fill: none; stroke: #17345f; stroke-width: 2; }
    .header { fill: #2855f3; }
    .panel { fill: #fffdf8; stroke: #17345f; stroke-width: 2; }
    .shadow { fill: #17345f; }
    .card { fill: #fffdf8; stroke: #7893bc; stroke-width: 1.5; }
    .powder { fill: #cfe7f7; }
    .sea { fill: #d9efea; }
    .cream { fill: #fff5de; }
    .pale { fill: #e7efff; }
    .blush { fill: #ffd3d0; }
    .acid { fill: #f2ff67; }
    .coral { fill: #fa7065; }
    .cobalt-fill { fill: #2855f3; }
    .deep-fill { fill: #153fbe; }
    .title { fill: #fffdf8; font: 750 35px/1.1 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .subtitle { fill: #e7efff; font: 500 15px/1.35 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .eyebrow-on { fill: #f2ff67; font: 750 12px/1.2 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; letter-spacing: 1.4px; }
    .eyebrow { fill: #5d6f8b; font: 750 11.5px/1.2 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; letter-spacing: 1px; }
    .section { fill: #17345f; font: 750 19px/1.2 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .section-on { fill: #fffdf8; font: 750 19px/1.2 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .card-title { fill: #17345f; font: 750 15.5px/1.2 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .body { fill: #304a71; font: 500 13px/1.4 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .body-strong { fill: #17345f; font: 700 13px/1.4 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .mono { fill: #304a71; font: 650 11px/1.3 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    .mono-on { fill: #fffdf8; font: 700 11px/1.3 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; letter-spacing: .35px; }
    .chip { fill: #fffdf8; stroke: #17345f; stroke-width: 1.5; }
    .chip-text { fill: #17345f; font: 700 12px/1 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .rule { stroke: #7893bc; stroke-width: 1; }
    .arrow { fill: #2855f3; }
    .arrow-coral { fill: #fa7065; }
  </style>

  <rect class="field" width="1600" height="1120"/>
  <rect class="grid" x="20" y="20" width="1560" height="1080" rx="28"/>
  <rect class="frame" x="20" y="20" width="1560" height="1080" rx="28"/>

  <g role="group" aria-labelledby="constellation-heading-title">
    <title id="constellation-heading-title">Program constellation heading</title>
    <path class="header" d="M20 48a28 28 0 0 1 28-28h1504a28 28 0 0 1 28 28v116H20Z"/>
    <text class="eyebrow-on" x="54" y="58">FMI LIMS / ELN · OBJECT GRAMMAR + RELATED PROGRAM SPECIFICATION</text>
    <text class="title" x="54" y="103">Shared laboratory objects become an executable enterprise contract</text>
    <text class="subtitle" x="54" y="134">Historical objects stay source-distinct while the related program turns meaning into bounded services, reusable scenarios, and operating capacity.</text>
  </g>

  <g role="group" aria-labelledby="constellation-scope-title">
    <title id="constellation-scope-title">Source and operating scope</title>
    <text class="eyebrow" x="54" y="191">READING SCOPE</text>
    <rect class="chip powder" x="54" y="204" width="230" height="34" rx="17"/>
    <text class="chip-text" x="76" y="226">Historical FMI object grammar</text>
    <rect class="chip sea" x="296" y="204" width="220" height="34" rx="17"/>
    <text class="chip-text" x="318" y="226">Candidate spec-v0.3.0</text>
    <rect class="chip pale" x="528" y="204" width="288" height="34" rx="17"/>
    <text class="chip-text" x="550" y="226">Selected reality · closed in simulation</text>
    <rect class="chip cream" x="828" y="204" width="318" height="34" rx="17"/>
    <text class="chip-text" x="850" y="226">Environment-observed acceptance · open</text>
    <rect class="chip acid" x="1158" y="204" width="388" height="34" rx="17"/>
    <text class="chip-text" x="1180" y="226">Production authorization · environment-specific</text>
  </g>

  <g role="group" aria-labelledby="objects-title">
    <title id="objects-title">Historical FMI shared laboratory object grammar</title>
    <rect class="shadow" x="62" y="282" width="270" height="474" rx="17"/>
    <rect class="panel" x="54" y="274" width="270" height="474" rx="17"/>
    <path class="powder" d="M71 274h236a17 17 0 0 1 17 17v76H54v-76a17 17 0 0 1 17-17Z"/>
    <text class="eyebrow" x="76" y="304">HISTORICAL FMI SITE READING</text>
    <text class="section" x="76" y="337">Shared object grammar</text>
    <text class="body" x="76" y="358">Named before system selection</text>

    <rect class="card" x="76" y="386" width="226" height="58" rx="10"/>
    <text class="card-title" x="94" y="411">Sample</text>
    <text class="mono" x="94" y="431">identity · state · custody</text>

    <rect class="card" x="76" y="454" width="226" height="58" rx="10"/>
    <text class="card-title" x="94" y="479">Plate</text>
    <text class="mono" x="94" y="499">containment · position · move</text>

    <rect class="card" x="76" y="522" width="226" height="58" rx="10"/>
    <text class="card-title" x="94" y="547">Reagent</text>
    <text class="mono" x="94" y="567">lot · thaw · qualified use</text>

    <rect class="card" x="76" y="590" width="226" height="58" rx="10"/>
    <text class="card-title" x="94" y="615">Run / worklist</text>
    <text class="mono" x="94" y="635">assignment · progression</text>

    <rect class="card" x="76" y="658" width="226" height="66" rx="10"/>
    <text class="card-title" x="94" y="683">Sign-off / approval</text>
    <text class="mono" x="94" y="703">actor · reason · meaning</text>
  </g>

  <path class="arrow" aria-hidden="true" d="M336 486H342V472L364 500L342 528V514H336Z"/>

  <g role="group" aria-labelledby="boundaries-title">
    <title id="boundaries-title">Service and application boundaries defined by the related program specification</title>
    <rect class="shadow" x="374" y="282" width="350" height="474" rx="17"/>
    <rect class="panel" x="366" y="274" width="350" height="474" rx="17"/>
    <path class="sea" d="M383 274h316a17 17 0 0 1 17 17v76H366v-76a17 17 0 0 1 17-17Z"/>
    <text class="eyebrow" x="388" y="304">RELATED PROGRAM SPECIFICATION</text>
    <text class="section" x="388" y="337">Service-owned boundaries</text>
    <text class="body" x="388" y="358">Meaning, effect, evidence, recovery</text>

    <rect class="card pale" x="388" y="386" width="306" height="112" rx="11"/>
    <text class="eyebrow" x="406" y="410">LIFECYCLE + CUSTODY</text>
    <text class="card-title" x="406" y="434">One attributable scientific effect</text>
    <text class="body" x="406" y="457">Actor, reason, revisions, and event time.</text>
    <text class="body" x="406" y="476">Position and event commit with the</text>
    <text class="body" x="406" y="493">pending integration message.</text>

    <rect class="card cream" x="388" y="504" width="306" height="112" rx="11"/>
    <text class="eyebrow" x="406" y="528">INGRESS + VENDOR ADAPTERS</text>
    <text class="card-title" x="406" y="552">Raw evidence stays connected</text>
    <text class="body" x="406" y="575">Bytes, digest, parsed observation,</text>
    <text class="body" x="406" y="594">disposition, and recovery owner.</text>
    <text class="mono" x="406" y="612">SAPIO · BENCHLING · LABKEY</text>

    <rect class="card blush" x="388" y="628" width="306" height="96" rx="11"/>
    <text class="eyebrow" x="406" y="652">BOUNDED CALLERS + ACCEPTANCE</text>
    <text class="card-title" x="406" y="676">Released operations set the ceiling</text>
    <text class="body" x="406" y="699">Read · narrow idempotent correction ·</text>
    <text class="body" x="406" y="718">approval-gated migration cutover.</text>
  </g>

  <path class="arrow" aria-hidden="true" d="M728 486H736V472L758 500L736 528V514H728Z"/>

  <g role="group" aria-labelledby="scenarios-title">
    <title id="scenarios-title">Specified outcomes and testable operating expectations in the related program specification</title>
