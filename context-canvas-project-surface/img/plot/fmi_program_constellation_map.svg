    <rect class="shadow" x="1194" y="282" width="352" height="474" rx="17"/>
    <rect class="panel" x="1186" y="274" width="352" height="474" rx="17"/>
    <path class="blush" d="M1203 274h318a17 17 0 0 1 17 17v76h-352v-76a17 17 0 0 1 17-17Z"/>
    <text class="eyebrow" x="1208" y="304">ENTERPRISE ABILITY + INVESTMENT</text>
    <text class="section" x="1208" y="337">Fund the durable capability</text>
    <text class="body-strong" x="1208" y="358">Changed work persists beyond selection.</text>

    <rect class="card" x="1208" y="386" width="308" height="78" rx="11"/>
    <text class="card-title" x="1226" y="410">Decision-grade scientific state</text>
    <text class="body" x="1226" y="433">One current state; history reconstructable.</text>
    <text class="mono" x="1226" y="452">SUSTAIN · scientific data ownership</text>

    <rect class="card" x="1208" y="476" width="308" height="78" rx="11"/>
    <text class="card-title" x="1226" y="500">Recoverable custody and ingress</text>
    <text class="body" x="1226" y="523">Locate specimens; trace exact received bytes.</text>
    <text class="mono" x="1226" y="542">SUSTAIN · lab ops + integration</text>

    <rect class="card" x="1208" y="566" width="308" height="72" rx="11"/>
    <text class="card-title" x="1226" y="590">Qualification beyond feature fit</text>
    <text class="body" x="1226" y="613" style="font-size:12.5px">Platform fit stays distinct from adapter behavior.</text>
    <text class="mono" x="1226" y="632">SUSTAIN · vendor conformance</text>

    <rect class="card" x="1208" y="650" width="308" height="74" rx="11"/>
    <text class="card-title" x="1226" y="674">Meaning survives move and restore</text>
    <text class="body" x="1226" y="697">Identity · lineage · signatures · artifacts</text>
    <text class="mono" x="1226" y="716">SUSTAIN · platform + Quality + Regulatory</text>
  </g>

  <g role="group" aria-labelledby="repository-title">
    <title id="repository-title">Repository surfaces that carry the program contract</title>
    <rect class="shadow" x="62" y="800" width="1484" height="142" rx="17"/>
    <rect class="panel" x="54" y="792" width="1484" height="142" rx="17"/>
    <path class="cobalt-fill" d="M71 792h1450a17 17 0 0 1 17 17v38H54v-38a17 17 0 0 1 17-17Z"/>
    <text class="mono-on" x="76" y="818">REPOSITORY ORGANIZATION · CONTRACT-BEARING SURFACES</text>
    <text class="subtitle" x="76" y="838">urn:source-key:lims-eln-program-specification</text>

    <rect class="card powder" x="76" y="858" width="214" height="54" rx="9"/>
    <text class="card-title" x="92" y="881">charter/</text>
    <text class="mono" x="92" y="900">intended use · success state</text>

    <rect class="card sea" x="302" y="858" width="248" height="54" rx="9"/>
    <text class="card-title" x="318" y="881">specifications/</text>
    <text class="mono" x="318" y="900">capabilities · invariants · callers</text>

    <rect class="card acid" x="562" y="858" width="206" height="54" rx="9"/>
    <text class="card-title" x="578" y="881">examples/</text>
    <text class="mono" x="578" y="900">16 executable scenarios</text>

    <rect class="card cream" x="780" y="858" width="210" height="54" rx="9"/>
    <text class="card-title" x="796" y="881">acceptance/</text>
    <text class="mono" x="796" y="900" style="font-size:10px">decision surfaces · named roles</text>

    <rect class="card pale" x="1002" y="858" width="278" height="54" rx="9"/>
    <text class="card-title" x="1018" y="881">simulations/ + forecasts/</text>
    <text class="mono" x="1018" y="900">simulated runtime · bounded scenarios</text>

    <rect class="card blush" x="1292" y="858" width="224" height="54" rx="9"/>
    <text class="card-title" x="1308" y="881">tests/</text>
    <text class="mono" x="1308" y="900">stable IDs · reference behavior</text>
  </g>

  <g role="group" aria-labelledby="technology-title">
    <title id="technology-title">Source-backed program toolchain and named technology boundaries</title>
    <rect class="shadow" x="62" y="974" width="462" height="100" rx="15"/>
    <rect class="panel powder" x="54" y="966" width="462" height="100" rx="15"/>
    <text class="eyebrow" x="76" y="993">PROGRAM TOOLCHAIN</text>
    <text class="card-title" x="76" y="1019">Python 3.12+ · JSON contracts · YAML status</text>
    <text class="body" x="76" y="1043">Standard-library validation and unittest coverage</text>

    <rect class="shadow" x="540" y="974" width="516" height="100" rx="15"/>
    <rect class="panel sea" x="532" y="966" width="516" height="100" rx="15"/>
    <text class="eyebrow" x="554" y="993">NAMED SERVICE BOUNDARIES</text>
    <text class="card-title" x="554" y="1019">Sapio · Benchling · LabKey · AWS Parameter Store</text>
    <text class="body" x="554" y="1043">AWS Secrets Manager + KMS carry protected runtime values.</text>

    <rect class="shadow" x="1072" y="974" width="474" height="100" rx="15"/>
    <rect class="panel cream" x="1064" y="966" width="474" height="100" rx="15"/>
    <text class="eyebrow" x="1086" y="993">SELECTED SIMULATED RUNTIME</text>
    <text class="card-title" x="1086" y="1019">PostgreSQL · idempotency · outbox / inbox</text>
    <text class="body" x="1086" y="1043">OpenTelemetry traces, metrics, and structured logs</text>
  </g>
</svg>
